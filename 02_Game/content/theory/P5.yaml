# Chapter 5 of the theory section, "Labour market, unemployment and the Phillips relation". Its texts are written from three textbooks
# (references.yaml) and name the section they rest on at the end of every paragraph. They use the glossary's terms and
# explanations, "government spending" and "the rate the economy needs", and they do not mention a game.
#   chapter  id, title, the learning objectives
#   cards    the term cards: term, core (the explanation; the glossary's own, lower case, where `glossary: true`), example,
#            aliases, see_also (a preview card's full card), box (false: never shown as a box), step (where the text defines it)
#   topics   id, title, objectives, steps: id, sources ({key, loc} into references.yaml), text (Markdown: [label](term:P4:id)
#            marks a term, [label](theory:P2-s1d) links a chapter, topic or step), module (one of the modules of modules.yaml
#            with this step's controls and view), figure (a static figure drawn from economy.yaml)

chapter:
  id: P5
  title: "Labour market, unemployment and the Phillips relation"
  objectives:
    LO1: "Explain how unemployment is measured: the labour force, the participation rate and the unemployment rate, and who counts as unemployed."
    LO2: "Explain unemployment as the result of flows into and out of jobs, and why the rate settles where u* = s/(s + f)."
    LO3: "Explain how wages are set and why the wage obtained falls as unemployment rises and rises with the expected price level."
    LO4: "Explain price setting with a markup, how wage setting and price setting together determine the natural rate of unemployment, and why the flow and the wage-setting/price-setting explanations complement each other."
    LO5: "Explain Okun's law, the link between output growth and changes in unemployment."
    LO6: "Explain why nominal wages rarely fall and what this implies for real wages and for a small positive inflation rate."
    LO7: "Explain the Phillips relation between unemployment and inflation, the role of expected inflation, and why unemployment cannot stay below the natural rate without rising inflation."

cards:
  working_age_population: {term: "Working-age population", core: "Everyone old enough to work, in the example economy everyone aged 15 or over.", box: false, step: s1a}
  labour_force: {term: "Labour force (L)", core: "Everyone who has a job or is actively looking for one. People who neither work nor look for work, such as most students and retirees, are outside it.", example: "Of 16,000 people of working age, 9,600 work and 400 look for work: a labour force of 10,000.", step: s1a}
  participation_rate: {term: "Participation rate", core: "The share of the working-age population that takes part in the labour market, by working or by looking for work.", example: "10,000 of 16,000 people of working age: 62.5%.", step: s1a}
  unemployment_rate: {term: "Unemployment rate (u)", core: "the share of people who want to work but have no job", example: "400 of a labour force of 10,000 are looking in vain: 4%.", glossary: true, step: s1b}
  discouraged_workers: {term: "Discouraged workers", core: "People who would like a job but have stopped looking because they expect to find none. They leave the labour force, so the unemployment rate falls although nobody found work.", example: "If 100 of the 400 unemployed give up, the rate falls from 4% to 3%.", step: s1b}
  job_separation_rate: {term: "Job-separation rate (s)", core: "The share of people with a job who lose or leave it in a month, through dismissals, closures or quitting.", example: "Each month 96 of the 9,600 employed lose their job: 1%.", step: s2a}
  job_finding_rate: {term: "Job-finding rate (f)", core: "The share of unemployed people who find a job in a month. It is high when firms hire a lot and low in a slump.", example: "Each month 96 of the 400 unemployed find work: 24%.", step: s2a}
  steady_state_unemployment: {term: "Steady-state unemployment rate", core: "The unemployment rate at which as many people find jobs each month as lose them, so the rate stays put although people keep moving in and out of jobs.", example: "96 people lose their job and 96 find one each month: unemployment stays at 4%.", aliases: ["steady state"], step: s2a}
  unemployment_duration: {term: "Duration of unemployment", core: "How long a person stays unemployed, on average about one divided by the monthly job-finding rate.", box: false, step: s2b}
  frictional_unemployment: {term: "Frictional unemployment", core: "Unemployment that arises because finding a suitable job takes time, even when jobs are available: people search, compare and move.", example: "A baker who left one bakery spends three months finding the right job in another.", step: s2b}
  real_wage: {term: "Real wage", core: "wages measured by what they can buy", example: "A wage of $62,500 at a price level of 1 buys as much as $63,750 when prices are 2% higher.", aliases: ["real wages"], glossary: true, step: s3a}
  bargaining_power: {term: "Bargaining power", core: "How strong workers' position is when wages are agreed: how easily they could find another job, or how costly it would be for the firm to replace them.", example: "When few people are out of work, the bakery's staff know they could quickly find a job elsewhere.", step: s3a}
  reservation_wage: {term: "Reservation wage", core: "The lowest wage at which a person is willing to take a job rather than stay unemployed. It depends on what the person can live on without work.", example: "A worker whose unemployment benefit is generous will turn down a poorly paid job.", step: s3a}
  efficiency_wage: {term: "Efficiency wage", core: "A wage that a firm pays above the lowest wage it could get away with, because better-paid workers quit less, work harder and are more loyal.", example: "The mill pays more than it must, so that its trained millers do not move to the bakery.", step: s3a}
  expected_price_level: {term: "Expected price level (Pᵉ)", core: "The price level that wage setters expect over the period of the wage agreement.", box: false, step: s3b}
  wage_setting_factors: {term: "Wage-setting factors (z)", core: "Everything besides unemployment that strengthens workers' position in wage talks, such as unemployment benefits or protection against dismissal. When they rise, workers ask for more at any unemployment rate.", example: "Higher unemployment benefits let the unemployed wait for a better offer, so wage claims rise.", step: s3b}
  wage_setting_relation: {term: "Wage-setting relation (WS)", core: "How the real wage that workers obtain depends on unemployment: when many people look for work, workers are in a weaker position and settle for less.", example: "At 4% unemployment workers obtain $62,500; at 6% only $61,875.", step: s3b}
  labour_productivity: {term: "Labour productivity", core: "How much an average worker produces in a year, measured as output divided by the number of workers.", example: "Output of $900 million made by 9,600 workers: $93,750 per worker.", step: s4a}
  markup: {term: "Markup", core: "How much more firms charge than their costs, here than their labour costs. Firms that face little competition can charge more.", example: "Wages of $600 million, sales of $900 million: prices are 50% above labour costs.", step: s4a}
  price_setting_relation: {term: "Price-setting relation (PS)", core: "The real wage that firms' prices leave for workers: what a worker produces, less the firm's markup. It does not depend on unemployment.", example: "A worker produces $93,750 a year; with a 50% markup, prices leave a real wage of $62,500.", step: s4a}
  natural_rate: {term: "Natural rate of unemployment (uₙ)", core: "the unemployment rate the economy settles at once wages have adjusted", example: "Wage setting and price setting agree at 4% unemployment.", aliases: ["natural rate", "natural rates"], glossary: true, step: s4b}
  natural_employment: {term: "Natural employment", core: "The number of people with a job once unemployment has settled at its natural rate.", example: "With a labour force of 10,000 and a natural rate of 4%: 9,600 people.", step: s4b}
  structural_unemployment: {term: "Structural unemployment", core: "Unemployment that lasts because wages settle above the level at which everyone looking for work would be hired, for reasons built into the labour market rather than a passing slump.", example: "Workers' strong position in wage talks keeps 4% of the labour force without a job even in normal times.", step: s4b}
  okuns_law: {term: "Okun's law", core: "The rule of thumb that unemployment falls when output grows faster than normal and rises when it grows more slowly, because firms need more or fewer workers.", example: "Output grows by 4% instead of the normal 2%: unemployment falls by one point.", step: s5a}
  normal_growth_rate: {term: "Normal growth rate", core: "The growth of output at which unemployment stays the same, because the extra output needs exactly the extra workers and productivity the economy gains each year.", example: "In the example economy, output must grow by 2% a year to keep unemployment at 4%.", step: s5a}
  cyclical_unemployment: {term: "Cyclical unemployment", core: "Unemployment above or below the natural rate because output has grown faster or slower than normal; it disappears when the economy returns to normal.", example: "After a year without growth, unemployment is 5%: one point is cyclical.", step: s5b}
  downward_nominal_wage_rigidity: {term: "Downward nominal wage rigidity", core: "The fact that wages, counted in dollars, are rarely cut even when demand is weak, while they are often raised.", example: "The bakery's sales fall, but it keeps wages at $62,500 rather than cutting them.", step: s6a}
  reference_wage: {term: "Reference wage", core: "The wage a worker compares any new offer with, usually the current wage.", example: "A baker earning $62,500 sees $61,250 as a cut, but $62,500 with prices 2% higher as no change.", step: s6a}
  grease_effect: {term: "\"Grease\" effect of inflation", core: "The way moderate inflation lets real wages fall where they must without anyone's pay being cut: wages stay put in dollars while prices rise.", example: "Prices rise 2% and the bakery freezes pay: the real wage falls 2%, and nobody's wage is cut.", aliases: ["grease effect"], step: s6b}
  phillips_curve: {term: "Phillips curve", core: "The observation that inflation tends to be high when unemployment is low, and low when unemployment is high: a tight labour market pushes up wages and with them prices.", example: "In the example economy, 3% unemployment goes with 2.5% inflation, 5% with 1.5%.", aliases: ["Phillips curves"], step: s7a}
  expectations_augmented_phillips: {term: "Expectations-augmented Phillips relation", core: "Inflation equals the inflation people expect, plus a push when unemployment is below its natural rate. Wage setters build expected inflation into their claims; a tight labour market adds more.", example: "Expected inflation 2%, unemployment one point below normal: inflation 2.5%.", aliases: ["Phillips relation"], step: s7b}
  anchored_expectations: {term: "Anchored inflation expectations", core: "Expectations of inflation that stay at the central bank's target even when inflation moves for a while, because people trust the bank to bring it back.", example: "Inflation rises to 2.5%, but wage setters still expect 2% for next year.", step: s7c}
  nairu: {term: "NAIRU", core: "Non-accelerating-inflation rate of unemployment: another name for the natural rate, stressing that only there does inflation stay steady when expectations follow past inflation.", example: "Below 4% unemployment, inflation rises year after year; at 4% it stays put.", step: s7b}
  inflation_inertia: {term: "Inflation inertia", core: "Inflation's tendency to persist: when people expect this year's inflation to continue, they set wages and prices accordingly, so it does continue.", example: "Inflation of 3% last year leads wage setters to build 3% into this year's claims.", step: s7c}
  search_and_matching: {term: "Search and matching", core: "A theory in which job finding depends on how many jobs are open and how many people search: firms and workers need time to find each other.", example: "When firms open more vacancies, the unemployed find jobs faster.", step: s2b}
  hysteresis: {term: "Hysteresis", core: "The idea that a long period of high unemployment can raise the natural rate itself, so unemployment does not return to its old level when the cause has gone.", example: "After a slump, the workers who kept their jobs bargain for their own pay, and unemployment stays high.", step: s4c}
  insiders_outsiders: {term: "Insiders and outsiders", core: "Insiders are workers who have a job and take part in wage talks; outsiders are the unemployed, whose interests the talks may ignore.", example: "The bakery's staff bargain for higher pay, not for jobs for the unemployed.", aliases: [insiders, outsiders], step: s4c}
  stagflation: {term: "Stagflation", core: "High inflation and high unemployment at the same time, as in many economies in the 1970s.", box: false, step: s7a}
  cost_push_shock: {term: "Cost-push shock", core: "a change in firms' costs, for example for energy, that firms pass on to their prices", example: "The markup rises from 50% to 51%: at 4% unemployment, inflation rises by about two thirds of a point.", aliases: ["cost-push shocks", "supply shock", "supply shocks"], glossary: true, step: s7b}
  wage_inflation: {term: "Wage inflation", core: "how fast wages rise, in percent a year", glossary: true, step: s7a}

topics:

  - id: s1
    title: "Measuring Unemployment"
    objectives: [LO1]
    steps:
      - id: s1a
        sources:
          - {key: mankiw_2019, loc: "2-3"}
          - {key: blanchard_illing_2017, loc: "2.3, 2.5"}
        text: |
          ### Who belongs to the labour force

          Suppose the statistics office of the example economy reports that output grew by 4% last year, that
          unemployment fell from 4% to 3%, and that inflation rose from 2% to 2.5%. This chapter explains each
          number, and [its last topic](theory:P5-s7c) returns to the report.

          The chapter belongs to the [medium run](term:P3:medium_run), in which the economy returns to the level
          of output that supply allows (Blanchard & Illing, 2017, 2.5).

          Statisticians start from the **[working-age population](term:P5:working_age_population)** and sort it
          into three groups: the employed, the unemployed, and those who are neither, such as full-time students
          and retirees. The employed and the unemployed together are the **[labour
          force](term:P5:labour_force)** L. The **[participation rate](term:P5:participation_rate)** is the
          share of the working-age population that belongs to it (Mankiw, 2019, 2-3; Blanchard & Illing, 2017,
          2.3).

          The example economy has 20,000 inhabitants. Of the 16,000 people of working age, 9,600 have a job and
          400 are looking for one, so the labour force is 10,000 and the participation rate 10,000 / 16,000 =
          62.5%. The remaining 6,000 are outside the labour force.
        figure: {kind: labour_force, description: "The population of the example economy split into those below working age, people outside the labour force, the employed and the unemployed."}
      - id: s1b
        sources:
          - {key: mankiw_2019, loc: "2-3"}
          - {key: blanchard_illing_2017, loc: "2.3"}
        text: |
          ### Who counts as unemployed

          The **[unemployment rate](term:P5:unemployment_rate)** u states the unemployed as a share of the
          labour force (Mankiw, 2019, 2-3).

          > u = unemployed / labour force

          The word is used more narrowly than in everyday speech: a person counts as unemployed only if he or
          she has no job and is looking for one. The figures come from a regular survey of households (Mankiw,
          2019, 2-3).

          Some people would like a job but have stopped searching. As **[discouraged
          workers](term:P5:discouraged_workers)** they are counted outside the labour force, and the
          unemployment rate does not include them (Mankiw, 2019, 2-3). In bad times people also drop out of the
          labour force altogether, so the unemployment rate alone can make the labour market look better than it
          is (Blanchard & Illing, 2017, 2.3).

          In the example economy, u = 400 / 10,000 = 4%. If 100 of the 400 unemployed give up, the labour force
          shrinks to 9,900 and the rate falls to 300 / 9,900 = 3.0%, although nobody has found a job.

  - id: s2
    title: "Flows in the Labour Market"
    objectives: [LO2]
    steps:
      - id: s2a
        sources:
          - {key: mankiw_2019, loc: "7-1"}
        text: |
          ### Separations, job finding and the steady state

          An [unemployment rate](term:P5:unemployment_rate) looks like a fixed pool of people. In fact the pool
          is emptied and refilled all the time: every month some of the employed lose or leave their jobs, and
          some of the unemployed find one (Mankiw, 2019, 7-1).

          A simple model captures this. The [labour force](term:P5:labour_force) is fixed. Each month a share s
          of those in work lose their job, the **[job-separation rate](term:P5:job_separation_rate)**, while a
          share f of those out of work find one, the **[job-finding rate](term:P5:job_finding_rate)**.
          Unemployment stays the same when as many people find a job as lose one. This condition gives the
          **[steady-state unemployment rate](term:P5:steady_state_unemployment)** (Mankiw, 2019, 7-1).

          > u* = s / (s + f)

          Unemployment is higher when more people lose their jobs, and when the unemployed find jobs more slowly
          (Mankiw, 2019, 7-1).

          In the example economy, s = 1% and f = 24%. Each month 96 of the 9,600 employed lose their job and 96
          of the 400 unemployed find one, so unemployment stays at 0.01 / (0.01 + 0.24) = 4%.
        module: {kind: labour_flows, controls: []}
      - id: s2b
        sources:
          - {key: blanchard_illing_2017, loc: "7.1, 24.4"}
          - {key: mankiw_2019, loc: "7-1, 7-2"}
        text: |
          ### Duration and frictional unemployment

          The job-finding rate also shows how long people stay unemployed. The average **[duration of
          unemployment](term:P5:unemployment_duration)** is the inverse of the share of the unemployed who leave
          unemployment each month (Blanchard & Illing, 2017, 7.1, p. 222).

          Even in good times unemployment is not zero, because finding a job takes time: jobs differ in what
          they demand and what they pay, so a job seeker may turn down the first offer. This is **[frictional
          unemployment](term:P5:frictional_unemployment)** (Mankiw, 2019, 7-2). The research on **[search and
          matching](term:P5:search_and_matching)** studies these frictions (Blanchard & Illing, 2017, 24.4).

          In the example economy, an average spell lasts a little over four months (1 / 0.24). If firms hire
          more slowly and the job-finding rate falls to 16%, the steady state rises to 0.01 / (0.01 + 0.16) =
          5.9%. Unemployment moves there step by step: in the first month 96 people lose their job, but only 64
          find one. Change s and f in the diagram below.

          The model does not say why there is unemployment at all, the question of the next topics (Mankiw,
          2019, 7-1).
        module: {kind: labour_flows, controls: [s, f]}

  - id: s3
    title: "Wage Setting"
    objectives: [LO3]
    steps:
      - id: s3a
        sources:
          - {key: blanchard_illing_2017, loc: "7.3"}
          - {key: mankiw_2019, loc: "7-3"}
        text: |
          ### How wages are set

          What matters to workers is the **[real wage](term:P5:real_wage)**, the wage measured by what it can
          buy (Blanchard & Illing, 2017, 7.3).

          Wages are set in many ways, by collective bargaining, between a firm and a single worker, or by the
          firm alone. Whatever the procedure, pay responds to the labour market and is higher when unemployment
          is low. And it usually lies above the **[reservation wage](term:P5:reservation_wage)**, the lowest
          wage for which a person would rather work than be without a job (Blanchard & Illing, 2017, 7.3).

          Two accounts explain why. Workers have **[bargaining power](term:P5:bargaining_power)**, with or
          without a union behind them, and they use it (Blanchard & Illing, 2017, 7.3). And employers can gain
          from generous pay themselves: an **[efficiency wage](term:P5:efficiency_wage)** above the lowest
          possible level makes workers more productive, which can explain why firms do not cut wages even when
          many people are looking for work (Mankiw, 2019, 7-3).

          In the example economy, the average worker earns $62,500 a year.
      - id: s3b
        sources:
          - {key: blanchard_illing_2017, loc: "7.3, 7.5"}
        text: |
          ### The wage-setting relation

          Three things shape the wage that is set (Blanchard & Illing, 2017, 7.3).

          - Unemployment. When many people are looking for work, wage setters settle for less.
          - The **[wage-setting factors](term:P5:wage_setting_factors)** z, a catch-all for everything else that
            affects the outcome.
          - The **[expected price level](term:P5:expected_price_level)** Pᵉ. Wages are fixed in dollars for some
            time ahead, while both sides care about what the wage will buy. Higher expected prices therefore
            mean higher wages.

          Together they give the **[wage-setting relation](term:P5:wage_setting_relation)** (WS): the real wage
          that wage setting produces falls as unemployment rises (Blanchard & Illing, 2017, 7.5).

          In the example economy, wage setting gives a real wage of $63,750 − $312.50 × u, with u in percent. At
          4% unemployment workers obtain $62,500, at 6% only $61,875.

  - id: s4
    title: "Price Setting and the Natural Rate of Unemployment"
    objectives: [LO4]
    steps:
      - id: s4a
        sources:
          - {key: blanchard_illing_2017, loc: "7.5"}
          - {key: legge_2023, loc: "5.4"}
        text: |
          ### Price setting

          Prices are not set at cost. Because firms have some market power, they add a
          **[markup](term:P5:markup)**, and the larger it is, the less a given wage buys: the [real
          wage](term:P5:real_wage) is lower (Blanchard & Illing, 2017, 7.5).

          The cost of one unit of output is the wage divided by **[labour
          productivity](term:P5:labour_productivity)**, the output of one worker. The price is this cost raised
          by the markup. Solved for the real wage, this is the **[price-setting
          relation](term:P5:price_setting_relation)** (PS) (Legge, 2023, 5.4).

          > real wage allowed by prices = labour productivity / (1 + markup)

          The real wage that price setting leaves does not depend on unemployment (Blanchard & Illing, 2017,
          7.5).

          In the example economy, 9,600 workers produce [output](term:P1:output_GDP) of $900 million, $93,750
          each. Firms pay wages of $600 million, so prices are 50% above labour costs, and the real wage that
          prices leave is $93,750 / 1.5 = $62,500.
      - id: s4b
        sources:
          - {key: blanchard_illing_2017, loc: "7.5, Chapter 7"}
          - {key: mankiw_2019, loc: "7-3"}
        text: |
          ### The natural rate of unemployment

          Wage setting and price setting each give a real wage. Both can hold only at one [unemployment
          rate](term:P5:unemployment_rate), the **[natural rate of unemployment](term:P5:natural_rate)** uₙ
          (Blanchard & Illing, 2017, 7.5).

          In the example economy, $63,750 − $312.50 × u = $62,500 gives u = 4%. **[Natural
          employment](term:P5:natural_employment)** is 96% of the [labour force](term:P5:labour_force) of
          10,000, that is 9,600 people.

          Over the medium run, unemployment is drawn back to this rate again and again (Blanchard & Illing,
          2017, Chapter 7). Its name misleads, though. Institutions and policy shape it, through the
          wage-setting factors and the markup (Blanchard & Illing, 2017, 7.5).

          Unemployment that arises because the real wage stays above the level at which the supply of labour
          equals the demand for it is called **[structural unemployment](term:P5:structural_unemployment)**
          (Mankiw, 2019, 7-3).
        module: {kind: ws_ps, controls: []}
      - id: s4c
        sources:
          - {key: blanchard_illing_2017, loc: "7.5"}
          - {key: mankiw_2019, loc: "7-1, 7-3, 14-2"}
        text: |
          ### What changes the natural rate, and how the two explanations fit together

          Whatever shifts [wage setting](term:P5:wage_setting_relation) or price setting moves the natural rate.
          More generous unemployment benefits soften the loss of a job, so wages are set higher at any
          unemployment rate, and only more unemployment brings them back to what prices allow. A larger markup
          shrinks what prices allow instead (Blanchard & Illing, 2017, 7.5).

          In the example economy, benefits that raise wage claims by $625 at every unemployment rate give
          $64,375 − $312.50 × u, and the natural rate rises to 6%. A markup of 51% instead of 50% leaves a real
          wage of $62,086, and the natural rate rises to about 5.3%. Try both in the diagram below.

          **[Insiders](term:P5:insiders_outsiders)**, who have a job, try to keep wages high; outsiders, the
          unemployed, bear part of the cost (Mankiw, 2019, 7-3). **[Hysteresis](term:P5:hysteresis)** names the
          idea that a recession can leave a lasting mark on the natural rate (Mankiw, 2019, 14-2).

          The flow model of the earlier topic shows how unemployment moves. Wage setting and price setting add
          why there is unemployment at all (Mankiw, 2019, 7-1, 7-3).
        module: {kind: ws_ps, controls: [z, markup]}

  - id: s5
    title: "Okun's Law"
    objectives: [LO5]
    steps:
      - id: s5a
        sources:
          - {key: mankiw_2019, loc: "10-1"}
          - {key: blanchard_illing_2017, loc: "9.1"}
        text: |
          ### Output growth and unemployment

          People in work add to production, people out of work do not, so unemployment rises when
          [output](term:P1:output_GDP) grows slowly and falls when it grows fast. Arthur Okun was the first to
          examine this link, which is known as **[Okun's law](term:P5:okuns_law)** (as cited in Mankiw, 2019,
          10-1).

          Unemployment stays the same only if output grows at the **[normal growth
          rate](term:P5:normal_growth_rate)**, since the labour force and productivity grow. Only faster growth
          lowers it (Blanchard & Illing, 2017, 9.1).

          > change in u = − coefficient × (g − normal growth)

          The books give different numbers. For the United States, Mankiw finds that a point of extra growth
          lowers unemployment by half a point, with normal growth of 3% (Mankiw, 2019, 10-1). Blanchard and
          Illing estimate a coefficient of 0.37 for the United States and of 0.19 for Germany (Blanchard &
          Illing, 2017, 9.1, p. 288).

          In the example economy, normal growth is 2% and the coefficient 0.5. If output grows by 4%,
          unemployment falls by 0.5 × (4 − 2) = 1 point. Without growth, it rises by one point.
        figure: {kind: okun, description: "The change in unemployment against output growth in the example economy, with the worked points of the text."}
      - id: s5b
        sources:
          - {key: mankiw_2019, loc: "14-2"}
          - {key: blanchard_illing_2017, loc: "9.1"}
        text: |
          ### Cyclical unemployment and the size of the coefficient

          The gap between unemployment and its [natural rate](term:P5:natural_rate) is **[cyclical
          unemployment](term:P5:cyclical_unemployment)** (Mankiw, 2019, 14-2).

          In the example economy, unemployment is 5% after a year without growth: one point of it is cyclical.

          Why does unemployment move by less than output? Blanchard and Illing give two reasons. Firms do not
          answer every change in demand by hiring or dismissing. Recruiting and training cost money, so they
          hold on to staff through a weak spell and stretch hours before they hire in a strong one. And new jobs
          do not all go to the unemployed, because a livelier labour market also draws in people who had not
          been looking for work (Blanchard & Illing, 2017, 9.1).

  - id: s6
    title: "Downward Wage Rigidity"
    objectives: [LO6]
    steps:
      - id: s6a
        sources:
          - {key: mankiw_2019, loc: "5-5"}
          - {key: blanchard_illing_2017, loc: "8.4"}
        text: |
          ### Why nominal wages rarely fall

          Cuts of wages in dollars are rare: firms shy away from them, and workers resist them. This is
          **[downward nominal wage rigidity](term:P5:downward_nominal_wage_rigidity)** (Mankiw, 2019, 5-5).

          In real terms, a pay cut of 2% while prices are stable equals a rise of 3% while
          [inflation](term:P4:inflation_rate) runs at 5%. Workers take the first much harder. A cut of the wage
          they have now, their **[reference wage](term:P5:reference_wage)**, is felt as an affront, which a
          small rise is not (Mankiw, 2019, 5-5). On one view, a fall of the [real wage](term:P5:real_wage) is
          tolerated when it comes quietly, through raises that trail inflation, and fought when the wage itself
          is lowered (Blanchard & Illing, 2017, 8.4).

          In the example economy, the bakery employs 2,400 people at an average wage of $62,500. Its sales fall,
          and to keep all its workers it would need its real wage costs to fall by 2%. If prices rise by 2% a
          year, it can freeze pay. If prices are stable, it would have to cut wages by 2% in dollars. It avoids
          the cut and hires fewer people.
      - id: s6b
        sources:
          - {key: mankiw_2019, loc: "5-5"}
          - {key: blanchard_illing_2017, loc: "8.4, 23.3"}
        text: |
          ### Consequences for unemployment and inflation

          Real wages have to fall from time to time for some groups of workers, when the supply of their labour
          rises or the demand for it falls. Where pay cannot be cut in dollars, rising prices are the only way
          for it to fall in real terms. With stable prices the real wage stays too high, and fewer people have
          work. Some economists therefore see in a little inflation a lubricant for the labour market: the
          **["grease" effect of inflation](term:P5:grease_effect)**. With inflation of 2%, a wage that stays the
          same in dollars loses 2% of its buying power each year (Mankiw, 2019, 5-5).

          This is one of the benefits that are weighed against the costs of inflation in the choice of [the
          optimal inflation rate](theory:P4-s5c) (Blanchard & Illing, 2017, 23.3).

          The rigidity also changes how inflation responds to unemployment. Under deflation, [the Phillips
          curve](theory:P5-s7b) may stop working altogether, and workers' refusal to take lower nominal wages is
          one suspected reason (Blanchard & Illing, 2017, 8.4).

  - id: s7
    title: "The Phillips Curve"
    objectives: [LO7]
    steps:
      - id: s7a
        sources:
          - {key: mankiw_2019, loc: "10-5, 14-2"}
          - {key: blanchard_illing_2017, loc: "Chapter 8, 24.2"}
        text: |
          ### The original Phillips curve

          Phillips (1958, as cited in Mankiw, 2019, 14-2) observed in data for the United Kingdom that **[wage
          inflation](term:P5:wage_inflation)**, how fast wages rise, was high when unemployment was low. Two
          years later, Paul Samuelson and Robert Solow found the same pattern between unemployment and
          [inflation](term:P4:inflation_rate) in data for the United States (as cited in Blanchard & Illing,
          2017, Chapter 8). The relation is called the **[Phillips curve](term:P5:phillips_curve)** (Mankiw,
          2019, 14-2).

          In the example economy, the relation is inflation = 2% − 0.5 × (u − 4%). At 4% unemployment inflation
          is 2%, at 3% it is 2.5%, and at 5% it is 1.5%.

          In the 1960s many economists believed that this relation was stable, so that a country could have
          lower unemployment if it accepted higher inflation. By the mid-1970s the belief was gone (Blanchard &
          Illing, 2017, 24.2). A rise in firms' costs can bring falling output together with rising prices,
          which is called **[stagflation](term:P5:stagflation)** (Mankiw, 2019, 10-5).
      - id: s7b
        sources:
          - {key: mankiw_2019, loc: "14-2"}
          - {key: blanchard_illing_2017, loc: "7.3"}
        text: |
          ### Expected inflation and the natural rate

          Wages are set in dollars, so wage setters build in the prices they expect (Blanchard & Illing, 2017,
          7.3). The modern form of the curve therefore contains [expected
          inflation](term:P4:expected_inflation). This is the **[expectations-augmented Phillips
          relation](term:P5:expectations_augmented_phillips)** (Mankiw, 2019, 14-2).

          > inflation = expected inflation − 0.5 × (u − natural rate)

          The coefficient of 0.5 is that of the example economy, where expected inflation is 2%, the [inflation
          target](term:P4:inflation_target): at 3% unemployment inflation is 2.5%, at 5% it is 1.5%.

          When unemployment equals the [natural rate](term:P5:natural_rate), inflation equals expected
          inflation. If people expect last year's inflation, this is the only unemployment rate at which
          inflation neither rises nor falls, so the natural rate is also called the **[NAIRU](term:P5:nairu)**,
          the non-accelerating-inflation rate of unemployment (Mankiw, 2019, 14-2).

          An event that pushes up the costs of production is a **[cost-push shock](term:P5:cost_push_shock)**:
          inflation then rises at every unemployment rate (Mankiw, 2019, 14-2).

          In the example economy, a rise of the [markup](term:P5:markup) from 50% to 51% raises inflation by
          about two thirds of a point at 4% unemployment.
        module: {kind: phillips, controls: [pi_e], view: curve}
      - id: s7c
        sources:
          - {key: blanchard_illing_2017, loc: "9.2"}
          - {key: mankiw_2019, loc: "14-2"}
        text: |
          ### Anchored and unanchored expectations

          What do people expect? Two cases show why the answer matters (Blanchard & Illing, 2017, 9.2).

          - Trust in the [central bank](term:P1:central_bank) can pin expectations down. People then count on
            its inflation target, whatever inflation was last year, and expectations are
            **[anchored](term:P5:anchored_expectations)** (Blanchard & Illing, 2017, 9.2).
          - Or people look backwards and expect this year's price rise to match last year's, so that past
            inflation feeds into today's. This is **[inflation inertia](term:P5:inflation_inertia)**: once under
            way, inflation carries on by itself (Mankiw, 2019, 14-2).

          In the example economy, hold unemployment at 3% for four years. With anchored expectations, inflation
          is 2.5% each year. With expectations that follow last year's inflation, it is 2.5%, then 3.0%, 3.5%
          and 4.0%. Switch between the cases below.

          This explains the report at the start of the chapter: in the example economy, growth of 4% lowers
          unemployment from 4% to 3% by [Okun's law](term:P5:okuns_law), and at 3% unemployment inflation is
          2.5%. Unemployment below the natural rate pushes inflation above what people expect, and if
          expectations begin to follow inflation, inflation keeps rising.
        module: {kind: phillips, controls: [pi_e], view: years}
