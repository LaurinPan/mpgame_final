  - id: s4
    title: "History of macroeconomics"
    objectives: [LO4]
    steps:
      - id: s4a
        sources:
          - {key: neal_cameron_2016}
          - {key: screpanti_zamagni_2005}
          - {key: devroey_2016}
          - {key: blanchard_illing_2021, loc: "ch. 24"}
          - {key: blanchard_2000, loc: "n. 3 (the word appears in the 1940s)"}
        text: |
          ### A young field with old questions

          The questions of [macroeconomics](term:P1:macroeconomics) are old: why some nations are rich and others poor,
          why prices rise, why there are years of plenty and years of want. Macroeconomics as a separate field is young.
          For most of human history, [output](term:P1:output_GDP) per person hardly grew: whenever harvests and
          techniques improved, population rose and living standards returned to roughly their earlier level. Only with
          the **[Industrial Revolution](term:P1:industrial_revolution)**, which began in Britain in the second half of
          the eighteenth century, did output per person start to grow persistently, and economies began to experience
          the regular booms and slumps that we now call the [business cycle](term:P2:business_cycle).

          Economic thought followed these changes. The classical economists of the late eighteenth and early nineteenth
          centuries, beginning with Adam Smith, asked what makes a nation's wealth grow. The Great Depression of the
          1930s forced economists to explain mass unemployment, and the word "macroeconomics" came into use in the
          following decade. The [inflation](term:P1:inflation) of the 1970s, the financial crisis of 2008 and the recent
          surge in inflation each changed the field again. At each station below, a puzzle challenged the existing ideas
          and a new answer shaped the tools that the later chapters use.
        details:
          title: "From the heavy plough to the assembly line: the economic background"
          sources:
            - {key: neal_cameron_2016}
            - {key: gordon_2016}
            - {key: henry_ford_nd, loc: "Ford methods and the Ford shops; Assembly line"}
            - {key: henry_ford_nd, loc: "Henry Ford: $5 Day (collection set)"}
          text: |
            Economic historians describe the [long run](term:P3:long_run) before 1800 as an age of slow, reversible
            progress. In medieval Europe, the heavy wheeled plough, which could turn the dense, wet soils of the north,
            and the three-field rotation, which left only a third instead of half of the land fallow, raised agricultural
            output considerably between roughly the tenth and the thirteenth centuries. Population grew with it, towns and
            long-distance trade revived, and a commercial economy of merchants, fairs and credit instruments developed in
            Italy and the Low Countries. Yet these gains were absorbed by a growing population; plague, famine and war
            repeatedly set [output](term:P1:output_GDP) back (Neal & Cameron, 2016).

            The Industrial Revolution broke this pattern. In Britain from about 1760, mechanised spinning and weaving
            moved textile production into factories, and James Watt's improvements to the steam engine, patented in 1769,
            made power available wherever coal could be brought. The railways carried this change across the economy.
            After the Stockton and Darlington Railway of 1825 and the Liverpool and Manchester Railway of 1830, rail
            networks spread across Britain, continental Europe and North America within a few decades. They cut transport
            costs dramatically, joined regional markets into national ones and created an enormous demand for iron, coal
            and capital, which in turn drove the development of banks and stock markets.

            A second wave of inventions followed from the 1870s: electricity, the internal combustion engine, chemicals,
            the telephone and running water. Gordon (2016) argues that these "great inventions" transformed daily life
            more deeply between 1870 and 1970 than any later innovation. Henry Ford's moving assembly line, introduced at
            his Highland Park plant in 1913, is the emblem of this era. It cut the time needed to assemble a Model T from
            more than twelve hours to about an hour and a half, and the car's price fell so far that the workers who built
            it could buy it. In 1914 Ford doubled pay to five dollars a day to reduce staff turnover. Mass production
            required mass [consumption](term:P2:consumption), and the economy's total spending began to matter as never
            before. When that spending collapsed after 1929, the question of what determines total demand became the
            founding question of [macroeconomics](term:P1:macroeconomics).
      - id: s4b
        sources:
          - {key: devroey_2016}
          - {key: snowdon_vane_2005}
        text: |
          ### Stations of macroeconomic thought

          The stations below follow the development of macroeconomic thought from Adam Smith to the micro-founded models
          used by [central banks](term:P1:central_bank) today. Reveal them one at a time. The sequence is a
          simplification: many new ideas grew out of debates among economists, not only out of crises.
        module: {kind: timeline}
      - id: s4c
        sources:
          - {key: woodford_2009}
          - {key: goodfriend_king_1997}
          - {key: blanchard_2000}
          - {key: blanchard_illing_2021, loc: "ch. 24"}
        text: |
          ### Where macroeconomics stands today

          The history leaves a clear legacy. Today's mainstream models are **micro-founded**: they derive the behaviour
          of the economy from the decisions of households and firms, who form expectations about the future. They
          combine the classical view that the economy tends towards a natural level in the [long run](term:P3:long_run)
          with the Keynesian view that demand drives output in the [short run](term:P3:short_run) because prices and
          wages adjust slowly, the core of [new Keynesian](term:P1:new_keynesian) economics. The debates that produced
          this synthesis are not over, and economists still disagree on important questions. The next topic describes
          the main schools of thought and what divides them.
    stations:        # the timeline of step s4b
      - id: t1
        sources:
          - {key: smith_1776, loc: "Book IV, ch. 2"}
          - {key: keynes_1936, loc: "ch. 2, p. 18"}
          - {key: screpanti_zamagni_2005}
        period: "1776 to the 1860s"
        title: "Classical political economy"
        puzzle: "What makes the wealth of a nation grow?"
        idea: |
          In *The Wealth of Nations* (1776), Adam Smith argued that wealth grows through the division of labour, which
          is limited by the extent of the market, and through the accumulation of capital. Self-interested individuals,
          coordinated by competitive markets, are "led by an invisible hand" to promote the common good. David Ricardo
          and Thomas Malthus studied how income is distributed between wages, profits and rents. Jean-Baptiste Say held
          that production creates the income needed to buy what is produced, so that a general lack of demand is
          impossible; Keynes later summarised this view as "supply creates its own demand". Money, in the tradition of
          David Hume, mattered for prices but not, in the long run, for production.
        figures: ["Adam Smith", "David Ricardo", "Thomas Malthus", "Jean-Baptiste Say", "David Hume"]
        lesson: "The long-run questions of growth and of money and prices return in [chapter 4](theory:P4-s5) and [chapter 6](theory:P6-s3)."
      - id: t2
        sources:
          - {key: screpanti_zamagni_2005}
        period: "1870s to 1920s"
        title: "The marginal revolution and neoclassical economics"
        puzzle: "How do prices coordinate millions of decisions?"
        idea: |
          William Stanley Jevons, Carl Menger and Léon Walras independently explained value by marginal utility: the
          benefit of one more unit of a good. Walras showed how prices in all markets could be determined simultaneously
          in a general equilibrium, and Alfred Marshall's supply and demand became the core of economics teaching.
          Irving Fisher formalised the quantity theory of money. In this view, flexible prices and wages clear all
          markets, including the labour market, so persistent involuntary unemployment cannot arise.
        figures: ["Léon Walras", "Alfred Marshall", "Irving Fisher"]
        lesson: "The idea that prices clear markets in the long run returns in [chapter 4](theory:P4-s5) and [chapter 5](theory:P5-s4)."
      - id: t3
        sources:
          - {key: keynes_1936}
          - {key: hicks_1937}
          - {key: mankiw_2025, loc: "ch. 14 (unemployment in the Great Depression)"}
          - {key: devroey_2016}
        period: "1930s"
        title: "The Great Depression and Keynes"
        puzzle: "Why does mass unemployment last for years?"
        idea: |
          In the early 1930s about a quarter of American workers were unemployed. In *The General Theory of Employment,
          Interest and Money* (1936), John Maynard Keynes argued that in the short run total demand determines
          production and employment. If households and firms spend too little, output and jobs fall, and falling wages
          need not restore full employment, because they also reduce incomes and spending. Governments and central banks
          can therefore stabilise the economy. John Hicks (1937) condensed the argument into the IS-LM model.
        figures: ["John Maynard Keynes", "John Hicks"]
        lesson: "[Chapter 3](theory:P3-s3) shows how demand determines output in the short run."
      - id: t4
        sources:
          - {key: solow_1956}
          - {key: phillips_1958}
          - {key: snowdon_vane_2005}
          - {key: devroey_2016}
        period: "1940s to 1960s"
        title: "The neoclassical synthesis"
        puzzle: "Can the short run and the long run be reconciled?"
        idea: |
          Paul Samuelson and others combined Keynes's short-run analysis with neoclassical long-run theory: demand
          matters when prices are slow to adjust, but in the long run the economy returns to full employment. Robert
          Solow (1956) showed how saving, capital accumulation and technological progress determine long-run growth. A.
          W. Phillips (1958) found that, historically, low unemployment went together with fast wage growth, and many
          economists read this as a stable trade-off that policy could exploit.
        figures: ["Robert Solow", "Paul Samuelson", "A. W. Phillips"]
        lesson: "[Chapter 6](theory:P6-s3) shows what drives production in the long run."
      - id: t5
        sources:
          - {key: friedman_1968}
          - {key: phelps_1967}
          - {key: snowdon_vane_2005}
          - {key: blanchard_illing_2021, loc: "ch. 24"}
        period: "late 1960s to 1970s"
        title: "Monetarism and stagflation"
        puzzle: "Why did inflation and unemployment rise together?"
        idea: |
          Milton Friedman (1968) and Edmund Phelps argued that the Phillips trade-off holds only as long as inflation is
          unexpected. Once people expect inflation, wages and prices adjust, and unemployment returns to its "natural"
          rate. The stagflation of the 1970s, when oil price shocks brought high inflation and high unemployment
          together, seemed to confirm them. Monetarists also held that the private economy is fundamentally stable and
          that inflation is caused by excessive money growth, so that monetary policy should follow a steady rule.
        figures: ["Milton Friedman", "Edmund Phelps"]
        lesson: "[Chapter 5](theory:P5-s7) shows why expectations and the natural rate of unemployment matter."
      - id: t6
        sources:
          - {key: lucas_1976}
          - {key: kydland_prescott_1982}
          - {key: snowdon_vane_2005}
          - {key: devroey_2016}
        period: "1970s to 1980s"
        title: "Rational expectations and new classical economics"
        puzzle: "Can policy systematically fool people?"
        idea: |
          Robert Lucas argued that people form expectations rationally, using all available information, and that they
          change their behaviour when policy changes. A model estimated under an old policy can therefore give wrong
          answers about a new one ([the Lucas critique](term:P1:lucas_critique), 1976). Macroeconomic models should be
          built from the decisions of households and firms. Finn Kydland and Edward Prescott (1982) went further and
          explained business cycles as efficient responses of such decision-makers to [productivity
          shocks](term:P1:productivity_shock), changes in how much firms can produce with the same work, leaving little
          role for stabilisation policy.
        figures: ["Robert Lucas", "Thomas Sargent", "Finn Kydland", "Edward Prescott"]
        lesson: "[Chapter 5](theory:P5-s7) shows how what people expect about inflation shapes inflation today."
      - id: t7
        sources:
          - {key: taylor_1993}
          - {key: woodford_2003}
          - {key: goodfriend_king_1997}
          - {key: woodford_2009}
          - {key: snb_nd, loc: "monetary policy strategy"}
        period: "1980s to 2000s"
        title: "New Keynesian economics and the new synthesis"
        puzzle: "How should a central bank set interest rates?"
        idea: |
          New Keynesian economists accepted rational expectations and micro-founded models but showed why prices and
          wages adjust only slowly, for example because firms set prices for several periods. Monetary policy therefore
          affects output in the short run but not in the long run. John Taylor (1993) described how central banks set
          interest rates in response to inflation and output, and Michael Woodford (2003) built the theory of
          interest-rate policy on these micro-founded models. This "new synthesis" became the framework of central
          banks. The Swiss National Bank's strategy of 2000 belongs to this tradition.
        figures: ["John Taylor", "Michael Woodford"]
        lesson: "[Chapter 4](theory:P4-s4) shows how a central bank steers its policy rate within this framework."
      - id: t8
        sources:
          - {key: iconomix_nd}
          - {key: blanchard_illing_2021, loc: "ch. 6 and 24"}
          - {key: mankiw_2025, loc: "ch. 6 (inflation since 2021)"}
        period: "2008 until today"
        title: "Financial crisis, low interest rates and the return of inflation"
        puzzle: "Why did the models miss the crisis?"
        idea: |
          The financial crisis of 2008 showed that banks, credit and debt can cause deep recessions, something most
          models of the new synthesis had left out. Interest rates fell to zero and below: the SNB's policy rate was
          negative from 2015 to 2022. Economists have since added financial frictions and differences between households
          to their models. The surge of inflation from 2021 brought expectations and the credibility of central banks
          back to the centre of debate.
        figures: []
        lesson: "The small models of these chapters leave financial crises and differences between households aside."

  - id: s5
    title: "Economic schools of thought"
    objectives: [LO5]
    steps:
      - id: s5a
        sources:
          - {key: snowdon_vane_2005, loc: "ch. 1"}
        text: |
          ### What divides the schools

          Economists agree on much more than public debate suggests, but they disagree on some fundamental questions. A
          **[school of thought](term:P1:school_of_thought)** is a tradition of economists who share answers to these
          questions. Following Snowdon and Vane (2005), the schools of [macroeconomics](term:P1:macroeconomics) can be
          distinguished by their positions on four positive questions and one normative one:

          - **Adjustment:** do prices and wages adjust quickly enough to keep markets, especially the labour market,
            close to equilibrium, or do they adjust slowly, so that unemployment can persist?
          - **Stability:** is the private economy inherently stable, returning to full employment by itself, or is it
            prone to instability and crises?
          - **Expectations:** do people form their expectations about the future rationally, using all available
            information, or mainly by looking back at the past?
          - **[Money](term:P4:money) and policy:** can monetary and fiscal policy improve on market outcomes, and should
            policy follow fixed rules or be decided case by case?
          - **Values:** how much weight should be given to efficiency, individual liberty, stable prices, full
            employment and equality when these conflict?

          The first four questions are positive and can in principle be settled by evidence, although evidence in
          macroeconomics is rarely decisive. The fifth is normative, and it explains why economists who agree on the
          facts can still recommend different policies.
      - id: s5b
        sources:
          - {key: snowdon_vane_2005}
          - {key: chang_2014}
          - {key: screpanti_zamagni_2005}
        text: |
          ### The main schools

          | School | Core assumptions | View of policy | Values emphasised |
          |---|---|---|---|
          | **[Classical and neoclassical](term:P1:classical_school)** (Smith, Say, Marshall) | Flexible prices clear all markets; money is neutral | Little need for stabilisation; sound money | Liberty, efficiency |
          | **[Keynesian](term:P1:keynesian_school)** (Keynes, Hicks, Samuelson) | Demand drives [output](term:P1:output_GDP) in the [short run](term:P3:short_run); wages are sticky; the economy can stay in unemployment | Active fiscal and monetary stabilisation | Full employment, social welfare |
          | **[Monetarist](term:P1:monetarism)** (Friedman) | The private economy is stable; [inflation](term:P1:inflation) is caused by money growth; a [natural rate of unemployment](term:P5:natural_rate) | Steady monetary rules instead of discretion | Price stability, limited government |
          | **[New classical and real business cycle](term:P1:new_classical)** (Lucas, Sargent, Kydland, Prescott) | Rational expectations; continuous market clearing; cycles are efficient responses to shocks | Systematic policy has little real effect; credibility matters | Efficiency, rules |
          | **[New Keynesian](term:P1:new_keynesian)** (Taylor, Woodford, Galí) | Rational expectations with slow price adjustment and imperfect competition | Monetary policy stabilises in the short run, ideally by a rule | Stable prices and output |
          | **[Post-Keynesian](term:P1:post_keynesian)** (Kalecki, Robinson, Minsky) | Fundamental uncertainty; demand-led growth; finance is inherently unstable | Active policy, financial regulation | Full employment, equality |
          | **[Austrian](term:P1:austrian_school)** (Menger, Mises, Hayek) | Markets as processes of discovery; cheap credit distorts [investment](term:P2:investment) and causes booms and busts | Scepticism of central planning and of discretionary monetary policy | Individual liberty |

          The table simplifies: each school contains a range of views, and the boundaries between them have shifted over
          time. Other traditions, such as Marxian, institutionalist and behavioural economics, address the economy from
          further angles; Chang (2014) gives an accessible survey of nine schools, their strengths and their blind
          spots.
        details:
          title: "Keynes against Hayek: the debate of the 1930s"
          sources:
            - {key: screpanti_zamagni_2005}
            - {key: snowdon_vane_2005}
            - {key: nobel_1974}
          text: |
            The deepest divide in the table, between those who see the market economy as self-correcting and those who see
            it as prone to failures of demand, was argued out most memorably between John Maynard Keynes in Cambridge and
            Friedrich Hayek at the London School of Economics in the early 1930s. Hayek, building on Ludwig von Mises,
            argued that the boom of the 1920s had been caused by credit that kept interest rates below the level
            consistent with saving. Firms had started investment projects that the economy could not complete, and the
            slump was the painful process of correcting these errors. Stimulating demand would only prolong the
            misallocation. Keynes argued the opposite: a slump is a failure of total demand, in which idle workers and
            idle machines coexist because nobody spends, and waiting for prices and wages to fall can make things worse.
            The two exchanged reviews and replies in the journals of the time.

            In the [short run](term:P3:short_run), Keynes won the argument. After the Second World War, Keynesian ideas
            shaped economic policy in most Western countries, and Hayek turned to political philosophy, where his defence
            of markets as mechanisms that use knowledge dispersed among millions of people became highly influential; he
            received the Nobel Prize in 1974. The debate never quite ended. Its themes, the role of credit and interest
            rates in booms and busts and the limits of what policy makers can know, returned after the financial crisis of
            2008 (Screpanti & Zamagni, 2005; Snowdon & Vane, 2005).
      - id: s5c
        sources:
          - {key: woodford_2009}
          - {key: mankiw_2006}
          - {key: snowdon_vane_2005}
          - {key: legge_2023, loc: "12.2"}
        text: |
          ### The lens of these chapters

          The [framework of these chapters](term:P1:textbook_lens), like that of most [central
          banks](term:P1:central_bank) and textbooks today, is the **[new synthesis](term:P1:new_synthesis)** that grew
          out of new Keynesian and new [classical economics](term:P1:classical_economics). In the short run, total
          demand determines output because prices and wages adjust slowly; in the [medium run](term:P3:medium_run) the
          economy tends back towards a natural level of output and unemployment; in the [long run](term:P3:long_run),
          growth comes from [capital accumulation](term:P6:capital_accumulation) and technology; and expectations about
          the future matter for what happens today. Monetary policy is conducted by setting an interest rate, ideally
          according to a systematic rule.

          This is one well-tested lens, not the final truth. A post-Keynesian would object that the example economy of
          these chapters returns too readily to its natural level; an Austrian, that it ignores how interest rates
          distort the structure of investment; a new classical economist, that it gives monetary policy too much
          influence. A central bank that sets its [policy rate](term:P1:policy_rate) also makes normative choices, for
          example how much weight to give to inflation and how much to unemployment.
