# Chapter 1 of the theory section, "Macroeconomics, actors and models". Its texts are written from three textbooks
# (references.yaml) and name the section they rest on at the end of every paragraph. They use the glossary's terms and
# explanations, "government spending" and "the rate the economy needs", and they do not mention a game.
#   chapter  id, title, the learning objectives
#   cards    the term cards: term, core (the explanation; the glossary's own, lower case, where `glossary: true`), example,
#            aliases, see_also (a preview card's full card), box (false: never shown as a box), step (where the text defines it)
#   topics   id, title, objectives, steps: id, sources ({key, loc} into references.yaml), text (Markdown: [label](term:P4:id)
#            marks a term, [label](theory:P2-s1d) links a chapter, topic or step), module (one of the modules of modules.yaml
#            with this step's controls and view), figure (a static figure drawn from economy.yaml)

chapter:
  id: P1
  title: "Macroeconomics, actors and models"
  objectives:
    LO1: "Explain what an economic model is, including exogenous and endogenous variables, ceteris paribus and the distinction between positive and normative statements."
    LO2: "Distinguish macroeconomics from microeconomics and name the central variables of macroeconomics."
    LO3: "Describe the five actors of the economy and how they are connected in the circular flow."
    LO4: "Outline how macroeconomic thought developed from Keynes and the Great Depression to today's micro-founded models."
    LO5: "Describe the assumptions and policy views of the main schools of macroeconomic thought and the lens of these chapters."

cards:
  model: {term: "Economic model", core: "A simplified representation of the economy, built from assumptions, that isolates the relationships relevant to a question.", aliases: [models], box: false, step: s1a}
  exogenous: {term: "Exogenous variable", core: "A quantity that a model takes as given instead of explaining it; the model then shows what follows from it.", example: "In the model of the goods market, government spending is exogenous: parliament decides it, not the model.", aliases: [exogenous], step: s1b}
  endogenous: {term: "Endogenous variable", core: "A quantity that a model explains: its value results from how the parts of the model work together.", example: "In the model of the goods market, output is endogenous: it follows from what households, firms and the government spend.", aliases: [endogenous], step: s1b}
  ceteris_paribus: {term: "Ceteris paribus", core: "Latin for 'other things being equal'. A model changes one thing at a time and keeps everything else fixed, so that the effect of that one change can be seen.", example: "If the price of bread rises, people buy less bread, ceteris paribus: incomes and other prices are held fixed.", step: s1c}
  positive_normative: {term: "Positive vs normative", core: "Positive analysis shows how given aims can best be reached; normative analysis says what the aims should be.", example: "'Lower interest rates raise investment' is positive; 'the central bank should lower rates' is normative.", aliases: ["positive statements", "normative statements"], step: s1c}
  microeconomics: {term: "Microeconomics", core: "The part of economics that studies single households, firms and markets: how they decide, and how prices form.", example: "Why the bakery charges $1.10 for a loaf is a question of microeconomics.", step: s2a}
  macroeconomics: {term: "Macroeconomics", core: "The part of economics that studies the economy as a whole: total output, the price level, unemployment and interest rates.", example: "Why the whole economy produces $900 million a year, and why that changes, is a question of macroeconomics.", step: s2a}
  aggregate: {term: "Aggregate", core: "A total for the whole economy, obtained by adding up the figures of all households, firms or markets.", example: "Consumption of $500 million is an aggregate: the spending of all households together.", step: s2a}
  output_GDP: {term: "Output", core: "everything the economy produces in a quarter or a year", see_also: "P2:GDP_definition", glossary: true, step: s2b}
  inflation: {term: "Inflation", core: "how fast prices rise, in percent a year", see_also: "P4:inflation_rate", glossary: true, step: s2b}
  unemployment: {term: "Unemployment rate", core: "the share of people who want to work but have no job", example: "If 100 people work or look for work, and 5 of them look in vain, the rate is 5%.", see_also: "P5:unemployment_rate", glossary: true, step: s2b}
  policy_rate: {term: "Policy rate", core: "the short-term interest rate the central bank sets each quarter", example: "When the central bank raises it, loans for houses and machines become dearer.", see_also: "P4:policy_rate", glossary: true, step: s2b}
  households: {term: "Households", core: "Supply labour and capital, consume and save.", box: false, step: s3a}
  firms: {term: "Firms", core: "Combine labour and capital to produce goods and services, invest and set prices.", box: false, step: s3a}
  banks: {term: "Commercial banks", core: "Take deposits and grant loans, channelling savings to borrowers.", aliases: [banks], box: false, step: s3a}
  government: {term: "Government", core: "Buys goods and services, pays transfers, levies taxes and can borrow.", box: false, step: s3a}
  central_bank: {term: "Central bank", core: "the institution that sets the policy rate to keep prices stable", glossary: true, step: s3a}
  closed_economy: {term: "Closed economy", core: "An economy without trade across its borders: everything produced at home is bought at home, and nothing is imported. These chapters assume a closed economy throughout.", example: "All the bread and machines of the example economy are made and bought within the country.", step: s3a}
  circular_flow: {term: "Circular flow", core: "The picture of the economy as a cycle: households earn their incomes from firms, spend them on firms' products, and the money returns to households as income again.", example: "A household's wage pays for bread; the bakery's sales pay the baker's wage.", step: s3b}
  industrial_revolution: {term: "Industrial Revolution", core: "The transition to mechanised, factory-based production. Since then, economies have grown much faster than in the centuries before.", box: false, step: s4a}
  classical_economics: {term: "Classical economics", core: "The view that prices and wages are flexible, so that markets clear and the economy's resources are used.", example: "The classical model describes the economy best over several years or more.", step: s5c}
  lucas_critique: {term: "Lucas critique", core: "Robert Lucas's argument: relations estimated from past data change when policy changes, because people adjust their expectations and behaviour to the new policy.", example: "If the central bank starts to fight inflation harder, people expect less inflation, and old forecasting equations stop working.", step: s4b}
  new_synthesis: {term: "New synthesis", core: "The common framework of most macroeconomists today: in the short run demand drives output because prices adjust slowly, over longer periods supply decides, and expectations matter throughout.", example: "Most central banks set interest rates with models built on this framework.", step: s5c}
  school_of_thought: {term: "School of thought", core: "A group of economists who share answers to basic questions, such as how fast prices adjust, how people form expectations and what policy can achieve.", box: false, step: s5a}
  classical_school: {term: "Classical school", core: "The school that takes prices and wages to be flexible, so that markets clear. Its model fits horizons of several years or more.", example: "In its model, a fall in demand lowers prices, not output, in the long run.", aliases: ["classical"], step: s5b}
  keynesian_school: {term: "Keynesian school", core: "The school founded on Keynes: total demand can stay too low for a long time, leaving people unemployed, and government and central bank should then support demand.", example: "In a recession, it argues for more government spending and lower interest rates.", step: s5b}
  monetarism: {term: "Monetarism", core: "The school around Milton Friedman: it doubts that policy-makers know enough to steer the economy and prefers steady rules to decisions taken case by case.", example: "Its best-known rule: let the money stock grow by the same few percent every year.", aliases: [monetarist], step: s5b}
  new_classical: {term: "New classical school", core: "The school that combines rational expectations with markets that clear quickly; it explains fluctuations as reactions to shocks and doubts that systematic policy can raise output.", example: "In its real-business-cycle models, a recession is a response to a fall in productivity, not a lack of demand.", aliases: ["new classical and real business cycle", "new classical"], step: s5b}
  new_keynesian: {term: "New Keynesian school", core: "The school that combines forward-looking behaviour with prices and wages that adjust slowly, so that monetary policy affects output in the short run. Most central bank models follow it.", example: "A firm keeps its price for months; when demand falls, it sells less instead of cutting the price at once.", aliases: ["new Keynesian"], step: s5b}
  textbook_lens: {term: "The lens of these chapters", core: "The new synthesis: short run demand, medium run natural level, long run growth, expectations matter.", box: false, step: s5c}
  comparative_statics: {term: "Comparative statics", core: "Comparing a model's outcome before and after one given quantity changes, without tracing the path in between.", example: "Government spending rises by $10 million: output was $900 million before and is $925 million after.", step: s1c}
  real_flow: {term: "Real flow", core: "A flow of goods, services or work between the actors of the economy, as opposed to the money paid for them.", example: "The bread delivered to households is a real flow; the $500 million they pay for it is a money flow.", aliases: ["real flows"], step: s3b}
  money_flow: {term: "Money flow", core: "A flow of money in the circular flow, paid for goods, services, labour or as taxes.", aliases: ["money flows"], box: false, step: s3b}
  productivity_shock: {term: "Productivity shock", core: "a change in how much firms can produce with the same work", aliases: ["productivity shocks"], glossary: true, step: s4b}

topics:

  - id: s1
    title: "Economic models"
    objectives: [LO1]
    steps:
      - id: s1a
        sources:
          - {key: mankiw_2019, loc: "1-1, 1-2"}
          - {key: legge_2023, loc: "1.3"}
        text: |
          ### Why economists use models

          A whole economy cannot be put in a laboratory. Macroeconomists therefore rely on what has actually
          happened, the record of the past, and on theories that make sense of that record (Mankiw, 2019, 1-1).

          Their main tool is the **[model](term:P1:model)**: a simplified picture of the economy, often written
          in equations, that shows how a few variables hang together. A model leaves out detail on purpose so
          that the link in question stands out; a model that tried to capture everything would be too complex to
          understand (Mankiw, 2019, 1-2). Joan Robinson compared such a model to a map on a scale of one to one:
          complete, and of no use (as cited in Legge, 2023, 1.3).

          A model states its assumptions openly, which makes an argument precise and open to criticism. No
          single model answers every question: economists use different models for different questions, and how
          far one can be trusted depends on whether its assumptions suit the matter at hand (Legge, 2023, 1.3;
          Mankiw, 2019, 1-2).
      - id: s1b
        sources:
          - {key: mankiw_2019, loc: "1-2"}
          - {key: legge_2023, loc: "1.3"}
          - {key: blanchard_illing_2017, loc: "3.2"}
        text: |
          ### Exogenous and endogenous variables

          Every model sorts its variables into two groups. **[Exogenous variables](term:P1:exogenous)** are
          fixed outside the model, which takes them as given. **[Endogenous variables](term:P1:endogenous)** are
          the ones the model explains. A model shows how a change in the first group works through to the second
          (Mankiw, 2019, 1-2; Legge, 2023, 1.3).

          Which group a variable belongs to is a choice of the model builder, and a variable that one model
          takes as given may be explained by another (Mankiw, 2019, 1-2). The model of the goods market in
          [chapter 3](theory:P3-s3) is an example. It explains consumption and output, so they are endogenous.
          It takes investment, government spending and taxes as given, so they are exogenous (Blanchard &
          Illing, 2017, 3.2).
      - id: s1c
        sources:
          - {key: legge_2023, loc: "1.1, 1.3, Chapter 0"}
        text: |
          ### Ceteris paribus, and positive versus normative statements

          The **[ceteris paribus](term:P1:ceteris_paribus)** assumption, Latin for "other things being equal",
          isolates a single influence: economists vary it alone and imagine all else unchanged. The method is
          sound only where the rest would in fact have stayed as it was (Legge, 2023, 1.1).

          Applied to a model, the method is called **[comparative statics](term:P1:comparative_statics)**: one
          exogenous variable is changed, and the equilibrium before the change is compared with the equilibrium
          after it (Legge, 2023, 1.3).

          Economists also keep two kinds of analysis apart. **[Positive](term:P1:positive_normative)** analysis
          shows how aims that citizens have set can best be reached. **Normative** analysis says what the aims
          should be. Legge sees the task of economists in the first kind, not in the second (Legge, 2023,
          Chapter 0).

  - id: s2
    title: "Microeconomics and macroeconomics"
    objectives: [LO2]
    steps:
      - id: s2a
        sources:
          - {key: legge_2023, loc: "1.1"}
          - {key: mankiw_2019, loc: "1-1, 1-2"}
        text: |
          ### Two levels of analysis

          Economics is about scarce resources and their use. Its two branches differ in how closely they look.
          **[Microeconomics](term:P1:microeconomics)** examines a single market, housing for instance, and the
          households and firms that decide in it. **[Macroeconomics](term:P1:macroeconomics)** steps back to the
          whole economy: its interest is in how markets act on one another, and it treats all goods, say, as one
          market (Legge, 2023, 1.1).

          Macroeconomics asks why some countries have grown rich while others stay poor, why inflation is high
          in some places and low in others, and why economies fall into [recessions](term:P2:recession) from
          time to time (Mankiw, 2019, 1-1).

          Its variables are **[aggregates](term:P1:aggregate)**: totals that add up the decisions of many
          households and firms. What happens in the whole economy arises from these single decisions. The two
          fields therefore belong together: a theory of the whole has to be built on an account of how its parts
          decide (Mankiw, 2019, 1-2).
      - id: s2b
        sources:
          - {key: blanchard_illing_2017, loc: "1.1, 1.3"}
          - {key: mankiw_2019, loc: "1-1"}
          - {key: legge_2023, loc: "3.4, 7.3.1"}
        text: |
          ### The central variables of macroeconomics

          Macroeconomists look first at three variables (Blanchard & Illing, 2017, 1.1; Mankiw, 2019, 1-1).

          **[Output](term:P1:output_GDP)** is everything the economy produces in a quarter or a year, measured
          by [gross domestic product](term:P2:GDP_definition) (GDP). It grows over time, but not steadily: in a
          recession it falls ([chapter 2](theory:P2)) (Mankiw, 2019, 1-1).

          **[Inflation](term:P1:inflation)** is how fast prices rise, in percent a year, usually measured by the
          change of a [consumer price index](term:P4:consumer_price_index) (Blanchard & Illing, 2017, 1.1). The
          Swiss National Bank equates price stability with a rise in consumer prices of less than 2% a year
          ([chapter 4](theory:P4-s5c)) (Legge, 2023, 7.3.1, p. 245).

          The **[unemployment rate](term:P1:unemployment)** tells what part of the [labour
          force](term:P5:labour_force) is without work and searching for it ([chapter 5](theory:P5-s1b))
          (Blanchard & Illing, 2017, 1.1).

          A fourth number matters for monetary policy: the **[policy rate](term:P1:policy_rate)**, the
          short-term interest rate the [central bank](term:P1:central_bank) sets. Commercial banks pay it when
          they borrow central bank money, and central banks move it up or down to steady the economy (Legge,
          2023, 3.4; Blanchard & Illing, 2017, 1.3).

  - id: s3
    title: "The circular flow of the economy"
    objectives: [LO3]
    steps:
      - id: s3a
        sources:
          - {key: legge_2023, loc: "1.5.1, 3.4, 7.3.1"}
          - {key: mankiw_2019, loc: "4-2"}
          - {key: blanchard_illing_2017, loc: "3.2"}
        text: |
          ### The actors

          To keep the picture simple, [macroeconomics](term:P1:macroeconomics) gathers the millions of people
          and businesses of an economy into a few groups of actors. These chapters use five (Legge, 2023,
          1.5.1).

          Labour and capital, the factors of production, belong to **[households](term:P1:households)**.
          **[Firms](term:P1:firms)** hire both to make goods and services, and the income they pay out comes
          back to them when households buy these goods (Legge, 2023, 1.5.1). **[Commercial
          banks](term:P1:banks)** pass the funds of savers on to borrowers (Mankiw, 2019, 4-2).

          The **[government](term:P1:government)** buys goods and services, pays transfers and levies taxes
          (Legge, 2023, 1.5.1). Its choices of spending and taxes are its fiscal policy (Blanchard & Illing,
          2017, 3.2).

          The **[central bank](term:P1:central_bank)** supplies central bank money to the banks and sets the
          [policy rate](term:P1:policy_rate). The Swiss National Bank is to keep prices stable with an eye on
          the business cycle, a task that calls for independence from the government (Legge, 2023, 3.4, 7.3.1).

          Exports and imports are left out: these chapters study a **[closed economy](term:P1:closed_economy)**,
          which makes the analysis easier (Blanchard & Illing, 2017, 3.2).
      - id: s3b
        sources:
          - {key: mankiw_2019, loc: "2-1"}
          - {key: legge_2023, loc: "1.5.1"}
        text: |
          ### The circular flow

          What one actor pays, another receives. The **[circular flow](term:P1:circular_flow)** draws this as a
          cycle with two kinds of flows that run in opposite directions. **[Real flows](term:P1:real_flow)** are
          labour, goods and services: households work for firms, and firms deliver their products to households.
          **[Money flows](term:P1:money_flow)** are the payments for them: households pay for the goods, and
          firms pay wages and profits to households (Mankiw, 2019, 2-1; Legge, 2023, 1.5.1).

          No purchase is made without a sale, so whatever one side spends is income for the other. Across the
          entire economy, total spending on what is produced therefore equals the total income earned in
          producing it. [Chapter 2](theory:P2-s1) builds the measurement of [GDP](term:P2:GDP_definition) on
          this fact (Mankiw, 2019, 2-1).

          The government can be added to the picture: it collects taxes from households and firms, pays
          transfers and places orders with firms (Legge, 2023, 1.5.1).

          Build the cycle yourself below.
        module: {kind: circular_flow}
    circular_flow:   # the module of step s3b: the actors, the flows with their arrows' geometry, the stages
      intro: |
        The five actors are connected. What one actor pays, another receives. Economists draw this as a cycle,
        the "circular flow" of the economy. Solid arrows show money. Dashed arrows show real things: working
        hours, goods and services. One arrow stands for monetary policy.
      actors: {firms: "Firms", households: "Households", central_bank: "Central bank", banks: "Commercial banks", government: "Government"}
      flow_types: {real: "Real flow (labour, goods)", money: "Money flow", policy: "Monetary policy"}
      nodes:       # x, y, width, height on a canvas of 680 x 500
        firms: [40, 40, 120, 340]
        households: [520, 40, 120, 340]
        central_bank: [270, 100, 140, 44]
        banks: [270, 220, 140, 44]
        government: [270, 435, 140, 44]
      flows:
        - {id: 1, from: households, to: firms, type: real, card: "Provide working hours (labour)", path: "M518 60 L164 60", badge: [230, 60]}
        - {id: 2, from: firms, to: households, type: money, card: "Pay wages", path: "M162 80 L516 80", badge: [450, 80]}
        - {id: 3, from: firms, to: households, type: real, card: "Supply goods and services", path: "M162 310 L516 310", badge: [230, 310]}
        - {id: 4, from: households, to: firms, type: money, card: "Pay for goods and services (consumption)", path: "M518 334 L164 334", badge: [450, 334]}
