  - id: s4
    title: "History of macroeconomics"
    objectives: [LO4]
    steps:
      - id: s4a
        sources:
          - {key: blanchard_illing_2017, loc: "10.3, 24.1, Chapter 24"}
          - {key: legge_2023, loc: "1.5"}
          - {key: mankiw_2019, loc: "1-1"}
        text: |
          ### A young field with old questions

          The questions of [macroeconomics](term:P1:macroeconomics) are old, but lasting growth is recent.
          Between the fall of Rome and about 1500, Europe's [output](term:P1:output_GDP) per person stood almost
          still: more was produced, but for more people (Blanchard & Illing, 2017, 10.3, p. 322). The
          **[Industrial Revolution](term:P1:industrial_revolution)** marks the break: the centuries before it
          saw far weaker growth than the time since (Legge, 2023, 1.5, p. 31).

          As a field of its own, macroeconomics is young. Its modern history begins with the *General Theory* of
          Keynes (1936, as cited in Blanchard & Illing, 2017, 24.1). The Great Depression had been an economic
          catastrophe, and the economics of the day had no convincing account of its depth and its length
          (Blanchard & Illing, 2017, 24.1).

          Later decades brought problems of their own, such as the high inflation of the 1970s and the financial
          crisis of 2008, and each changed the field again. The next step follows this history station by
          station (Mankiw, 2019, 1-1; Blanchard & Illing, 2017, Chapter 24).
      - id: s4b
        sources:
          - {key: blanchard_illing_2017, loc: "Chapter 24"}
        text: |
          ### Stations of macroeconomic thought

          The stations below follow macroeconomic thought from Keynes to the models that [central
          banks](term:P1:central_bank) use today (Blanchard & Illing, 2017, Chapter 24).

          Reveal them one at a time.
        module: {kind: timeline}
      - id: s4c
        sources:
          - {key: blanchard_illing_2017, loc: "24.4, 24.5, Chapter 24"}
        text: |
          ### Where macroeconomics stands today

          After years of dispute, a synthesis took shape around the turn of the millennium. Its models are
          **micro-founded**: they describe exactly how households and firms decide. From the [new
          classical](term:P1:new_classical) approach they take this method and the role of technological
          progress, from the [new Keynesian](term:P1:new_keynesian) approach frictions such as prices and wages
          that adjust slowly. Large models of this kind have become the standard tool of central banks
          (Blanchard & Illing, 2017, 24.4).

          On two statements nearly all macroeconomists now agree: demand moves output in the [short
          run](term:P3:short_run), and in the [medium run](term:P3:medium_run) output finds its way back to its
          natural level (Blanchard & Illing, 2017, Chapter 24).

          The financial crisis showed what these models had neglected: the part that banks and other financial
          institutions play. The debates are not over, and the next topic describes the schools behind them
          (Blanchard & Illing, 2017, 24.5).
    stations:        # the timeline of step s4b
      - id: t3
        sources:
          - {key: mankiw_2019, loc: "1-1"}
          - {key: blanchard_illing_2017, loc: "24.1"}
        period: "1930s"
        title: "The Great Depression and Keynes"
        puzzle: "Why does mass unemployment last for years?"
        idea: |
          In the worst year of the Great Depression, a quarter of the American labour force was out of work
          (Mankiw, 2019, 1-1). Keynes (1936, as cited in Blanchard & Illing, 2017, 24.1) argued that in the
          short run total demand determines output, and that any return to the natural level takes a long time.
          He introduced the multiplier, a theory of the demand for money and the role of expectations for
          spending, and he made the case for active fiscal policy to restore full employment (Blanchard &
          Illing, 2017, 24.1).
        figures: ["John Maynard Keynes"]
        lesson: "[Chapter 3](theory:P3-s3) shows how demand determines output in the short run."
      - id: t4
        sources:
          - {key: blanchard_illing_2017, loc: "24.2"}
        period: "1940s to 1960s"
        title: "The neoclassical synthesis"
        puzzle: "Can the ideas of Keynes and of earlier economists be joined?"
        idea: |
          By the early 1950s a broad consensus had formed that joined many ideas of Keynes with those of earlier
          economists: the neoclassical synthesis. John Hicks and Alvin Hansen had cast the argument of Keynes in
          the IS-LM model. Franco Modigliani and Milton Friedman worked out the theory of consumption, and James
          Tobin those of investment and of the demand for money. Solow (1956, as cited in Blanchard & Illing,
          2017, 24.2) supplied the model of growth. The Phillips curve was added to explain wages and prices,
          and ever larger models put the pieces together (Blanchard & Illing, 2017, 24.2).
        figures: ["Paul Samuelson", "John Hicks", "Franco Modigliani", "James Tobin", "Robert Solow"]
        lesson: "[Chapter 6](theory:P6-s3) shows what drives production in the long run."
      - id: t5
        sources:
          - {key: blanchard_illing_2017, loc: "24.2, 24.3"}
        period: "1960s to 1970s"
        title: "Monetarism and stagflation"
        puzzle: "How much can policy achieve?"
        idea: |
          The monetarists, few in number but widely heard, doubted with Milton Friedman at their head that
          economists knew enough to steer the economy. With Anna Schwartz, Friedman argued that monetary policy
          is powerful and that its mistakes were to blame for the Great Depression. With Edmund Phelps, he
          denied that policy could buy lower unemployment with higher inflation for long. He preferred simple
          rules, such as steady growth of the money stock (Blanchard & Illing, 2017, 24.2). In the mid-1970s
          stagflation, high unemployment together with high inflation, took macroeconomists by surprise
          (Blanchard & Illing, 2017, 24.3).
        figures: ["Milton Friedman", "Anna Schwartz", "Edmund Phelps"]
        lesson: "[Chapter 5](theory:P5-s7) shows why expectations and the natural rate of unemployment matter."
      - id: t6
        sources:
          - {key: blanchard_illing_2017, loc: "24.3, 24.4"}
        period: "1970s to 1980s"
        title: "Rational expectations and new classical economics"
        puzzle: "Can policy systematically fool people?"
        idea: |
          Robert Lucas, Thomas Sargent and Robert Barro attacked the established models. If people form their
          expectations rationally, they change their behaviour when policy changes, so relations estimated from
          the past cannot predict the effect of a new policy ([the Lucas critique](term:P1:lucas_critique)).
          Changes in the money stock that people foresee would then leave output unchanged. Finn Kydland and
          Edward Prescott showed how well-meant policy can end badly when people look ahead (Blanchard & Illing,
          2017, 24.3). Prescott went on to explain fluctuations as responses to [productivity
          shocks](term:P1:productivity_shock), changes in how much firms can produce with the same work, in
          markets with flexible prices (Blanchard & Illing, 2017, 24.4).
        figures: ["Robert Lucas", "Thomas Sargent", "Robert Barro", "Finn Kydland", "Edward Prescott"]
        lesson: "[Chapter 5](theory:P5-s7) shows how what people expect about inflation shapes inflation today."
      - id: t7
        sources:
          - {key: blanchard_illing_2017, loc: "24.3, 24.4"}
        period: "1980s to 2000s"
        title: "New Keynesian economics and the new synthesis"
        puzzle: "Why do prices and wages adjust slowly, and what follows for policy?"
        idea: |
          Stanley Fischer and John Taylor showed that wages and prices adjust slowly even when expectations are
          rational, because they are set at different times and overlap (Blanchard & Illing, 2017, 24.3). George
          Akerlof, Janet Yellen and Gregory Mankiw showed that even small costs of changing a price can keep
          prices fixed for a while. Michael Woodford and Jordi Galí built the new Keynesian model, which joins
          households and firms that optimise with prices that adjust slowly. It shaped monetary policy, from
          inflation targeting to interest rate rules, and its large versions became the standard models of
          central banks (Blanchard & Illing, 2017, 24.4).
        figures: ["Stanley Fischer", "John Taylor", "Michael Woodford", "Jordi Galí"]
        lesson: "[Chapter 4](theory:P4-s4) shows how a central bank steers its policy rate within this framework."
      - id: t8
        sources:
          - {key: blanchard_illing_2017, loc: "1.3, 24.5"}
        period: "2008 and after"
        title: "The financial crisis"
        puzzle: "Why did the models miss the crisis?"
        idea: |
          The financial crisis was an intellectual failure of macroeconomics: its models had not allowed for a
          modest shock, falling house prices, to end in a worldwide crisis. Most models had neglected the part
          that banks and other financial institutions play (Blanchard & Illing, 2017, 24.5). Policy rates fell
          to zero almost everywhere (Blanchard & Illing, 2017, 1.3, p. 34). The usual way out of a slump, lower
          interest rates, was blocked, and economists have since been building the financial system into their
          models (Blanchard & Illing, 2017, 24.5).
        figures: []
        lesson: "The small models of these chapters leave financial crises aside."

  - id: s5
    title: "Economic schools of thought"
    objectives: [LO5]
    steps:
      - id: s5a
        sources:
          - {key: blanchard_illing_2017, loc: "24.2, 24.3, 24.4, Chapter 24"}
        text: |
          ### What divides the schools

          Macroeconomists agree on more than their disputes suggest, yet the field has long been divided into
          camps. A **[school of thought](term:P1:school_of_thought)** is a group of economists who share answers
          to a few basic questions. In the history of [macroeconomics](term:P1:macroeconomics), three such
          questions stand out (Blanchard & Illing, 2017, Chapter 24).

          - **Adjustment:** do prices and wages adjust slowly, so that output can stay away from its natural
            level for some time, or do flexible prices keep markets in balance?
          - **Expectations:** do people form their expectations by looking back at the past, or rationally, with
            a view to what policy will do?
          - **Policy:** can monetary and fiscal policy steady the economy, and should policy follow simple rules
            or be decided case by case?

          The Keynesians and the monetarists of the 1960s argued about what policy can do. The new classical and
          the new Keynesian economists of later decades argued about expectations and about how fast prices
          adjust (Blanchard & Illing, 2017, 24.2, 24.3, 24.4).
      - id: s5b
        sources:
          - {key: mankiw_2019, loc: "1-3, 10-4, 16-2"}
          - {key: blanchard_illing_2017, loc: "24.1, 24.2, 24.3, 24.4"}
        text: |
          ### The main schools

          | School | Core assumptions | View of policy | Source |
          |---|---|---|---|
          | **[Classical](term:P1:classical_school)** | Flexible prices; markets clear | In the long run, demand moves prices, not [output](term:P1:output_GDP) | (Mankiw, 2019, 1-3, 10-4) |
          | **[Keynesian](term:P1:keynesian_school)** | Demand determines output in the [short run](term:P3:short_run); slow return to the natural level | Active stabilisation, above all by fiscal policy | (Blanchard & Illing, 2017, 24.1, 24.2) |
          | **[Monetarist](term:P1:monetarism)** | Monetary policy is powerful; no lasting trade-off between [inflation](term:P1:inflation) and unemployment | Steady rules such as constant money growth | (Blanchard & Illing, 2017, 24.2; Mankiw, 2019, 16-2) |
          | **[New classical](term:P1:new_classical)** | Rational expectations; flexible prices; fluctuations as responses to productivity shocks | Foreseen monetary policy does not move output | (Blanchard & Illing, 2017, 24.3, 24.4) |
          | **[New Keynesian](term:P1:new_keynesian)** | Rational expectations; market imperfections; prices adjust slowly | Monetary policy steadies demand, guided by an inflation target and interest rate rules | (Blanchard & Illing, 2017, 24.4) |

          The table simplifies: each school holds a range of views. Since the turn of the millennium, the last
          two have moved towards a common framework (Blanchard & Illing, 2017, 24.4).
      - id: s5c
        sources:
          - {key: blanchard_illing_2017, loc: "2.5, 24.4, 24.5"}
          - {key: mankiw_2019, loc: "1-2, 1-3"}
          - {key: legge_2023, loc: "Chapter 0"}
        text: |
          ### The lens of these chapters

          The [framework of these chapters](term:P1:textbook_lens) is the **[new
          synthesis](term:P1:new_synthesis)** (Blanchard & Illing, 2017, 24.4). It gives each horizon its own
          driving force: demand over a few years, the supply of capital, labour and technology over about a
          decade, the [medium run](term:P3:medium_run), and [capital accumulation](term:P6:capital_accumulation)
          with technological progress in the [long run](term:P3:long_run) (Blanchard & Illing, 2017, 2.5).

          The synthesis keeps from **[classical economics](term:P1:classical_economics)** the view that flexible
          prices clear markets over longer horizons, and adds that over short ones many prices are slow to move
          (Mankiw, 2019, 1-2, 1-3).

          It is one lens, not the last word. New classical economists give demand and monetary policy a smaller
          part (Blanchard & Illing, 2017, 24.4). Since the financial crisis, many economists doubt that an
          economy finds its way back unaided after a very large shock (Blanchard & Illing, 2017, 24.5). What the
          aims of policy should be is a normative question, and not one for economic analysis to decide (Legge,
          2023, Chapter 0).
