# 02_Game/content/theory/P1.yaml — chapter 1 of the theory section, "Macroeconomics, actors and models" (scripts appendix §14),
# its texts written as the scripts appendix §8 asks (the glossary's terms and explanations, "government spending", "the rate
# the economy needs", no mention of a game). Read by 02_Game/ui/theory.R.
#   chapter  id, title, the learning objectives
#   cards    the term cards: term, core (the explanation; the glossary's own, lower case, where `glossary: true`), example,
#            aliases, see_also (a preview card's full card), box (false: never shown as a box), step (where the text defines it)
#   topics   id, title, objectives, steps: id, sources ({key, loc} into references.yaml), text (Markdown: [label](term:P4:id)
#            marks a term, [label](theory:P2-s1d) links a chapter, topic or step), details (a More Detail panel), module (one of
#            the ten modules of modules.yaml with this step's controls and view), figure (a static figure drawn from economy.yaml)

chapter:
  id: P1
  title: "Macroeconomics, actors and models"
  objectives:
    LO1: "Explain what an economic model is, including exogenous and endogenous variables, ceteris paribus and the distinction between positive and normative statements."
    LO2: "Distinguish macroeconomics from microeconomics and name the central variables of macroeconomics."
    LO3: "Describe the five actors of the economy and how they are connected in the circular flow."
    LO4: "Outline how macroeconomic thought developed from Adam Smith to micro-founded macroeconomics, against the background of economic history."
    LO5: "Describe the assumptions, policy views and values of the main schools of macroeconomic thought and the lens of these chapters."

cards:
  model: {term: "Economic model", core: "A simplified representation of the economy, built from assumptions, that isolates the relationships relevant to a question.", aliases: [models], box: false, step: s1a}
  exogenous: {term: "Exogenous variable", core: "A quantity that a model takes as given instead of explaining it; the model then shows what follows from it.", example: "In the model of the goods market, government spending is exogenous: parliament decides it, not the model.", aliases: [exogenous], step: s1b}
  endogenous: {term: "Endogenous variable", core: "A quantity that a model explains: its value results from how the parts of the model work together.", example: "In the model of the goods market, output is endogenous: it follows from what households, firms and the government spend.", aliases: [endogenous], step: s1b}
  ceteris_paribus: {term: "Ceteris paribus", core: "Latin for 'other things being equal'. A model changes one thing at a time and keeps everything else fixed, so that the effect of that one change can be seen.", example: "If the price of bread rises, people buy less bread, ceteris paribus: incomes and other prices are held fixed.", step: s1c}
  positive_normative: {term: "Positive vs normative", core: "Positive statements say how the economy works and can be checked against facts; normative statements say what should be done and rest on values.", example: "'Lower interest rates raise investment' is positive; 'the central bank should lower rates' is normative.", aliases: ["positive statements", "normative statements"], step: s1c}
  microeconomics: {term: "Microeconomics", core: "The part of economics that studies single households, firms and markets: how they decide, and how prices form.", example: "Why the bakery charges $1.10 for a loaf is a question of microeconomics.", step: s2a}
  macroeconomics: {term: "Macroeconomics", core: "The part of economics that studies the economy as a whole: total output, the price level, unemployment and interest rates.", example: "Why the whole economy produces $900 million a year, and why that changes, is a question of macroeconomics.", step: s2a}
  aggregate: {term: "Aggregate", core: "A total for the whole economy, obtained by adding up the figures of all households, firms or markets.", example: "Consumption of $500 million is an aggregate: the spending of all households together.", step: s2a}
  output_GDP: {term: "Output", core: "everything the economy produces in a quarter or a year", see_also: "P2:GDP_definition", glossary: true, step: s2b}
  inflation: {term: "Inflation", core: "how fast prices rise, in percent a year", see_also: "P4:inflation_rate", glossary: true, step: s2b}
  unemployment: {term: "Unemployment rate", core: "the share of people who want to work but have no job", example: "If 100 people work or look for work, and 5 of them look in vain, the rate is 5%.", see_also: "P5:unemployment_rate", glossary: true, step: s2b}
  policy_rate: {term: "Policy rate", core: "the short-term interest rate the central bank sets each quarter", example: "When the central bank raises it, loans for houses and machines become dearer.", see_also: "P4:policy_rate", glossary: true, step: s2b}
  households: {term: "Households", core: "Supply labour and capital, consume and save.", box: false, step: s3a}
  firms: {term: "Firms", core: "Combine labour and capital to produce goods and services, invest and set prices.", box: false, step: s3a}
  banks: {term: "Commercial banks", core: "Take deposits and grant loans, channelling savings to borrowers.", aliases: [banks], box: false, step: s3a}
  government: {term: "Government", core: "Buys goods and services, pays transfers, levies taxes and can borrow.", box: false, step: s3a}
  central_bank: {term: "Central bank", core: "the institution that sets the policy rate to keep prices stable", glossary: true, step: s3a}
  closed_economy: {term: "Closed economy", core: "An economy that does not trade with other countries: everything produced at home is bought at home, and nothing is imported. These chapters assume a closed economy throughout.", example: "All the bread and machines of the example economy are made and bought within the country.", step: s3a}
  circular_flow: {term: "Circular flow", core: "The picture of the economy as a cycle: households earn their incomes from firms, spend them on firms' products, and the money returns to households as income again.", example: "A household's wage pays for bread; the bakery's sales pay the baker's wage.", step: s3b}
  industrial_revolution: {term: "Industrial Revolution", core: "The transition to mechanised, factory-based production that began in Britain around 1760 and started persistent growth of output per person.", box: false, step: s4a}
  classical_economics: {term: "Classical economics", core: "The economics of Adam Smith, David Ricardo and their successors, from about 1776 to 1870: markets coordinate the economy, and prices and wages adjust so that resources are used.", example: "In the classical view, a lasting lack of demand for all goods cannot occur.", step: s5c}
  lucas_critique: {term: "Lucas critique", core: "Robert Lucas's argument of 1976: relations estimated from past data change when policy changes, because people adjust their expectations and behaviour to the new policy.", example: "If the central bank starts to fight inflation harder, people expect less inflation, and old forecasting equations stop working.", step: s4b}
  new_synthesis: {term: "New synthesis", core: "The common framework of most macroeconomists today: in the short run demand drives output because prices adjust slowly, over longer periods supply decides, and expectations matter throughout.", example: "Most central banks set interest rates with models built on this framework.", step: s5c}
  school_of_thought: {term: "School of thought", core: "A tradition of economists sharing answers to the basic questions of adjustment, stability, expectations, policy and values.", box: false, step: s5a}
  classical_school: {term: "Classical and neoclassical school", core: "The school that trusts flexible prices and wages to keep markets in balance, so that the economy returns to full use of its resources on its own and needs little stabilisation.", example: "In its view, a fall in demand mainly lowers prices, not output.", aliases: ["classical and neoclassical"], step: s5b}
  keynesian_school: {term: "Keynesian school", core: "The school founded on Keynes: total demand can stay too low for a long time, leaving people unemployed, and government and central bank should then support demand.", example: "In a recession, it argues for more government spending and lower interest rates.", step: s5b}
  monetarism: {term: "Monetarism", core: "The school around Milton Friedman: the private economy is stable on its own, inflation comes from too much money, and policy should follow steady rules rather than react to every change.", example: "Its best-known rule: let the money stock grow by the same few percent every year.", aliases: [monetarist], step: s5b}
  new_classical: {term: "New classical school", core: "The school that combines rational expectations with markets that clear quickly; it explains fluctuations as reactions to shocks and doubts that systematic policy can raise output.", example: "In its real-business-cycle models, a recession is a response to a fall in productivity, not a lack of demand.", aliases: ["new classical and real business cycle", "new classical"], step: s5b}
  new_keynesian: {term: "New Keynesian school", core: "The school that combines forward-looking behaviour with prices and wages that adjust slowly, so that monetary policy affects output in the short run. Most central bank models follow it.", example: "A firm keeps its price for months; when demand falls, it sells less instead of cutting the price at once.", aliases: ["new Keynesian"], step: s5b}
  post_keynesian: {term: "Post-Keynesian school", core: "The school that stresses deep uncertainty about the future, unstable finance and inequality, and argues for active and lasting policy intervention.", example: "It sees financial crises as built into the system, not as rare accidents.", aliases: ["post-Keynesian"], step: s5b}
  austrian_school: {term: "Austrian school", core: "The school that sees markets as processes of discovery and argues that cheap credit leads to bad investments, booms and busts; it is sceptical of active policy.", example: "In its view, interest rates kept too low make firms start projects that later fail.", aliases: [Austrian], step: s5b}
  textbook_lens: {term: "The lens of these chapters", core: "The new synthesis: short run demand, medium run natural level, long run growth, expectations matter.", box: false, step: s5c}
  comparative_statics: {term: "Comparative statics", core: "Comparing a model's outcome before and after one given quantity changes, without tracing the path in between.", example: "Government spending rises by $10 million: output was $900 million before and is $925 million after.", step: s1c}
  real_flow: {term: "Real flow", core: "A flow of goods, services or work between the actors of the economy, as opposed to the money paid for them.", example: "The bread delivered to households is a real flow; the $500 million they pay for it is a money flow.", aliases: ["real flows"], step: s3b}
  money_flow: {term: "Money flow", core: "A flow of money in the circular flow, paid for goods, services, labour or as taxes.", aliases: ["money flows"], box: false, step: s3b}
  productivity_shock: {term: "Productivity shock", core: "a change in how much firms can produce with the same work", aliases: ["productivity shocks"], glossary: true, step: s4b}

topics:

  - id: s1
    title: "Economic models"
    objectives: [LO1]
    steps:
      - id: s1a
        sources:
          - {key: legge_2023, loc: "1.3"}
          - {key: mankiw_2025, loc: "ch. 1"}
          - {key: blanchard_illing_2021, loc: "ch. 1"}
        text: |
          ### Why economists use models

          Economists face a difficulty that natural scientists rarely face in the same form: they cannot run controlled
          experiments with a whole economy. They cannot raise interest rates in one half of a country and leave the
          other half unchanged to see what happens. Instead, they reason with **[models](term:P1:model)**. An economic
          model is a simplified representation of the economy, built from explicit **assumptions**, that isolates the
          relationships relevant to a particular question. Models are usually written as equations or drawn as diagrams,
          and their conclusions follow logically from their assumptions.

          The best analogy is a map. A road map leaves out almost everything, trees, houses and people, and that is
          exactly what makes it useful for finding a route. A map that showed everything would be as large and as
          confusing as the landscape itself. In the same way, a model of the interest rate leaves out most of what
          happens in an economy in order to show clearly how the interest rate affects spending. Different questions
          need different maps: a model of the next few quarters and a model of the next fifty years rest on different
          simplifications.

          A model is therefore judged not by whether it is "true" in every detail, which no model is, but by whether it
          is **useful** for its question: whether its assumptions capture what matters for that question and whether its
          predictions hold up against the data.
        details:
          title: "Must the assumptions of a model be realistic?"
          sources:
            - {key: friedman_1953}
            - {key: lucas_1976}
            - {key: blanchard_2018}
          text: |
            How realistic assumptions must be is one of the oldest debates in economic methodology. Milton Friedman (1953)
            argued in an influential essay that a theory should be judged by the accuracy of its predictions, not by the
            realism of its assumptions: an expert billiard player shoots as if he solved the equations of mechanics,
            although he has never learned them, and a theory that assumes he does may predict his shots very well. Critics
            answered that assumptions matter when we want to understand causes rather than only to forecast, and when a
            model is used for policy under conditions different from those in which it was tested.

            Robert Lucas (1976) sharpened the second point. If a model describes how people behaved under an old policy,
            and people change their behaviour when the policy changes, the model's predictions for a new policy can be
            wrong, however well it fitted past data. This is one reason why modern macroeconomic models derive behaviour
            from explicit assumptions about how households and firms make decisions. Today many economists take a
            pragmatic position: different models serve different purposes, from small "toy" models that make one mechanism
            transparent to large models used for forecasting (Blanchard, 2018). These chapters follow that view: each
            topic uses a small model that makes one mechanism transparent.
      - id: s1b
        sources:
          - {key: legge_2023, loc: "1.3"}
          - {key: mankiw_2025, loc: "ch. 1"}
        text: |
          ### Exogenous and endogenous variables

          Every model divides its variables into two groups. **[Exogenous variables](term:P1:exogenous)** are taken as
          given: the model does not explain them, but they are its input. **[Endogenous variables](term:P1:endogenous)**
          are the variables the model explains: they are its output, determined by the exogenous variables and the
          relationships the model assumes.

          Consider a small model of household spending. It might assume that households spend a fixed share of their
          income after taxes. In this model, the tax rate set by parliament and the households' income are exogenous,
          while spending is endogenous. Whether a variable is exogenous is a decision of the model builder, not a fact
          about the world. In a larger model of the whole economy, income is no longer given: it depends on how much
          everybody spends, and it becomes endogenous. [Chapter 3](theory:P3-s3) builds exactly such a model.
      - id: s1c
        sources:
          - {key: legge_2023, loc: "1.3–1.4"}
          - {key: mankiw_2025, loc: "ch. 1"}
        text: |
          ### Ceteris paribus, and positive versus normative statements

          To study how an endogenous variable depends on an exogenous one, economists change one exogenous variable and
          hold all others fixed. This is the **[ceteris paribus](term:P1:ceteris_paribus)** assumption, Latin for "all
          else being equal". In the real economy many things change at once, so data rarely show such a clean effect
          directly; the model makes the thought experiment possible, and comparing its predictions with the data shows
          how far it can be trusted. Comparing the outcome of a model before and after such a change is called
          **[comparative statics](term:P1:comparative_statics)**.

          Finally, economists distinguish two kinds of statements. **[Positive statements](term:P1:positive_normative)**
          describe how the economy works and can in principle be checked against evidence: "a higher interest rate
          reduces [investment](term:P2:investment)". **Normative statements** say how things ought to be and rest on
          value judgements: "the [central bank](term:P1:central_bank) should give more weight to unemployment than to
          [inflation](term:P1:inflation)". Models answer positive questions. They can inform normative debates by
          showing the consequences of each choice, but they cannot settle them. Many disagreements between schools of
          thought, which [the last topic of this chapter](theory:P1-s5) describes, combine both kinds of difference.

  - id: s2
    title: "Microeconomics and macroeconomics"
    objectives: [LO2]
    steps:
      - id: s2a
        sources:
          - {key: legge_2023, loc: "1.1"}
          - {key: blanchard_illing_2021, loc: "ch. 1"}
          - {key: mankiw_2025, loc: "ch. 1"}
        text: |
          ### Two levels of analysis

          Economics studies how societies use scarce resources. It is traditionally divided into two fields.
          **[Microeconomics](term:P1:microeconomics)** studies how individual households and firms make decisions and
          how they interact in particular markets: how a household divides its income between goods, how a firm sets its
          price, how the market for apartments determines rents. **[Macroeconomics](term:P1:macroeconomics)** studies
          the economy as a whole. It asks why total production grows faster in some decades than in others, why it
          sometimes falls in [recessions](term:P2:recession), why the general level of prices rises, and why many people
          are unemployed in some years and few in others.

          Macroeconomics works with **[aggregates](term:P1:aggregate)**: totals and averages over the whole economy,
          such as total production, the average level of prices or the number of unemployed. An aggregate is the result
          of millions of individual decisions, which is why the two fields are closely connected. Modern macroeconomic
          models are built on assumptions about how households and firms decide; this "microfoundation" is itself a
          result of the history of the field.
        details:
          title: "When the whole behaves differently from its parts: the paradox of thrift"
          sources:
            - {key: keynes_1936}
            - {key: blanchard_illing_2021, loc: "3.4"}
          text: |
            [Macroeconomics](term:P1:macroeconomics) is not simply [microeconomics](term:P1:microeconomics) added up,
            because what is true for one decision-maker need not be true for all of them together. Logicians call the
            mistake of assuming otherwise the fallacy of composition. The best-known example in macroeconomics is the
            paradox of thrift, popularised by Keynes (1936). If one household decides to save more, it spends less, and
            its wealth rises. If all households decide to save more at the same time, total spending falls. Firms sell
            less and produce less, and income falls. Because saving depends on income, households may end up saving no
            more than before, while the economy is poorer. Whether the paradox arises depends on whether the extra saving
            is turned into extra [investment](term:P2:investment), which in turn depends on interest rates and on firms'
            expectations. The example shows why macroeconomics needs models of the whole economy in which the interactions
            between actors are explicit; [chapter 3](theory:P3-s4c) derives the paradox formally (Blanchard & Illing,
            2021, ch. 3).
      - id: s2b
        sources:
          - {key: blanchard_illing_2021, loc: "ch. 2"}
          - {key: legge_2023, loc: "1.1"}
          - {key: mankiw_2025, loc: "ch. 1–2"}
          - {key: snb_nd, loc: "monetary policy strategy"}
        text: |
          ### The central variables of macroeconomics

          Macroeconomics is organised around three central variables, each the subject of a later chapter.

          **[Output](term:P1:output_GDP)**, measured by [gross domestic product](term:P2:GDP_definition) (GDP), is the
          total value of the goods and services an economy produces in a period. Its growth over decades determines
          living standards; its fluctuations from year to year are the [business cycle](term:P2:business_cycle)
          ([chapter 2](theory:P2)).

          **[Inflation](term:P1:inflation)**, how fast prices rise, in percent a year, is usually measured as the
          percentage change of a [consumer price index](term:P4:consumer_price_index) over a year. The Swiss National
          Bank, for example, defines price stability as consumer-price inflation of less than 2% per year ([chapter
          4](theory:P4-s5c)).

          The **[unemployment rate](term:P1:unemployment)** is the share of the [labour force](term:P5:labour_force),
          the people who work or are looking for work, who are without a job and looking for one ([chapter
          5](theory:P5-s1b)).

          A fourth number is central to monetary policy: the **[policy rate](term:P1:policy_rate)**, the short-term
          interest rate the [central bank](term:P1:central_bank) sets each quarter. Unlike the other three, it is not an
          outcome but a decision, and it is the instrument through which monetary policy influences the other variables.
          Most reports on the economy concern one of these four numbers.

  - id: s3
    title: "The circular flow of the economy"
    objectives: [LO3]
    steps:
      - id: s3a
        sources:
          - {key: legge_2023, loc: "1.2"}
          - {key: mankiw_2025, loc: "ch. 2"}
          - {key: blanchard_illing_2021, loc: "ch. 3 and App. A"}
          - {key: mankiw_2025, loc: "ch. 20"}
          - {key: swiss_constitution_1999, loc: "art. 99"}
          - {key: snb_nd}
        text: |
          ### The actors

          An economy consists of millions of decision-makers. To keep the picture manageable,
          [macroeconomics](term:P1:macroeconomics) groups them into a few types of **actors** that play similar roles.
          These chapters use five.

          **[Households](term:P1:households)** own the economy's factors of production: they supply their labour to
          firms and, directly or through banks and pension funds, their savings as capital. With the income they earn
          they buy goods and services, which economists call [consumption](term:P2:consumption), and the part of income
          they do not consume is saving.

          **[Firms](term:P1:firms)** combine labour and capital to produce goods and services. They decide how much to
          produce, how many workers to hire, at what price to sell and whether to buy new machines and buildings, which
          economists call [investment](term:P2:investment).

          **[Commercial banks](term:P1:banks)** are financial intermediaries. They accept deposits from savers and grant
          loans to households and firms, thereby channelling savings to those who want to borrow. In doing so they
          transform short-term deposits into longer-term loans, and when they grant a loan they create new deposits, a
          point [chapter 4](theory:P4-s3b) returns to.

          The **[government](term:P1:government)** buys goods and services, such as roads, schools and the work of its
          employees, pays transfers such as pensions, and finances this through taxes and, if it spends more than it
          collects, through borrowing. Its decisions on spending and taxes are called fiscal policy.

          The **[central bank](term:P1:central_bank)** has the monopoly on issuing the economy's base
          [money](term:P4:money). It sets the [policy rate](term:P1:policy_rate) at which banks can obtain [central bank
          money](term:P4:central_bank_money) and is responsible for price stability. In Switzerland this is the Swiss
          National Bank (SNB), which conducts monetary policy independently of the government.

          Real economies contain further actors, most importantly the rest of the world. These chapters study a
          **[closed economy](term:P1:closed_economy)**, without trade with other countries, so that the interactions at
          home remain visible. The price of this choice is that exchange rates, which matter greatly for a small open
          economy such as Switzerland, are left out.
      - id: s3b
        sources:
          - {key: legge_2023, loc: "1.5.1"}
          - {key: mankiw_2025, loc: "ch. 2"}
          - {key: blanchard_illing_2021, loc: "App. A"}
        text: |
          ### The circular flow

          The actors are connected through their transactions: what one actor pays, another receives. Economists
          represent this as the **[circular flow](term:P1:circular_flow)** of the economy. It contains two kinds of
          flows running in opposite directions. **[Real flows](term:P1:real_flow)** are flows of labour, goods and
          services; **[money flows](term:P1:money_flow)** are the payments made for them. Households provide labour to
          firms and receive wages; firms supply goods and services to households and receive their spending. Savings
          flow through the banks to firms that invest; taxes flow to the government, which buys goods and pays
          transfers; and the central bank acts on the whole system through the banks.

          The circular flow makes one fundamental fact visible: every payment in the economy is at the same time
          someone's income. Total spending on the goods and services produced therefore equals the total income earned
          in producing them. [Chapter 2](theory:P2-s1) turns this fact into the measurement of
          [GDP](term:P2:GDP_definition). Build the cycle yourself below.
        details:
          title: "From Quesnay's Tableau to Phillips's water machine"
          sources:
            - {key: quesnay_1758}
            - {key: screpanti_zamagni_2005, loc: "the Physiocrats"}
            - {key: mankiw_2025, loc: "ch. 2"}
            - {key: legge_2023, loc: "1.5.1"}
            - {key: phillips_1950}
            - {key: bollard_2016}
            - {key: cambridge_econ_nd}
          text: |
            The idea of the economy as a circulation is older than [macroeconomics](term:P1:macroeconomics). In 1758
            François Quesnay, physician at the French court, published the *Tableau économique*, a zigzag diagram showing
            how the product of agriculture circulates between farmers, landowners and artisans and returns to agriculture
            as spending. Historians of economic thought read the Tableau as a physician's analogy: [money](term:P4:money)
            circulates through the economy as blood circulates through the body. The modern textbook version, with
            households and firms exchanging factor services for income and goods for spending, was popularised in the
            twentieth century and is the starting point of national accounting (Mankiw, 2025, ch. 2; Legge, 2023, ch.
            1.5.1).

            In 1949 the engineer-turned-economist Bill Phillips, later known for the [Phillips
            curve](term:P5:phillips_curve) that [chapter 5](theory:P5-s7a) discusses, built the [circular
            flow](term:P1:circular_flow) as a machine: the MONIAC, a system of tanks, pipes and valves in which coloured
            water represented money flowing through the British economy. Opening a valve for taxes or saving drained water
            from the flow of spending; the machine computed the new equilibrium hydraulically. Several copies were built
            for universities and [central banks](term:P1:central_bank), and one is still exhibited at the Science Museum
            in London.

            The diagram below follows the textbook version and adds banks and the central bank as separate actors, because
            they are central to monetary policy. It leaves out trade, government borrowing, purchases between firms and
            the central bank's profits.
        module: {kind: circular_flow}
    circular_flow:   # the module of step s3b: the actors, the flows with their arrows' geometry, the stages
      intro: |
        The five actors are connected. What one actor pays, another receives. Economists draw this as a cycle, the
        "circular flow" of the economy. Solid arrows show money. Dashed arrows show real things: working hours, goods
        and services. One arrow stands for monetary policy.
      actors: {firms: "Firms", households: "Households", central_bank: "Central bank", banks: "Commercial banks", government: "Government"}
      flow_types: {real: "Real flow (labour, goods)", money: "Money flow", policy: "Monetary policy"}
      nodes:       # x, y, width, height on a canvas of 680 x 500
        firms: [40, 40, 120, 340]
        households: [520, 40, 120, 340]
        central_bank: [270, 100, 140, 44]
        banks: [270, 220, 140, 44]
        government: [270, 435, 140, 44]
      flows:
        - {id: 1, from: households, to: firms, type: real, card: "Provide working hours (labour)", path: "M518 60 L164 60", badge: [230, 60]}
        - {id: 2, from: firms, to: households, type: money, card: "Pay wages", path: "M162 80 L516 80", badge: [450, 80]}
        - {id: 3, from: firms, to: households, type: real, card: "Supply goods and services", path: "M162 310 L516 310", badge: [230, 310]}
        - {id: 4, from: households, to: firms, type: money, card: "Pay for goods and services (consumption)", path: "M518 334 L164 334", badge: [450, 334]}
        - {id: 5, from: households, to: banks, type: money, card: "Deposit savings", path: "M518 232 L414 232", badge: [466, 232]}
        - {id: 6, from: banks, to: households, type: money, card: "Pay interest on deposits", path: "M412 254 L516 254", badge: [466, 254]}
