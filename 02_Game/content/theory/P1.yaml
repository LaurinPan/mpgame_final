        - {id: 8, from: firms, to: banks, type: money, card: "Repay loans with interest", path: "M162 232 L266 232", badge: [214, 232]}
        - {id: 9, from: households, to: government, type: money, card: "Pay taxes", path: "M610 382 L610 470 L414 470", badge: [610, 420]}
