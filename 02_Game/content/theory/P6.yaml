# Chapter 6 of the theory section, "Growth and potential output". Its texts are written from three textbooks
# (references.yaml) and name the section they rest on at the end of every paragraph. They use the glossary's terms and
# explanations, "government spending" and "the rate the economy needs", and they do not mention a game.
#   chapter  id, title, the learning objectives
#   cards    the term cards: term, core (the explanation; the glossary's own, lower case, where `glossary: true`), example,
#            aliases, see_also (a preview card's full card), box (false: never shown as a box), step (where the text defines it)
#   topics   id, title, objectives, steps: id, sources ({key, loc} into references.yaml), text (Markdown: [label](term:P4:id)
#            marks a term, [label](theory:P2-s1d) links a chapter, topic or step), module (one of the modules of modules.yaml
#            with this step's controls and view), figure (a static figure drawn from economy.yaml)

chapter:
  id: P6
  title: "Growth and potential output"
  objectives:
    LO1: "Explain the production function, constant returns to scale and diminishing marginal products, and why capital's share of income is one third in the example economy."
    LO2: "Explain potential output as the output produced at natural employment, and the output gap as actual minus potential output."
    LO3: "Explain capital accumulation and the steady state, and why a higher saving rate raises the level of output but not its long-run growth rate."
    LO4: "Explain how labour-force growth and technological progress sustain growth on a balanced path, and why only technology raises output per worker in the long run."
    LO5: "Explain how growth accounting splits output growth into the contributions of capital, labour and technology."

cards:
  production_function: {term: "Production function", core: "A description of how much output an economy can produce from the capital and labour it has, at a given technology. It describes what can be produced, not what buyers want.", example: "With $2,200 million of capital and 9,600 workers, the example economy can produce $900 million a year.", step: s1a}
  capital_stock: {term: "Capital stock (K)", core: "All the machines, equipment and buildings that firms own and use to produce. In economics, capital means these produced means of production, not money or shares.", example: "The firms of the example economy own machines and buildings worth $2,200 million.", step: s1a}
  constant_returns: {term: "Constant returns to scale", core: "The property that doubling all inputs together, capital and workers alike, doubles output: a second factory just like the first, with the same staff, produces just as much.", example: "With $4,400 million of capital and 19,200 workers, output would be $1,800 million.", step: s1b}
  marginal_product: {term: "Marginal product", core: "The extra output that one more unit of an input adds while the other inputs stay the same: what one more worker, or one more dollar of machines, contributes.", example: "One more worker adds about $62,500 a year; a further $10 million machine about $1.4 million.", aliases: ["marginal products"], step: s1b}
  diminishing_marginal_product: {term: "Diminishing marginal product", core: "The fact that each further addition of one input, with the others unchanged, adds less output than the one before: ever more machines for the same workers are used less and less fully.", example: "Three additions of $220 million of machines add $29.1, $27.3 and $25.9 million of output.", aliases: ["diminishing returns"], step: s1b}
  cobb_douglas: {term: "Cobb-Douglas production function", core: "A particular production function, named after its authors, in which 1% more of an input always raises output by the same fixed percentage, so that each input keeps the same share of income.", example: "1% more capital raises output by a third of 1%; 1% more workers by two thirds of 1%.", aliases: ["Cobb-Douglas function", "Cobb-Douglas"], step: s1c}
  capital_share: {term: "Capital share", core: "The part of total income that goes to the owners of capital as profits, interest and rents; the rest goes to workers as wages.", example: "Profits of $300 million out of income of $900 million: a capital share of one third.", aliases: ["capital's share"], step: s1c}
  potential_output: {term: "Potential output (Yₙ)", core: "the output the economy produces when prices and wages have fully adjusted; it grows along the trend", example: "With 9,600 workers employed at the natural rate, potential output is $900 million.", glossary: true, step: s2a}
  output_gap: {term: "Output gap", core: "the difference between output and its potential, in percent", example: "Output of $925 million against potential of $900 million: a gap of +$25 million, or +2.8%.", aliases: ["output gaps"], glossary: true, step: s2b}
  capital_per_worker: {term: "Capital per worker", core: "The capital stock divided by the number of workers: how much equipment each worker has to work with.", box: false, step: s3a}
  saving_rate: {term: "Saving rate (s)", core: "The share of an economy's income that is not consumed, by households or the government, and is therefore available for investment.", example: "Of income of $900 million, $220 million is saved: a saving rate of about 24.4%.", aliases: ["saving rates"], step: s3a}
  depreciation: {term: "Depreciation", core: "The part of the capital stock that wears out or becomes obsolete during a year. In everyday speech the word can also mean a currency losing value; here it means machines losing their use.", example: "Capital of $2,200 million wears out at 8% a year: $176 million of depreciation.", step: s3a}
  capital_accumulation: {term: "Capital accumulation", core: "The growth of the capital stock over time: each year it rises by what is invested and falls by what wears out.", example: "Investment of $220 million minus depreciation of $176 million adds $44 million to capital.", step: s3b}
  steady_state: {term: "Steady state", core: "The situation in which capital per worker no longer changes, because each year's investment just replaces what wears out and equips new workers. Once there, the economy stays there unless something changes.", example: "Without more workers or better technology, the example economy would settle at capital of about $3,075 million.", aliases: ["steady states"], step: s3b}
  transitional_growth: {term: "Transitional growth", core: "Faster growth while an economy moves towards a higher steady state; it fades as the economy gets closer, because it comes from adding capital, whose extra output keeps shrinking.", example: "A saving rate of 30% lifts growth to about 2.8% in the first year, then back towards 2%.", step: s3c}
  labour_force_growth: {term: "Labour-force growth rate (n)", core: "The yearly growth, in percent, of the number of people who work or look for work.", box: false, step: s4a}
  technological_progress: {term: "Technological progress", core: "Any improvement that lets the same capital and workers produce more: better machines and methods, organisation and knowledge. In economics it covers far more than new gadgets.", example: "Each worker in the example economy produces 1% more each year with the same equipment.", step: s4b}
  efficiency_of_labour: {term: "Efficiency of labour (A)", core: "How productive a worker is thanks to the knowledge and methods in use. Technology is counted as if it added workers: a worker today does the work of more than one worker of the past.", example: "After a year of 1% progress, 9,600 workers do the work of 9,696 workers of the year before.", step: s4b}
  break_even_investment: {term: "Break-even investment", core: "The investment that just keeps the economy's capital in step with its workers and their efficiency: it replaces worn-out machines, equips new workers and keeps up with technology.", example: "$176 million for wear, $22 million for new workers, $22 million for technology: $220 million.", step: s4c}
  balanced_growth: {term: "Balanced growth", core: "Growth in which capital and output rise at the same rate as the number of workers times their efficiency, so that output per worker grows exactly with technology.", example: "Capital and output grow by 2% a year, output per worker and the real wage by 1%.", aliases: ["balanced-growth path", "balanced growth path"], step: s4c}
  growth_accounting: {term: "Growth accounting", core: "A method that splits output growth into the parts that come from more capital, more workers and better technology, weighting each input's growth by its share of income.", example: "Growth of 2% = 0.67 points from capital + 0.67 from labour + 0.67 from technology.", step: s5a}
  total_factor_productivity: {term: "Total factor productivity", core: "How much output an economy obtains from its capital and labour taken together. When it rises, the same machines and workers produce more.", example: "In the example economy it rises by about 0.67% a year.", aliases: [TFP], step: s5a}
  solow_residual: {term: "Solow residual", core: "Total factor productivity growth as it is measured: the part of output growth that more capital and more workers cannot explain. It therefore contains everything not measured, not only technology.", example: "Output grows by 2%; capital and labour explain 1.33 points; the residual is 0.67 points.", step: s5b}
  golden_rule: {term: "Golden rule", core: "The saving rate at which consumption in the steady state is highest. Saving more would add capital that does not even pay for its own upkeep in extra consumption.", example: "In the example economy the golden-rule saving rate is one third.", aliases: ["golden-rule"], step: s3c}

topics:

  - id: s1
    title: "The Production Function"
    objectives: [LO1]
    steps:
      - id: s1a
        sources:
          - {key: blanchard_illing_2017, loc: "2.5"}
          - {key: mankiw_2019, loc: "3-1"}
        text: |
          ### What an economy can produce

          Suppose the finance ministry of the example economy wants households to save 30% of the economy's
          income instead of about 24%, and argues that the economy would then grow faster for good. This chapter
          gives the theory needed to judge the claim, and [the topic on technological progress](theory:P6-s4c)
          returns to it.

          The chapter belongs to the [long run](term:P3:long_run), in which growth depends on how fast capital
          and technical knowledge grow (Blanchard & Illing, 2017, 2.5).

          The **[production function](term:P6:production_function)** says how much output an economy can produce
          from its capital and labour with the technology it has. A better way of producing means more output
          from the same inputs (Mankiw, 2019, 3-1).

          > Y = F(K, N)

          K is the **[capital stock](term:P6:capital_stock)**, the equipment that people work with, from cranes
          to computers, and N the number of workers (Mankiw, 2019, 3-1).

          The firms of the example economy own capital worth $2,200 million and employ 9,600 workers. With these
          they produce [output](term:P1:output_GDP) of $900 million a year.
      - id: s1b
        sources:
          - {key: mankiw_2019, loc: "3-1, 3-2, 8-1"}
        text: |
          ### Returns to scale and diminishing returns

          **[Constant returns to scale](term:P6:constant_returns)** mean that raising all inputs by the same
          percentage raises output by that percentage too (Mankiw, 2019, 3-1).

          The **[marginal product](term:P6:marginal_product)** of an input is the extra output from one more
          unit of it, while the other inputs stay the same. Most production functions show **[diminishing
          marginal product](term:P6:diminishing_marginal_product)**: with capital held fixed, each further
          worker adds less than the one before (Mankiw, 2019, 3-2). The same holds for capital when the number
          of workers is fixed (Mankiw, 2019, 8-1).

          In the example economy, twice the capital and twice the workers, $4,400 million and 19,200, would
          produce $1,800 million. One more worker adds about $62,500 a year, one more dollar of machines about
          13.6 cents. Three equal additions of $220 million of capital, with 9,600 workers, add $29.1, $27.3 and
          $25.9 million of output: each adds less than the one before.

          Diminishing marginal product of capital is why adding capital cannot keep an economy growing for ever,
          as the following topics show (Mankiw, 2019, 8-1).
        figure: {kind: production_function, description: "Output of the example economy against its capital stock, with 9,600 workers; three equal additions of capital of $220 million each add less and less output."}
      - id: s1c
        sources:
          - {key: mankiw_2019, loc: "3-2"}
        text: |
          ### The Cobb-Douglas function and the shares of income

          A much-used form is the **[Cobb-Douglas production function](term:P6:cobb_douglas)**. Its mark is that
          the shares of income going to capital and to labour stay constant, whatever the amounts of the two
          inputs. If firms pay each input its marginal product, the exponent on capital is capital's share of
          income, the **[capital share](term:P6:capital_share)** (Mankiw, 2019, 3-2).

          > Y = K^1/3 × (A × N)^2/3

          This is the function of the example economy, where A is the [efficiency of
          labour](term:P6:efficiency_of_labour). Of income of $900 million, wages are $600 million and profits
          $300 million: a capital share of one third. Each of the 9,600 workers earns two thirds of the output
          per worker of $93,750, that is $62,500, the [real wage](term:P5:real_wage) of [chapter
          5](theory:P5-s4a).

  - id: s2
    title: "Potential Output and the Output Gap"
    objectives: [LO2]
    steps:
      - id: s2a
        sources:
          - {key: blanchard_illing_2017, loc: "9.1"}
          - {key: legge_2023, loc: "7.2"}
        text: |
          ### Potential output

          **[Potential output](term:P6:potential_output)**, written Yₙ, is what the economy produces at [natural
          employment](term:P5:natural_employment), the number of people in work once unemployment has settled at
          its [natural rate](term:P5:natural_rate) (Blanchard & Illing, 2017, 9.1).

          In the example economy, $2,200 million of capital and 9,600 workers, the number employed at the
          natural rate of 4%, produce $900 million: potential output is $900 million.

          Potential output grows over time, because the number of workers and their productivity grow. Its
          growth rate is the one at which unemployment neither rises nor falls: the [normal growth
          rate](term:P5:normal_growth_rate) of [Okun's law](theory:P5-s5a) (Blanchard & Illing, 2017, 9.1).

          For a time, the economy can produce more than its potential. Unemployment is then below its natural
          rate, and prices rise faster than people had expected (Legge, 2023, 7.2).
      - id: s2b
        sources:
          - {key: blanchard_illing_2017, loc: "9.1"}
          - {key: legge_2023, loc: "7.2"}
          - {key: mankiw_2019, loc: "15-1"}
        text: |
          ### The output gap

          The **[output gap](term:P6:output_gap)** sets actual output against potential output. It mirrors the
          labour market: a gap of zero goes with unemployment at its natural rate, a negative gap with higher
          unemployment and a positive gap with lower (Blanchard & Illing, 2017, 9.1).

          > output gap = actual output − potential output

          In the example economy, demand and potential output are both $900 million, so the gap is zero. If the
          government spends $10 million more, [the multiplier of chapter 3](theory:P3-s4a) raises output to $925
          million: a gap of +$25 million, or +2.8%. If households consume $10 million less at every level of
          income, a [demand shock](term:P3:demand_shock), output falls to $875 million, a gap of −2.8%.
          Potential output is the same in both cases.

          Inflation feels the gap. With output beyond its potential, prices rise faster than people had expected
          (Legge, 2023, 7.2). This is why the gap serves as the gauge of the business cycle (Mankiw, 2019,
          15-1).
        figure: {kind: output_gap, description: "Actual and potential output of the example economy in the worked cases of the text: potential output of $900 million, actual output of $925 million and $875 million."}

  - id: s3
    title: "Capital Accumulation and the Steady State"
    objectives: [LO3]
    steps:
      - id: s3a
        sources:
          - {key: mankiw_2019, loc: "8-1"}
        text: |
          ### Saving, investment and depreciation

          The simplest account of growth is that an economy adds capital. To isolate it, this topic holds the
          number of workers and the technology fixed, so that what matters is **[capital per
          worker](term:P6:capital_per_worker)** (Mankiw, 2019, 8-1).

          Two forces move the [capital stock](term:P6:capital_stock). [Investment](term:P2:investment) adds to
          it, and investment equals saving: the **[saving rate](term:P6:saving_rate)** s is the part of its
          income that the economy saves and so invests. **[Depreciation](term:P6:depreciation)** works the other
          way: each year a fixed share of the existing capital wears out (Mankiw, 2019, 8-1).

          In the example economy, $220 million of income of $900 million is saved and invested, a saving rate of
          about 24.4%. Capital of $2,200 million, about $229,000 per worker, wears out at 8% a year. So $176
          million of the investment only replaces worn-out capital, and $44 million adds to the stock.
      - id: s3b
        sources:
          - {key: mankiw_2019, loc: "8-1"}
        text: |
          ### Capital accumulation and the steady state

          Each year the capital stock changes by investment minus depreciation. This is **[capital
          accumulation](term:P6:capital_accumulation)** (Mankiw, 2019, 8-1).

          > change in capital = s × Y − δ × K

          With more capital, output and investment are higher, but so is depreciation. Because of [diminishing
          marginal product](term:P6:diminishing_marginal_product), output and investment rise more and more
          slowly, while depreciation rises in step with capital. At one level of capital, investment equals
          depreciation and capital stops changing: the **[steady state](term:P6:steady_state)**. An economy
          below it accumulates capital, an economy above it runs capital down, so the steady state is where the
          economy ends up (Mankiw, 2019, 8-1).

          In the example economy without more workers or better technology, the steady state lies at capital of
          about $3,075 million and [output](term:P1:output_GDP) of about $1,006 million, 12% above today's. The
          diagram below shows investment, depreciation and where they cross.

          Change the saving rate and the rate of depreciation.
        module: {kind: solow, controls: [s, delta], view: stage_a}
      - id: s3c
        sources:
          - {key: mankiw_2019, loc: "8-1, 8-2"}
          - {key: blanchard_illing_2017, loc: "3.4"}
        text: |
          ### The saving rate: a higher level, not faster growth for ever

          A higher saving rate means more investment at every level of capital, and the economy moves to a
          steady state with more capital and more output. But it grows faster only until the new steady state is
          reached: a higher saving rate raises the level of output, not its growth rate in the [long
          run](term:P3:long_run). The extra growth on the way, **[transitional
          growth](term:P6:transitional_growth)**, fades as the economy gets there (Mankiw, 2019, 8-1).

          In the example economy without more workers or better technology, a saving rate of 30% instead of
          24.4% lifts growth to about 1.4% in the first year instead of 0.7%, and the steady state to output of
          about $1,115 million instead of $1,006 million.

          More saving is not always better. Among all steady states, the one in which people consume most is
          called the **[golden rule](term:P6:golden_rule)** (Mankiw, 2019, 8-2).

          In the [short run](term:P3:short_run) the effect differs: when households try to save more, demand and
          output fall, the paradox of saving ([chapter 3](theory:P3-s4c)) (Blanchard & Illing, 2017, 3.4).
        module: {kind: solow, controls: [s, delta], view: stage_a}

  - id: s4
    title: "Labour-Force Growth and Technological Progress"
    objectives: [LO4]
    steps:
      - id: s4a
        sources:
          - {key: mankiw_2019, loc: "8-3"}
        text: |
          ### More workers

          Real economies keep growing. One reason is that the number of workers grows, at the **[labour-force
          growth rate](term:P6:labour_force_growth)** n. New workers need capital too:
          [investment](term:P2:investment) must now also equip them, if [capital per
          worker](term:P6:capital_per_worker) is to stay the same (Mankiw, 2019, 8-3).

          In the [steady state](term:P6:steady_state) with a growing labour force, capital and
          [output](term:P1:output_GDP) grow at the rate n, while output per worker stays constant. Population
          growth explains why total output keeps growing, but not why living standards rise (Mankiw, 2019, 8-3).

          In the example economy, the [labour force](term:P5:labour_force) of 10,000 grows by 1% a year. To keep
          capital per worker where it is, the [capital stock](term:P6:capital_stock) of $2,200 million must also
          grow by 1%: $22 million of the year's investment goes to equipping new workers.
      - id: s4b
        sources:
          - {key: mankiw_2019, loc: "9-1"}
        text: |
          ### Better technology

          The second reason is **[technological progress](term:P6:technological_progress)**: better knowledge
          about how to produce. The model captures it with the **[efficiency of
          labour](term:P6:efficiency_of_labour)** A. As technology improves, each hour of work contributes more,
          as if there were more workers. N × A is the number of effective workers (Mankiw, 2019, 9-1).

          In the example economy, efficiency rises by 1% a year: after a year, the 9,600 workers do the work of
          9,696 workers of the year before. Keeping capital in step with them takes another $22 million.

          The difference from a growing labour force is decisive. Technological progress raises output per
          worker year after year, and in this model it alone accounts for living standards that keep rising
          (Mankiw, 2019, 9-1).
      - id: s4c
        sources:
          - {key: mankiw_2019, loc: "9-1, 9-2"}
        text: |
          ### Balanced growth

          Investment now has three tasks: to replace worn-out capital, to equip new workers and to keep up with
          the efficiency of labour. The amount that does all three is **[break-even
          investment](term:P6:break_even_investment)** (Mankiw, 2019, 9-1).

          > break-even investment = (δ + n + g_A) × K

          When investment equals it, capital per effective worker stays constant. Capital and output then grow
          at the rate n + g_A, and output per worker at the rate g_A. This is **[balanced
          growth](term:P6:balanced_growth)** (Mankiw, 2019, 9-1, 9-2).

          In the example economy, break-even investment is (8% + 1% + 1%) × $2,200 million = $220 million,
          exactly the economy's investment. Capital and output grow by 2% a year, output per worker and the
          [real wage](term:P5:real_wage) by 1%.

          Now the ministry's claim: in the example economy, a [saving rate](term:P6:saving_rate) of 30% would
          lift growth to about 2.8% in the first year and 2.1% after thirty, then back to 2%. Output would end
          up about 11% higher. Saving more raises output, but not growth for good.

          Change the three rates in the diagram below.
        module: {kind: solow, controls: [s, "n", g_A], view: growth}

  - id: s5
    title: "Growth Accounting"
    objectives: [LO5]
    steps:
      - id: s5a
        sources:
          - {key: mankiw_2019, loc: "Appendix to Chapter 9"}
        text: |
          ### Where growth comes from

          **[Growth accounting](term:P6:growth_accounting)** splits the growth of [output](term:P1:output_GDP)
          into the parts that come from more capital, from more labour and from better technology. The growth of
          each input is weighted by its share of income (Mankiw, 2019, Appendix to Chapter 9).

          > output growth = capital share × capital growth + labour share × labour growth + growth of total factor productivity

          **[Total factor productivity](term:P6:total_factor_productivity)** measures the level of technology: a
          rise of 1% lifts output by 1% even if capital and labour stay as they are (Mankiw, 2019, Appendix to
          Chapter 9).

          In the example economy, output and capital grow by 2% a year and the number of workers by 1%. With a
          [capital share](term:P6:capital_share) of one third, capital contributes 1/3 × 2% = 0.67 points and
          labour 2/3 × 1% = 0.67 points. The remaining 0.67 points are the growth of total factor productivity.
          It is less than the 1% by which the [efficiency of labour](term:P6:efficiency_of_labour) rises,
          because that progress works through labour, which earns two thirds of income.
        figure: {kind: growth_accounting, description: "Output growth of 2% a year in the example economy split into the contributions of capital, labour and total factor productivity."}
      - id: s5b
        sources:
          - {key: mankiw_2019, loc: "Appendix to Chapter 9"}
          - {key: blanchard_illing_2017, loc: "9.1"}
        text: |
          ### The Solow residual

          Technology cannot be observed directly. The growth of total factor productivity is therefore computed
          as what remains of output growth once the measured contributions of capital and labour have been taken
          away. It is called the **[Solow residual](term:P6:solow_residual)**, in honour of Robert Solow, who
          devised the calculation (as cited in Mankiw, 2019, Appendix to Chapter 9).

          Many take the residual as a gauge of [technological progress](term:P6:technological_progress). But
          anything else that alters how much output the measured inputs yield ends up in it as well, education
          and regulation for instance (Mankiw, 2019, Appendix to Chapter 9).

          In the example economy, the residual is 2% − 0.67 − 0.67 = 0.67 points.

          Growth accounting also shows why [potential output](term:P6:potential_output) grows at the [normal
          growth rate](term:P5:normal_growth_rate): the labour force and productivity grow at rates that add up
          to it (Blanchard & Illing, 2017, 9.1).
