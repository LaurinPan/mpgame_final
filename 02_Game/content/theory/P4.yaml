# Chapter 4 of the theory section, "Money, prices and interest". Its texts are written from three textbooks
# (references.yaml) and name the section they rest on at the end of every paragraph. They use the glossary's terms and
# explanations, "government spending" and "the rate the economy needs", and they do not mention a game.
#   chapter  id, title, the learning objectives
#   cards    the term cards: term, core (the explanation; the glossary's own, lower case, where `glossary: true`), example,
#            aliases, see_also (a preview card's full card), box (false: never shown as a box), step (where the text defines it)
#   topics   id, title, objectives, steps: id, sources ({key, loc} into references.yaml), text (Markdown: [label](term:P4:id)
#            marks a term, [label](theory:P2-s1d) links a chapter, topic or step), module (one of the modules of modules.yaml
#            with this step's controls and view), figure (a static figure drawn from economy.yaml)

chapter:
  id: P4
  title: "Money, prices and interest"
  objectives:
    LO1: "Explain how price indices measure the price level, how the GDP deflator and the consumer price index differ, and how the inflation rate is computed."
    LO2: "Explain what money is, its three functions, and what the money stock contains."
    LO3: "Explain how commercial banks create money by lending and what limits money creation."
    LO4: "Explain how the central bank sets the policy rate, using the demand for money and the supply of money, and why central banks steer the interest rate rather than the money stock."
    LO5: "Explain the quantity theory as a long-run account of inflation, and the costs of expected and unexpected inflation."
    LO6: "Distinguish nominal and real interest rates using expected inflation, and explain the risk premium."
    LO7: "Explain why investment falls when the real interest rate rises."

cards:
  price_level: {term: "Price level (P)", core: "The average level of prices in the economy, compared with a base year. When it rises by 5%, the things people buy cost on average 5% more than before.", example: "A price level of 1.10 means that things cost on average 10% more than in the base year.", step: s1a}
  GDP_deflator: {term: "GDP deflator", core: "A measure of the prices of everything an economy produces: how much more this year's output costs at this year's prices than it would at the prices of the base year.", example: "Year 2's output costs $793 million at its own prices and $730 million at year-1 prices: prices are about 8.6% higher.", aliases: [deflator], step: s1a}
  consumer_price_index: {term: "Consumer price index (CPI)", core: "A measure of the cost of living: statisticians price the same basket of goods that a typical household buys, year after year, and compare its cost with the base year.", example: "If the basket cost $100 in the base year and costs $110 now, the index is 110.", aliases: [CPI], step: s1b}
  inflation_rate: {term: "Inflation rate (π)", core: "how fast prices rise, in percent a year", example: "The GDP deflator rises from 100 to 108.6: inflation of 8.6% a year.", aliases: ["inflation rate", inflation], glossary: true, step: s1b}
  deflation: {term: "Deflation", core: "A fall in the average level of prices, so that the same money buys more over time. It is not the same as lower inflation, in which prices still rise, only more slowly.", example: "If the price index falls from 110 to 108, there is deflation.", step: s1b}
  money: {term: "Money", core: "Whatever people generally accept as payment: banknotes, coins and bank deposits. In economics, money is not the same as wealth or income: a house is wealth, but you cannot pay for bread with it.", example: "The public holds $50 million in banknotes and $250 million in bank deposits.", step: s2a}
  medium_of_exchange: {term: "Medium of exchange", core: "Money's use as the thing everyone accepts in exchange for goods, so that a baker who wants shoes need not find a shoemaker who wants bread.", example: "The bakery is paid in dollars and pays the mill in dollars.", step: s2a}
  unit_of_account: {term: "Unit of account", core: "Money's use as the common measure in which prices, wages and debts are stated, so that very different things can be compared.", example: "A loaf costs $1.10 and a machine $10 million: both prices are stated in dollars.", step: s2a}
  store_of_value: {term: "Store of value", core: "Money's use for keeping purchasing power from today until later. Money is safe and can be spent at once, but it earns no interest and loses value when prices rise.", example: "A household keeps $500 in its account to pay next month's bills.", step: s2a}
  fiat_money: {term: "Fiat money", core: "Money with no value of its own, such as paper notes, accepted because the state declares it legal tender and because everyone trusts that others will accept it too.", example: "A $10 note costs a few cents to print but buys $10 worth of goods.", step: s2b}
  money_stock: {term: "Money stock (M)", core: "All the money held by households and firms at a point in time: banknotes and coins in their hands plus their bank deposits that can be used for payments.", example: "$50 million in banknotes plus $250 million in deposits: $300 million.", step: s2b}
  bank_balance_sheet: {term: "Bank balance sheet", core: "A list of what a bank owns, such as loans to customers and reserves, and of what it owes, mainly its customers' deposits; the difference is the bank's own capital.", example: "The banks own reserves of $25 million and loans of $245 million and owe deposits of $250 million.", aliases: ["balance sheet"], step: s3a}
  reserves: {term: "Reserves", core: "The money that banks keep as cash or in their own account at the central bank. They use it to pay other banks when customers transfer money.", example: "Banks hold $25 million in reserves against $250 million of deposits.", step: s3a}
  fractional_reserve_banking: {term: "Fractional-reserve banking", core: "Banks keep only a small part of their customers' deposits as reserves and lend out the rest, because on any day only a few customers withdraw their money.", example: "Banks keep $25 million of their $250 million in deposits, one tenth.", step: s3a}
  deposit_creation: {term: "Deposit creation", core: "When a bank makes a loan, the borrower receives money while the depositors keep their deposits. Lending thus creates money.", example: "The bakery borrows $10 million for vans: its account grows by $10 million, and so does the money stock.", step: s3b}
  money_multiplier: {term: "Money multiplier", core: "Why the money in bank accounts is a multiple of the money the central bank creates: each loan creates a new deposit, banks keep only a little of it as reserves, and people keep only a little as cash.", example: "Central bank money of $75 million goes with a money stock of $300 million, four times as much.", aliases: [multiplier], step: s3b}
  central_bank_money: {term: "Central bank money", core: "The money that only the central bank can create: the banknotes and coins in circulation and the reserves that banks hold in their accounts at the central bank.", example: "$50 million in banknotes plus $25 million in reserves: $75 million.", step: s4a}
  bond: {term: "Bond", core: "A promise to pay fixed amounts on fixed dates, which can be bought and sold. When interest rates rise, existing bonds are worth less, because new ones pay more.", example: "A bond that pays $103 in a year is worth $100 at 3% interest, but only $99.04 at 4%.", step: s4a}
  money_demand: {term: "Demand for money", core: "How much people want to keep as money rather than in bonds that pay interest. They want more when they buy more, and less when interest rates are high, because holding money then costs more interest.", example: "At an interest rate of 3%, people want to hold $300 million.", aliases: ["money demand"], step: s4b}
  money_market_equilibrium: {term: "Money-market equilibrium", core: "The interest rate at which people want to hold exactly the money there is. If there is more money, people buy bonds with it, and the interest rate falls until they are content to hold it.", example: "With $325 million instead of $300 million, the rate falls from 3% to 2.5%.", step: s4b}
  open_market_operation: {term: "Open-market operation", core: "The central bank buys bonds from banks and pays with newly created money, or sells bonds and takes money out of the economy.", example: "To raise its rate to 4%, the central bank sells bonds for $12.5 million.", step: s4b}
  policy_rate: {term: "Policy rate (i)", core: "the short-term interest rate the central bank sets each quarter", example: "When the central bank raises it from 3% to 4%, a firm's new loan becomes dearer.", glossary: true, step: s4c}
  interest_rate_steering: {term: "Interest-rate steering", core: "The way central banks work today: they announce the interest rate they want and supply as much money as banks ask for at that rate, instead of fixing the amount of money.", example: "The central bank announces 3% and lends banks whatever they need at about that rate.", step: s4c}
  quantity_equation: {term: "Quantity equation", core: "A bookkeeping fact linking money and spending: everything bought in a year is paid for with the money in the economy, each dollar being used several times.", example: "$300 million of money, each dollar spent three times, pays for $900 million of goods.", step: s5a}
  velocity_of_money: {term: "Velocity of money (V)", core: "How often an average dollar is used in a year to buy goods: money passes from buyer to seller, who spends it again.", example: "Output of $900 million paid for with $300 million of money: each dollar is used three times.", aliases: [velocity], step: s5a}
  quantity_theory: {term: "Quantity theory of money", core: "The view that over many years prices rise when the amount of money grows faster than the amount of goods it can buy: more money chasing the same goods drives prices up.", example: "Money grows by 4% a year and goods by 2%: prices rise by about 2% a year.", aliases: ["quantity theory"], step: s5b}
  costs_of_expected_inflation: {term: "Costs of expected inflation", core: "Even foreseen inflation costs effort and distorts: shoe-leather and menu costs, tax distortions, confusion about relative prices.", box: false, step: s5c}
  costs_of_unexpected_inflation: {term: "Costs of unexpected inflation", core: "Unforeseen inflation shifts wealth from lenders to borrowers and makes planning uncertain.", box: false, step: s5c}
  optimal_inflation_rate: {term: "Optimal inflation rate", core: "The inflation rate that balances the costs of inflation against the benefits of a small positive rate.", box: false, step: s5c}
  expected_inflation: {term: "Expected inflation (πᵉ)", core: "the inflation the public expects for the coming period, in percent a year", example: "People in the example economy expect prices to rise by 2% a year.", glossary: true, step: s6a}
  real_interest_rate: {term: "Real interest rate (r)", core: "the policy rate minus the inflation people expect", example: "You borrow $100 at 3% while prices rise by 2%: the $103 you repay buys only about 1% more than the $100 did.", glossary: true, step: s6a}
  fisher_equation: {term: "Fisher equation", core: "Irving Fisher's rule that lenders add the inflation they expect to the return they want in goods, so the real interest rate is about the interest rate minus expected inflation.", example: "A lender who wants 1% in real terms and expects 2% inflation asks for 3%.", step: s6a}
  risk_premium: {term: "Risk premium", core: "The extra interest a lender demands because a borrower might not pay back in full: the riskier the borrower, the higher the premium.", example: "Banks borrow at the central bank's 3%; firms, which may fail, pay 2 points more.", aliases: ["risk premia"], step: s6b}
  investment_project: {term: "Investment project", core: "A firm's possible purchase of new capital goods, such as a machine or a building.", box: false, step: s7a}
  expected_rate_of_return: {term: "Expected rate of return", core: "The yearly real return a firm expects a project to earn, in percent of its cost.", aliases: ["expected return"], box: false, step: s7a}
  investment_demand_curve: {term: "Investment demand curve", core: "How much firms invest at each interest rate: when borrowing gets dearer, fewer projects earn enough to cover it, firms drop them, and investment falls.", example: "At a cost of finance of 3%, firms invest $220 million; at 4%, two projects no longer pay, and they invest $180 million.", step: s7b}
  commodity_money: {term: "Commodity money", core: "Money that is also a useful or valuable thing in itself, such as gold or silver coins, or cigarettes in a prisoner-of-war camp.", example: "A gold coin keeps its value even if no one uses it as money.", step: s2b}
  double_coincidence_of_wants: {term: "Double coincidence of wants", core: "The problem of barter: a trade only happens if each side has exactly what the other wants, at the same time.", example: "A baker who wants shoes must find a shoemaker who wants bread.", step: s2a}
  nominal_interest_rate: {term: "Nominal interest rate", core: "An interest rate stated in money: how many more dollars are paid back for each dollar borrowed, without regard to what those dollars will buy.", example: "A loan at 3% means paying back $103 for every $100 borrowed.", step: s6a}
  ex_ante_real_rate: {term: "Ex ante real interest rate", core: "The real interest rate that borrowers and lenders expect when they agree a loan, based on the inflation they expect; it guides their decisions.", example: "A loan at 3% with 2% expected inflation has an ex ante real rate of about 1%.", aliases: ["ex ante"], step: s6a}
  ex_post_real_rate: {term: "Ex post real interest rate", core: "The real interest rate as it turns out after the loan, based on the inflation that actually occurred.", example: "If prices rise by 3% instead of 2%, the loan at 3% has cost nothing in real terms.", aliases: ["ex post"], step: s6a}
  neutrality_of_money: {term: "Neutrality of money", core: "The idea that, in the long run, more money only raises prices and leaves real things, such as output and employment, unchanged.", example: "Doubling all money would in the long run double all prices and change nothing else.", step: s5b}
  shoe_leather_costs: {term: "Shoe-leather costs", core: "The time and effort people spend to keep less cash when inflation is high, for example going to the bank more often; the name refers to shoes worn out on the way.", example: "With high inflation, a shop banks its takings every day instead of once a week.", step: s5c}
  menu_costs: {term: "Menu costs", core: "The costs of changing prices: printing new menus and price tags, and informing customers. They make firms change prices only now and then.", example: "A restaurant that reprints its menu for every price change pays menu costs.", step: s5c}
  hyperinflation: {term: "Hyperinflation", core: "Inflation of more than 50% per month.", box: false, step: s5b}
  cost_of_finance: {term: "Real cost of finance", core: "What it really costs a firm to fund a project, whether it borrows or uses its own money: the real interest rate plus the risk premium.", example: "A real policy rate of 1% plus a risk premium of 2%: 3%.", aliases: ["cost of finance"], step: s6b}
  user_cost_of_capital: {term: "User cost of capital", core: "What it costs a firm to use a machine for a year: the interest it could have earned on the money, plus the wear and tear of the machine.", example: "A $10 million machine that wears out by 10% a year, at a real interest rate of 3%, costs about $1.3 million a year to use.", step: s7b}
  tobins_q: {term: "Tobin's q", core: "The stock-market value of a firm's machines and buildings compared with what it would cost to buy them new. If the market values them above that cost, investing pays.", example: "If investors value a $100 million factory at $120 million, building another one pays.", step: s7b}
  inflation_target: {term: "Inflation target", core: "the inflation rate the central bank aims at, 2 percent a year", glossary: true, step: s5c}
  rate_economy_needs: {term: "The rate the economy needs", core: "the real interest rate at which spending neither grows nor shrinks, so that output stays at its potential; economists call it the natural rate of interest. It is never called \"natural rate\" alone, which always means the natural rate of unemployment", aliases: ["rate the economy needs"], glossary: true, step: s6a}

topics:

  - id: s1
    title: "Price Indices and Inflation"
    objectives: [LO1]
    steps:
      - id: s1a
        sources:
          - {key: mankiw_2019, loc: "2-1, 2-2"}
        text: |
          ### The price level and the GDP deflator

          Suppose the central bank of the example economy raises its policy rate from 3% to 4%. This chapter
          builds up what such a decision means, and [its last topic](theory:P4-s7b) returns to it.

          When prices are said to have risen, what is meant is their average. The **[price
          level](term:P4:price_level)** P is such an average, stated relative to a [base
          year](term:P2:base_year) (Mankiw, 2019, 2-2).

          One measure follows from [chapter 2](theory:P2-s2a). [Nominal GDP](term:P2:nominal_GDP) values output
          at current prices, [real GDP](term:P2:real_GDP) at the prices of the base year. Their ratio, the
          **[GDP deflator](term:P4:GDP_deflator)**, shows how prices in general have moved since the base year
          (Mankiw, 2019, 2-1).

          > GDP deflator = nominal GDP / real GDP × 100

          In the example economy, nominal output is $720, 793 and 848 million in years 1 to 3, and real output,
          at year-1 prices, $720, 730 and 746 million. The deflator is 100, then 793 / 730 × 100 = 108.6, then
          113.7.

          The deflator covers everything the economy produces, including what firms and the government buy, at
          current quantities (Mankiw, 2019, 2-2).
      - id: s1b
        sources:
          - {key: mankiw_2019, loc: "1-1, 2-2"}
        text: |
          ### The consumer price index and the inflation rate

          The **[consumer price index](term:P4:consumer_price_index)** (CPI) prices a fixed basket of the goods
          and services that a typical consumer buys: it is the cost of this basket relative to its cost in the
          base year (Mankiw, 2019, 2-2).

          The **[inflation rate](term:P4:inflation_rate)** is the percentage by which the price level changes
          between one period and the next (Mankiw, 2019, 2-2). A fall of the price level is called
          **[deflation](term:P4:deflation)** (Mankiw, 2019, 1-1).

          In the example economy, households buy only bread, whose price rises from $1.00 to $1.10 and $1.15:
          the CPI is 100, 110 and 115. CPI inflation is 10% in year 2 and 4.5% in year 3, against 8.6% and 4.6%
          with the deflator, which also counts machines, whose price rose by only 5%.

          The two measures differ because the CPI covers only what consumers buy and keeps its basket fixed,
          while the deflator covers all output and lets the weights change. A fixed basket tends to overstate
          the rise in the cost of living, since it ignores that consumers switch to goods that have become
          relatively cheaper (Mankiw, 2019, 2-2).
        figure: {kind: price_indices, description: "The GDP deflator and the CPI of the example economy over three years."}

  - id: s2
    title: "Money"
    objectives: [LO2]
    steps:
      - id: s2a
        sources:
          - {key: mankiw_2019, loc: "4-1"}
          - {key: blanchard_illing_2017, loc: "4.1"}
        text: |
          ### What money is

          In everyday speech, someone with "a lot of money" is wealthy. Economists use the word more narrowly:
          **[money](term:P4:money)** means only those assets that people can use straight away to pay (Mankiw,
          2019, 4-1).

          Money serves three purposes. As a **[medium of exchange](term:P4:medium_of_exchange)**, it is what
          people hand over when they buy. Without it, trade would be barter and would need a **[double
          coincidence of wants](term:P4:double_coincidence_of_wants)**: each side would have to hold what the
          other wants, at the very moment they meet. As a **[unit of account](term:P4:unit_of_account)**, it is
          the measure in which prices are quoted and debts recorded. As a **[store of
          value](term:P4:store_of_value)**, it carries purchasing power into the future, though imperfectly:
          when prices rise, a given amount buys less (Mankiw, 2019, 4-1).

          Because it is the medium of exchange, money is the most liquid of all assets (Mankiw, 2019, 4-1). Its
          drawback is that it pays no interest, unlike [bonds](term:P4:bond) (Blanchard & Illing, 2017, 4.1).
      - id: s2b
        sources:
          - {key: mankiw_2019, loc: "4-1, 4-2"}
        text: |
          ### Forms of money and the money stock

          Many societies have used **[commodity money](term:P4:commodity_money)**, a good with value of its own,
          most often gold. In some prisoner-of-war camps of the Second World War, cigarettes took this part:
          prisoners priced goods in cigarettes and paid with them (Mankiw, 2019, 4-1).

          Today's money is **[fiat money](term:P4:fiat_money)**. It has no value of its own and is money because
          the government decrees it. In the end its use rests on a convention: each person accepts it in the
          belief that the others will too (Mankiw, 2019, 4-1).

          The **[money stock](term:P4:money_stock)** M is the money that the public holds: currency, plus the
          bank deposits that households can draw on at any time to pay (Mankiw, 2019, 4-2).

          In the example economy, the public holds $50 million in currency and $250 million in bank deposits.
          The money stock is 50 + 250 = $300 million, a third of annual [output](term:P1:output_GDP) of $900
          million.

  - id: s3
    title: "Banks and Money Creation"
    objectives: [LO3]
    steps:
      - id: s3a
        sources:
          - {key: mankiw_2019, loc: "4-2"}
        text: |
          ### The bank's balance sheet

          A bank's **[balance sheet](term:P4:bank_balance_sheet)** lists its assets and its liabilities. The
          deposits of its customers are liabilities: the bank owes them. Its assets are the loans it has granted
          and its **[reserves](term:P4:reserves)**, the part of its deposits that it has kept instead of
          lending. Some reserves lie in the banks' own vaults, but most are held at the [central
          bank](term:P1:central_bank) (Mankiw, 2019, 4-2).

          Banks need reserves for the moments when depositors withdraw [money](term:P4:money). Since new
          deposits come in while others are paid out, holding back the full amount is unnecessary, and lending
          the rest earns interest. This is **[fractional-reserve banking](term:P4:fractional_reserve_banking)**:
          reserves cover only part of what customers have deposited (Mankiw, 2019, 4-2).

          In the example economy, deposits are $250 million and banks hold reserves of $25 million, a reserve
          ratio of 10%. The rest of their assets are loans.
        figure: {kind: balance_sheet, description: "The balance sheets of a bank and a borrower, before and after a loan."}
      - id: s3b
        sources:
          - {key: mankiw_2019, loc: "4-2, 4-3"}
        text: |
          ### How lending creates money

          With fractional reserves, banks create money. When a bank makes a loan, the borrower receives money,
          while the depositors still hold their deposits: the [money stock](term:P4:money_stock) has grown. This
          is **[deposit creation](term:P4:deposit_creation)**. It makes the economy more liquid but no richer,
          since the borrower also takes on a debt (Mankiw, 2019, 4-2).

          A simple model ties the money stock to the monetary base, the currency held by the public plus the
          reserves of the banks, which the central bank controls. If the public holds currency equal to a share
          cr of deposits, and banks hold reserves equal to a share rr of deposits, the money stock is a fixed
          multiple of the base, the **[money multiplier](term:P4:money_multiplier)** (1 + cr) / (cr + rr)
          (Mankiw, 2019, 4-3).

          In the example economy, cr = 50 / 250 = 0.2 and rr = 25 / 250 = 0.1. [Central bank
          money](term:P4:central_bank_money) is 50 + 25 = 75, the multiplier is (1 + 0.2) / (0.2 + 0.1) = 4, and
          the money stock is 4 × 75 = $300 million.

  - id: s4
    title: "The Central Bank and the Policy Rate"
    objectives: [LO4]
    steps:
      - id: s4a
        sources:
          - {key: mankiw_2019, loc: "4-3"}
          - {key: blanchard_illing_2017, loc: "4.1, 4.2"}
        text: |
          ### Central bank money and bonds

          Only the [central bank](term:P1:central_bank) controls **[central bank
          money](term:P4:central_bank_money)**: the currency held by the public and the
          [reserves](term:P4:reserves) of the banks (Mankiw, 2019, 4-3).

          In the example economy, central bank money is 50 + 25 = $75 million.

          Besides [money](term:P4:money), people can hold **[bonds](term:P4:bond)**. Bonds pay interest but
          cannot be used for payments; money can be used for payments but pays no interest (Blanchard & Illing,
          2017, 4.1).

          Bonds are traded at a price, and that price fixes the interest rate. The more a buyer pays today for a
          given payment in a year, the less the bond yields: bond prices and interest rates move in opposite
          directions (Blanchard & Illing, 2017, 4.2).

          In the example economy, a bond that pays $103 in a year costs $100 when the interest rate is 3%. If
          the rate rises to 4%, the same $103 is worth only 103 / 1.04 = $99.04 today.
      - id: s4b
        sources:
          - {key: blanchard_illing_2017, loc: "4.1, 4.2"}
        text: |
          ### The money market

          The **[demand for money](term:P4:money_demand)** depends on two things. It rises with nominal income,
          since more transactions need more means of payment. And it falls when the interest rate rises, since
          holding money means giving up the interest on bonds (Blanchard & Illing, 2017, 4.1).

          In the example economy, money demand is $Y × (0.5 − i / 18), with nominal income $Y of $900 million
          and the interest rate i in percent. At 3%, people want to hold $300 million.

          With a fixed supply of money, only one interest rate makes people content to hold what is there. This
          is the **[money-market equilibrium](term:P4:money_market_equilibrium)** (Blanchard & Illing, 2017,
          4.2).

          The central bank changes the supply by trading bonds for money, an **[open-market
          operation](term:P4:open_market_operation)**. Its purchases, paid with new money, raise the money stock
          and lower the interest rate; its sales do the opposite (Blanchard & Illing, 2017, 4.2).

          In the example economy, a [money stock](term:P4:money_stock) of $325 million lowers the interest rate
          to 2.5%, where people want to hold 325. Move the money stock in the diagram below.
        module: {kind: money_market, controls: [M]}
      - id: s4c
        sources:
          - {key: blanchard_illing_2017, loc: "4.2, 23.2"}
        text: |
          ### Interest-rate steering

          A central bank that knew the demand for money exactly could steer by the money stock or by the
          interest rate, with the same result. In practice central banks set the interest rate: they announce
          the rate at which they provide money, and the money stock follows from what is demanded at that rate.
          This is **[interest-rate steering](term:P4:interest_rate_steering)**, and the rate they set is the
          **[policy rate](term:P4:policy_rate)**, a short-term [nominal interest
          rate](term:P4:nominal_interest_rate) (Blanchard & Illing, 2017, 4.2).

          The reason is that the demand for money is not stable. Under a fixed money stock, each of its shifts
          would move the interest rate, and output with it. Under a fixed rate, the money stock gives way
          instead (Blanchard & Illing, 2017, 23.2).

          In the example economy, the policy rate is 3%. If the central bank raises it to 4%, people want to
          hold only 900 × (0.5 − 4 / 18) = $250 million. The central bank sells bonds for $12.5 million, and
          with a [money multiplier](term:P4:money_multiplier) of 4 the money stock falls from 300 to 250.
        module: {kind: money_market, controls: [i]}

  - id: s5
    title: "Inflation: Causes and Costs"
    objectives: [LO5]
    steps:
      - id: s5a
        sources:
          - {key: mankiw_2019, loc: "5-1"}
        text: |
          ### The quantity equation

          The oldest account of [inflation](term:P4:inflation_rate) links prices to the quantity of
          [money](term:P4:money). It starts from the **[quantity equation](term:P4:quantity_equation)** (Mankiw,
          2019, 5-1).

          > M × V = P × Y

          M is the [money stock](term:P4:money_stock), P the [price level](term:P4:price_level) and Y real
          output, so P × Y is nominal output. V is the **[velocity of money](term:P4:velocity_of_money)**: how
          often a dollar becomes part of someone's income in a year. The equation is an identity, true by the
          way velocity is defined (Mankiw, 2019, 5-1).

          In the example economy, the money stock is $300 million, the price level in the [base
          year](term:P2:base_year) is 1 and real output is $900 million. Velocity is 900 / 300 = 3.
      - id: s5b
        sources:
          - {key: mankiw_2019, loc: "5-1, 5-6, 10-2"}
        text: |
          ### The quantity theory

          One assumption turns the identity into the **[quantity theory of money](term:P4:quantity_theory)**:
          velocity is constant. A change in the money stock then changes nominal output in proportion. Real
          output is given by the factors of production and by technology, so the growth of the money stock
          determines inflation, which in the end lies with the central bank (Mankiw, 2019, 5-1).

          In the example economy, if the money stock grows by 4% a year and real output by 2%, prices rise by
          about 2% a year.

          The theory describes the [long run](term:P3:long_run). There, a change in the money stock moves prices
          and leaves output and employment as they were, which is called the **[neutrality of
          money](term:P4:neutrality_of_money)**. Over shorter spans, with many prices slow to move, a change in
          the money stock moves [output](term:P1:output_GDP) as well (Mankiw, 2019, 10-2).

          At the extreme stands **[hyperinflation](term:P4:hyperinflation)**, often defined as inflation of more
          than 50 percent a month (Mankiw, 2019, 5-6).
      - id: s5c
        sources:
          - {key: mankiw_2019, loc: "5-5"}
          - {key: blanchard_illing_2017, loc: "23.3"}
        text: |
          ### The costs of inflation

          If all prices and incomes rose together, nobody would be poorer. The costs of inflation are more
          subtle (Mankiw, 2019, 5-5).

          The **[costs of expected inflation](term:P4:costs_of_expected_inflation)** arise even when inflation
          is foreseen. People hold less money and go to the bank more often, the [shoe-leather
          costs](term:P4:shoe_leather_costs). Firms change their posted prices more often, the [menu
          costs](term:P4:menu_costs). Relative prices vary more, and tax rules that ignore inflation distort
          decisions (Mankiw, 2019, 5-5).

          The **[costs of unexpected inflation](term:P4:costs_of_unexpected_inflation)** are different: it
          redistributes wealth. A loan fixes a nominal interest rate, so inflation above what was expected
          favours the debtor at the creditor's expense (Mankiw, 2019, 5-5).

          Zero inflation is not the aim either, and the **[optimal inflation
          rate](term:P4:optimal_inflation_rate)** weighs both sides. Nominal wages are rarely cut, so a little
          inflation helps [real wages](term:P5:real_wage) to fall where they must (Mankiw, 2019, 5-5). And very
          low inflation means low nominal interest rates, which leaves little room to cut them in a deep
          [recession](term:P2:recession) (Blanchard & Illing, 2017, 23.3).

          The central bank of the example economy has an **[inflation target](term:P4:inflation_target)** of 2%
          a year.

  - id: s6
    title: "Nominal and Real Interest Rates"
    objectives: [LO6]
    steps:
      - id: s6a
        sources:
          - {key: blanchard_illing_2017, loc: "6.1"}
          - {key: mankiw_2019, loc: "5-3, 15-1"}
        text: |
          ### The real interest rate

          Lenders and borrowers care about goods, not dollars. The **[real interest
          rate](term:P4:real_interest_rate)**, written r, measures a loan in goods. It is found by taking
          **[expected inflation](term:P4:expected_inflation)** πᵉ out of the **[nominal interest
          rate](term:P4:nominal_interest_rate)**, the rate stated in dollars (Blanchard & Illing, 2017, 6.1).

          > r ≈ i − πᵉ

          This is the **[Fisher equation](term:P4:fisher_equation)**, after Irving Fisher (as cited in Mankiw,
          2019, 5-3). The real rate expected when a loan is agreed is the **[ex
          ante](term:P4:ex_ante_real_rate)** rate; the rate that results from actual inflation is the **[ex
          post](term:P4:ex_post_real_rate)** rate (Mankiw, 2019, 5-3).

          In the example economy, the policy rate is 3% and expected inflation 2%, so the real policy rate is
          1%. If inflation turns out to be 3%, the ex post real rate is 0%.

          One real rate stands out: **[the rate the economy needs](term:P4:rate_economy_needs)**, the real
          interest rate that keeps demand in line with the natural level of output, shocks apart. Economists
          call it the natural rate of interest (Mankiw, 2019, 15-1).

          In the example economy, it is the real policy rate of 1%.
      - id: s6b
        sources:
          - {key: blanchard_illing_2017, loc: "6.2, 6.4"}
        text: |
          ### The risk premium

          Households and firms pay more for a loan than the rate the central bank sets, because loans can go
          unpaid. The extra interest that lenders charge for bearing this is the **[risk
          premium](term:P4:risk_premium)**. It grows with the chance of default and with lenders' dislike of
          risk. When the financial crisis broke out in 2008, the rates at which firms could borrow rose sharply
          (Blanchard & Illing, 2017, 6.2).

          What borrowers actually pay, the real policy rate plus the risk premium, is therefore the rate that
          moves credit and spending (Blanchard & Illing, 2017, 6.4).

          In the example economy, the real policy rate is 1% and firms pay a risk premium of 2%, so the [real
          cost of finance](term:P4:cost_of_finance) is 1 + 2 = 3%. This rate is the hurdle that every investment
          project must clear. The chart below shows the economy's possible projects and the line at 3%.
        module: {kind: project_pool, controls: []}

  - id: s7
    title: "Investment and the Interest Rate"
    objectives: [LO7]
    steps:
      - id: s7a
        sources:
          - {key: mankiw_2019, loc: "2-1, 3-3"}
          - {key: blanchard_illing_2017, loc: "5.1"}
        text: |
          ### Investment projects and their return

          [Investment](term:P2:investment) creates new capital that is used in later production (Mankiw, 2019,
          2-1). Each purchase that a firm considers is an **[investment project](term:P4:investment_project)**,
          and what it is expected to earn in a year, in percent of its cost, is its **[expected rate of
          return](term:P4:expected_rate_of_return)**. A project pays if this return exceeds the cost of the
          funds it ties up (Mankiw, 2019, 3-3). A firm with cash of its own faces the same test, because it
          could lend the money at interest instead of buying the machine (Blanchard & Illing, 2017, 5.1).

          In the example economy, the six firms consider twelve projects, from a second production line for the
          bakery ($40 million, expected return 7.25%) to an office building for the construction firm ($40
          million, 0.75%). At a [real cost of finance](term:P4:cost_of_finance) of 3%, seven projects clear the
          line. Together they cost $200 million. With the $20 million of bread the bakery adds to its stocks,
          investment is $220 million.
        module: {kind: project_pool, controls: []}
      - id: s7b
        sources:
          - {key: mankiw_2019, loc: "3-3, 19-2"}
          - {key: blanchard_illing_2017, loc: "5.1"}
        text: |
          ### The investment demand curve

          When the real interest rate rises, fewer projects are profitable, and investment falls. The
          **[investment demand curve](term:P4:investment_demand_curve)** therefore slopes downward (Mankiw,
          2019, 3-3).

          Two refinements: the **[user cost of capital](term:P4:user_cost_of_capital)** adds the wear and tear
          of a machine to the interest that owning it costs. **[Tobin's q](term:P4:tobins_q)** compares the
          stock-market value of installed capital with what it would cost to replace: when q is above 1,
          investing pays (Mankiw, 2019, 19-2). Investment also depends on firms' sales, which this topic holds
          fixed (Blanchard & Illing, 2017, 5.1).

          In the example economy, investment is $290 million at a cost of finance of 2%, $220 million at 3%,
          $180 million at 4% and $110 million at 5%. Now take the announcement that opens this chapter: the
          policy rate rises from 3% to 4%. The real policy rate rises to 2%, one point above [the rate the
          economy needs](term:P4:rate_economy_needs), and the cost of finance to 4%. Two projects drop out, and
          investment falls from $220 million to $180 million. With [the multiplier of chapter 3](theory:P3-s4a),
          output falls by $100 million.
        module: {kind: project_pool, controls: [i, pi_e, premium]}
