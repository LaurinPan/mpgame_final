# Chapter 2 of the theory section, "Measuring output: GDP". Its texts are written from three textbooks
# (references.yaml) and name the section they rest on at the end of every paragraph. They use the glossary's terms and
# explanations, "government spending" and "the rate the economy needs", and they do not mention a game.
#   chapter  id, title, the learning objectives
#   cards    the term cards: term, core (the explanation; the glossary's own, lower case, where `glossary: true`), example,
#            aliases, see_also (a preview card's full card), box (false: never shown as a box), step (where the text defines it)
#   topics   id, title, objectives, steps: id, sources ({key, loc} into references.yaml), text (Markdown: [label](term:P4:id)
#            marks a term, [label](theory:P2-s1d) links a chapter, topic or step), module (one of the modules of modules.yaml
#            with this step's controls and view), figure (a static figure drawn from economy.yaml)

chapter:
  id: P2
  title: "Measuring output: GDP"
  objectives:
    LO1: "Explain what GDP measures, why it was invented and what it is used for."
    LO2: "Describe the production, expenditure and income approaches and explain why they give the same total."
    LO3: "Distinguish nominal from real GDP and explain what a growth rate of real GDP means."
    LO4: "Explain what GDP fails to measure and why it is nevertheless the central measure of economic activity."

cards:
  GDP_definition: {term: "GDP (gross domestic product)", core: "Gross domestic product: all final goods and services of a year's production in a country, valued at market prices. It measures the economy's output and, equally, the incomes earned from it.", example: "The example economy's GDP is $900 million: bread for $520 million, machines for $200 million and a road for $180 million.", aliases: ["gross domestic product"], step: s1a}
  final_good: {term: "Final good", core: "A good bought by its last user, a household, a firm buying equipment or the government, rather than used up in making another product. Only final goods count in GDP.", example: "Bread bought by a household is a final good; flour bought by the bakery is not.", step: s1b}
  intermediate_good: {term: "Intermediate good", core: "A good that a firm buys and uses up in making its own product within the year. It is not counted in GDP separately, because its value is already part of the final product.", example: "The flour the bakery buys for $250 million is an intermediate good.", step: s1b}
  flow_vs_stock: {term: "Flow vs stock", core: "A flow is measured per period of time, like income per year; a stock is measured at a point in time, like the money in an account today. GDP is a flow.", example: "Output of $900 million a year is a flow; the machines the economy owns today are a stock.", step: s1b}
  value_added: {term: "Value added", core: "What a firm adds to the value of the things it buys from other firms: its sales minus those purchases. Adding up the value added of all firms gives GDP.", example: "The mill buys wheat for $100 million and sells flour for $250 million: it adds $150 million.", step: s1c}
  production_approach: {term: "Production approach", core: "Measuring GDP by adding up the value added of every firm in the economy.", example: "The farm adds $100 million, the mill $150 million, the bakery $270 million and so on: $900 million in total.", step: s1c}
  expenditure_approach: {term: "Expenditure approach", core: "Measuring GDP by adding up what is spent on final goods: households' consumption, firms' investment and government spending.", example: "500 + 220 + 180 = $900 million.", step: s1d}
  consumption: {term: "Consumption (C)", core: "In economics, households' spending on goods and services, from bread to haircuts. Buying a newly built home counts as investment, not consumption.", example: "Households in the example economy spend $500 million on bread.", step: s1d}
  investment: {term: "Investment (I)", core: "In economics, investment is spending on new machines, buildings and stocks of goods that will be used to produce more later. Buying shares or bonds is not investment in this sense: it only changes who owns existing things.", example: "The bakery buys a second production line for $40 million.", step: s1d}
  income_approach: {term: "Income approach", core: "Measuring GDP by adding up the incomes earned in production: wages for workers, and profits, interest and rents for owners.", example: "Wages of $600 million plus profits of $300 million: $900 million.", step: s1d}
  three_approaches: {term: "Three approaches, one number", core: "Production, expenditure and income measure the same flow and therefore give the same GDP.", box: false, step: s1d}
  nominal_GDP: {term: "Nominal GDP", core: "GDP valued at the prices of the same year. It rises when more is produced, but also when the same things simply become dearer.", example: "In the two-good price example, output worth $720 million in year 1 is worth $793 million in year 2, partly because a loaf costs $1.10 instead of $1.00.", step: s2a}
  real_GDP: {term: "Real GDP", core: "GDP valued at the fixed prices of one base year, so that it changes only when the quantities produced change. It shows whether the economy really produces more.", example: "Valued at year-1 prices, output rises only from $720 million to $730 million.", step: s2a}
  growth_rate: {term: "Growth rate", core: "The percentage change of a variable from one period to the next.", box: false, step: s2c}
  GDP_per_capita: {term: "GDP per capita", core: "GDP divided by the population; an average, not the income of a typical person.", box: false, step: s2c}
  non_market_production: {term: "Non-market production", core: "Valuable activity without a market price, such as unpaid care; not in GDP.", box: false, step: s3a}
  shadow_economy: {term: "Shadow economy", core: "Market activity hidden from the authorities; only partly estimated in GDP.", box: false, step: s3a}
  distribution: {term: "Distribution", core: "How income and wealth are shared across households; GDP says nothing about it.", box: false, step: s3b}
  leisure: {term: "Leisure", core: "Time not spent working; it raises well-being but not GDP.", box: false, step: s3b}
  environmental_damage: {term: "Environmental damage", core: "Pollution and resource depletion are not deducted from GDP.", box: false, step: s3b}
  GDP_vs_welfare: {term: "GDP vs welfare", core: "GDP measures market production, not well-being.", box: false, step: s3a}
  reasons_still_used: {term: "Why GDP prevails", core: "It is standardised, timely, comparable, closely related to many dimensions of welfare and the key measure of the business cycle.", box: false, step: s3c}
  business_cycle: {term: "Business cycle", core: "The recurring ups and downs of the economy: years in which output grows fast and jobs are easy to find, followed by slowdowns or recessions.", example: "Output grows by 3% one year and falls by 1% two years later.", step: s1a}
  base_year: {term: "Base year", core: "The year whose prices are used to value the quantities of every year when real GDP is computed.", example: "With year 1 as the base year, a loaf is counted at $1.00 in every year.", step: s2a}
  recession: {term: "Recession", core: "output falls for two quarters in a row", aliases: [recessions], glossary: true, step: s2c}
  economic_growth: {term: "Economic growth", core: "The growth rate of real GDP.", box: false, step: s2c}
  chain_linking: {term: "Chain-linking", core: "Measuring real growth from each year to the next at the prices of those two years, and linking the growth rates into one series, instead of keeping one old base year.", example: "Statistics offices use it so that new products such as computers are valued at up-to-date prices.", aliases: ["chain-linked"], step: s2c}
  labour_income: {term: "Labour income", core: "Wages and salaries paid for work.", box: false, step: s1d}
  capital_income: {term: "Capital income", core: "The income of those who own capital: firms' profits, interest on loans, and rents for land and buildings.", example: "In the example economy, profits are $300 million.", step: s1d}
  wealth: {term: "Wealth", core: "The value of what households own at a point in time, minus their debts: a stock, not a flow.", box: false, step: s3b}
  government_spending: {term: "Government spending (G)", core: "what the government buys", example: "The government buys a road for $180 million. Pensions and other transfers do not count, because the government receives nothing in return.", glossary: true, step: s1d}

topics:

  - id: s1
    title: "GDP"
    objectives: [LO1, LO2]
    steps:
      - id: s1a
        sources:
          - {key: mankiw_2019, loc: "1-1, 2-1"}
          - {key: legge_2023, loc: "1.5"}
        text: |
          ### What GDP is, and why it was invented

          **[Gross domestic product](term:P2:GDP_definition) (GDP)** adds up, at market prices, every final good
          and service that an economy produces in a given period. It is the measure behind the word
          "[output](term:P1:output_GDP)" in these chapters (Mankiw, 2019, 2-1).

          The measure is young. It was developed in the 1930s and 1940s, when the slump after 1929 and then the
          Second World War made governments want regular figures on the state of their economies. Simon Kuznets
          and Colin Clark laid its foundations, and Richard Stone and James Meade built the first modern set of
          national accounts (Legge, 2023, 1.5).

          GDP allows the economic activity of a country to be compared over time and with that of other
          countries (Legge, 2023, 1.5). Its rises and falls trace the **[business
          cycle](term:P2:business_cycle)**: real GDP grows in most years, but not steadily, and a period in
          which it falls is called a [recession](term:P2:recession) (Mankiw, 2019, 1-1).
      - id: s1b
        sources:
          - {key: mankiw_2019, loc: "2-1"}
          - {key: blanchard_illing_2017, loc: "2.1"}
          - {key: legge_2023, loc: "1.5"}
        text: |
          ### Final goods, market value and the period

          GDP adds up market values, because prices are the common measure for bread, haircuts and machines.
          Services without a market price, such as those of the police, are counted at their cost, the wages of
          the people who provide them (Mankiw, 2019, 2-1).

          GDP counts only **[final goods](term:P2:final_good)** and services. **[Intermediate
          goods](term:P2:intermediate_good)**, which a firm buys to make its own product, are left out: their
          value is already in the price of the final good, and adding them would count them twice (Mankiw, 2019,
          2-1). The same good can be either. Flour that a household buys to bake at home is a final good; flour
          that a bakery buys is an intermediate one (Blanchard & Illing, 2017, 2.1).

          GDP measures current production. A second-hand sale adds nothing, while goods produced but not yet
          sold count, as an addition to inventories (Mankiw, 2019, 2-1).

          GDP is a **[flow](term:P2:flow_vs_stock)**, a quantity per period. A stock is measured at one moment
          instead: income is a flow, wealth is a stock (Mankiw, 2019, 2-1; Legge, 2023, 1.5).
      - id: s1c
        sources:
          - {key: blanchard_illing_2017, loc: "2.1"}
          - {key: legge_2023, loc: "1.5.1"}
          - {key: mankiw_2019, loc: "2-1"}
        text: |
          ### Three ways to measure GDP: production

          GDP can be measured in three ways that give the same total: from production, from incomes and from
          spending (Blanchard & Illing, 2017, 2.1; Legge, 2023, 1.5.1).

          The **[production approach](term:P2:production_approach)** adds up the **[value
          added](term:P2:value_added)** of all firms: what a firm's output is worth, less what it paid for
          intermediate goods. Summed over all firms, value added comes to exactly what the economy's final goods
          and services are worth (Mankiw, 2019, 2-1).

          In the example economy, a farm grows wheat worth $100 million and sells it to a mill. The mill grinds
          it into flour worth $250 million and so adds $150 million. A bakery bakes bread worth $520 million
          from the flour and adds $270 million. The value added along the chain, 100 + 150 + 270, is $520
          million, exactly the value of the bread. Adding up the sales instead would count the wheat three times
          and the flour twice.
        figure: {kind: stacked_bar, description: "The $520 million of bread split into the value added by the farm, the mill and the bakery."}
      - id: s1d
        sources:
          - {key: mankiw_2019, loc: "2-1"}
          - {key: blanchard_illing_2017, loc: "2.1, 3.2"}
        text: |
          ### Three ways to measure GDP: expenditure and income

          The **[expenditure approach](term:P2:expenditure_approach)** adds up spending on final goods.
          **[Consumption](term:P2:consumption) (C)** is what households spend on goods and services.
          **[Investment](term:P2:investment) (I)** is spending on new machines, buildings and inventories;
          buying shares only passes existing assets to a new owner. **[Government
          spending](term:P2:government_spending) (G)** is what the government buys. Transfers such as pensions
          are left out, because nothing is produced in return (Mankiw, 2019, 2-1). In a [closed
          economy](term:P1:closed_economy), Y = C + I + G (Blanchard & Illing, 2017, 3.2).

          The **[income approach](term:P2:income_approach)** adds up the incomes earned in production: **[labour
          income](term:P2:labour_income)**, wages and salaries, and **[capital
          income](term:P2:capital_income)**, which goes to the owners of firms and of their capital (Blanchard &
          Illing, 2017, 2.1).

          In the example economy, households consume $500 million, firms invest $220 million and the government
          buys a road for $180 million. Wages are $600 million and profits $300 million. All [three
          approaches](term:P2:three_approaches) give $900 million.

          They must agree: in the [circular flow](term:P1:circular_flow), what is spent on final goods is
          received by producers and paid out as income (Mankiw, 2019, 2-1).
        figure: {kind: three_bars, description: "Three bars of $900 million: value added by firm; C, I and G; wages and profits."}

  - id: s2
    title: "Nominal and real GDP"
    objectives: [LO3]
    steps:
      - id: s2a
        sources:
          - {key: blanchard_illing_2017, loc: "2.1"}
          - {key: mankiw_2019, loc: "2-1"}
        text: |
          ### Quantities and prices

          [GDP](term:P2:GDP_definition) can rise for two reasons: more is produced, or the same things have
          become dearer. **[Nominal GDP](term:P2:nominal_GDP)** values the [output](term:P1:output_GDP) of each
          year at the prices of that year, so it reflects both (Blanchard & Illing, 2017, 2.1; Mankiw, 2019,
          2-1).

          **[Real GDP](term:P2:real_GDP)** values the output of each year at the constant prices of one **[base
          year](term:P2:base_year)**. With prices held fixed, it changes only when quantities change, which
          makes it the better measure of what an economy produces (Mankiw, 2019, 2-1).
      - id: s2b
        sources: []
        text: |
          ### An example

          Suppose the example economy's bakery bakes 520 million loaves in year 1 and 530 million in year 2,
          while the price of a loaf rises from $1.00 to $1.10; the 20 machines built each year rise in price
          from $10 million to $10.5 million each. Valued at each year's own prices, output rises from $720
          million to $793 million. Valued at year-1 prices, it rises only to $730 million. Switch between the
          two ways of valuing output below.
        module: {kind: price_toggle}
      - id: s2c
        sources:
          - {key: legge_2023, loc: "1.5, 1.5.3"}
          - {key: blanchard_illing_2017, loc: "2.1, 10.1"}
          - {key: mankiw_2019, loc: "2-1"}
        text: |
          ### Growth rates

          The **[growth rate](term:P2:growth_rate)** of a variable is its change in percent of its earlier value
          (Legge, 2023, 1.5.3).

          In the example economy, nominal output grew by (793 − 720) / 720 ≈ 10.1%, but real output by only (730
          − 720) / 720 ≈ 1.4%. The rest was higher prices.

          **[Economic growth](term:P2:economic_growth)** means the growth rate of real GDP. When GDP falls for
          two quarters in a row, the economy is in a **[recession](term:P2:recession)** (Legge, 2023, 1.5).
          Living standards are compared with **[GDP per capita](term:P2:GDP_per_capita)**, GDP divided by the
          population (Blanchard & Illing, 2017, 10.1).

          Prices of a distant base year go out of date. Statistics offices therefore use
          **[chain-linking](term:P2:chain_linking)**: growth from one year to the next is measured at recent
          prices, and the yearly rates are linked into one series (Mankiw, 2019, 2-1; Blanchard & Illing, 2017,
          2.1).

          The ratio of nominal to real GDP is a price index, the GDP deflator. [Chapter 4](theory:P4-s1a) uses
          it to measure [inflation](term:P4:inflation_rate) (Mankiw, 2019, 2-1).
        figure: {kind: line, description: "Nominal and real output over three years; the nominal line rises faster."}

  - id: s3
    title: "Limits of GDP"
    objectives: [LO4]
    steps:
      - id: s3a
        sources:
          - {key: legge_2023, loc: "1.5"}
          - {key: mankiw_2019, loc: "2-1"}
        text: |
          ### Production is not well-being

          [GDP](term:P2:GDP_definition) measures production that is sold on markets. It is [not a measure of how
          well people live](term:P2:GDP_vs_welfare), a point that Simon Kuznets made about national income early
          on (as cited in Legge, 2023, 1.5).

          **[Non-market production](term:P2:non_market_production).** Work done at home without pay, such as
          cooking or caring for children, has no market price and is left out. GDP can therefore change although
          nothing real has changed. Economists tell of the widower who marries his housekeeper and stops paying
          her a wage: GDP falls, although she does the same work as before (Legge, 2023, 1.5; Mankiw, 2019,
          2-1).

          **The [shadow economy](term:P2:shadow_economy).** Activity that people hide from the authorities, to
          avoid taxes or because it is illegal, is hard to measure, and its size differs widely from country to
          country (Mankiw, 2019, 2-1). In 2014, several European countries began to count estimates for
          prostitution and the illegal drug trade, which raised their measured GDP (Legge, 2023, 1.5, p. 35).
      - id: s3b
        sources:
          - {key: legge_2023, loc: "1.5"}
          - {key: mankiw_2019, loc: "2-1"}
          - {key: blanchard_illing_2017, loc: "2.1"}
        text: |
          ### Distribution, leisure and the environment

          **[Distribution](term:P2:distribution).** GDP per capita is an average, and an average hides how
          income is shared: it can be high while much of the population is poor, if a few receive most of it
          (Legge, 2023, 1.5, p. 34). GDP is also a flow of income. **[Wealth](term:P2:wealth)**, what households
          own at a point in time, is a stock and a different thing (Mankiw, 2019, 2-1).

          **[Leisure](term:P2:leisure).** GDP takes no account of free time, although people value it. Part of
          the lower GDP per capita of European countries, compared with the United States, reflects a stronger
          preference for leisure (Blanchard & Illing, 2017, 2.1, p. 57).

          **[The environment](term:P2:environmental_damage).** Nobody pays for fresh air or a clean river, so
          their loss leaves GDP untouched. The environment is a stock, and GDP records a flow (Legge, 2023, 1.5,
          p. 36).
      - id: s3c
        sources:
          - {key: legge_2023, loc: "1.5"}
          - {key: mankiw_2019, loc: "2-1, 15-1"}
        text: |
          ### Why GDP nevertheless prevails

          GDP remains the central measure of economic activity, for [several
          reasons](term:P2:reasons_still_used). Countries compute it by common international rules, which makes
          their figures comparable. It also goes together with many indicators of welfare: a higher GDP per
          capita tends to mean better material living conditions (Legge, 2023, 1.5). And as long as its flaws
          stay about the same from year to year, it serves well for comparing economic activity over time
          (Mankiw, 2019, 2-1).

          For monetary policy, GDP matters as the measure of the [business cycle](term:P2:business_cycle): the
          state of the cycle is read from how far output is from its natural level, which [chapter
          6](theory:P6-s2b) calls [potential output](term:P6:potential_output) (Mankiw, 2019, 15-1).

          GDP is best taken for what it measures. Diane Coyle saw no obvious single candidate to replace it (as
          cited in Legge, 2023, 1.5). A picture of how people live needs further indicators beside GDP per
          capita (Legge, 2023, 1.5).
