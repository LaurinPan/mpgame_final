# 02_Game/content/theory/P3.yaml — chapter 3 of the theory section, "The goods market in the short run" (scripts appendix §14),
# its texts written as the scripts appendix §8 asks (the glossary's terms and explanations, "government spending", "the rate
# the economy needs", no mention of a game). Read by 02_Game/ui/theory.R.
#   chapter  id, title, the learning objectives
#   cards    the term cards: term, core (the explanation; the glossary's own, lower case, where `glossary: true`), example,
#            aliases, see_also (a preview card's full card), box (false: never shown as a box), step (where the text defines it)
#   topics   id, title, objectives, steps: id, sources ({key, loc} into references.yaml), text (Markdown: [label](term:P4:id)
#            marks a term, [label](theory:P2-s1d) links a chapter, topic or step), details (a More Detail panel), module (one of
#            the ten modules of modules.yaml with this step's controls and view), figure (a static figure drawn from economy.yaml)

chapter:
  id: P3
  title: "The goods market in the short run"
  objectives:
    LO1: "Explain the short, medium and long run and why demand determines output in the short run."
    LO2: "Describe the demand for goods and the consumption function, with autonomous consumption, the marginal propensity to consume and disposable income."
    LO3: "Explain equilibrium output, read the Keynesian cross, explain how inventories drive the adjustment and why saving equals investment in equilibrium."
    LO4: "Explain the multiplier and how changes in government spending, taxes and autonomous consumption change output."

cards:
  short_run: {term: "Short run", core: "A period of a few years in which most prices and wages have not yet adjusted, so output follows demand: when people buy more, firms produce more.", example: "If households suddenly buy less bread, the bakery first bakes less, before it cuts its prices.", step: s1a}
  medium_run: {term: "Medium run", core: "A period of about a decade in which prices and wages have had time to adjust, so output returns to the level that workers and firms' capacity allow.", example: "After a slump, wages and prices adjust over several years, and output returns to its normal level.", step: s1a}
  long_run: {term: "Long run", core: "A period of several decades in which output depends on how much capital, labour and technology the economy has, not on demand.", example: "Over thirty years, better machines and more workers raise output far more than any change in demand.", step: s1a}
  price_stickiness: {term: "Price stickiness", core: "Many prices and wages change only now and then, not every day, so they react slowly when demand changes.", example: "A café reprints its menu once a year; a wage is agreed for a year at a time.", step: s1b}
  demand_determined_output: {term: "Demand-determined output", core: "In the short run, firms produce what customers buy at the current prices, as long as they have spare capacity: demand decides how much is produced.", example: "If households buy $10 million more bread, the bakery bakes $10 million more.", aliases: ["demand-determined"], step: s1b}
  demand_for_goods: {term: "Demand for goods (Z)", core: "Everything spent on an economy's goods and services in a year: households' consumption, firms' investment and government spending together.", example: "500 + 220 + 180 = $900 million.", step: s2a}
  exogenous_spending: {term: "Exogenous spending", core: "Spending that the model of the goods market takes as given instead of explaining it: firms' investment and government spending, together with the taxes the government collects.", example: "Investment of $220 million stays fixed, whatever output is.", step: s2a}
  taxes: {term: "Taxes (T)", core: "Taxes paid by households to the government, net of transfers received.", box: false, step: s2a}
  consumption_function: {term: "Consumption function", core: "The rule that describes how households' spending depends on their income after taxes: a basic amount they spend anyway, plus part of every extra dollar they receive.", example: "Households spend $68 million plus 60 cents of each dollar of disposable income: $500 million in total.", step: s2b}
  autonomous_consumption: {term: "Autonomous consumption (c₀)", core: "The part of household spending that does not depend on this year's income: people buy necessities anyway, out of savings or by borrowing.", example: "$68 million in the example economy.", step: s2b}
  marginal_propensity_to_consume: {term: "Marginal propensity to consume (c₁)", core: "The part of each extra dollar of income after taxes that households spend; the rest they save.", example: "With 0.6, a household that receives $100 more spends $60 more and saves $40.", step: s2b}
  disposable_income: {term: "Disposable income (YD)", core: "What households can actually spend or save: their income minus the taxes they pay, plus transfers such as pensions.", example: "Income of $900 million minus net taxes of $180 million: $720 million.", step: s2b}
  equilibrium_condition: {term: "Equilibrium condition", core: "Firms produce exactly as much as people buy, so that no unsold goods pile up and no shelves are emptied: production equals demand.", example: "At $900 million, everything produced is bought.", step: s3a}
  autonomous_spending: {term: "Autonomous spending", core: "All spending that does not depend on this year's income: the basic part of consumption, investment and government spending, less the consumption that taxes take away.", example: "$360 million in the example economy; through the multiplier it supports output of $900 million.", step: s3a}
  keynesian_cross: {term: "Keynesian cross", core: "A diagram with output along one axis and demand along the other: one line shows how much people want to buy at each level of output, a second line where the two are equal. They cross at equilibrium.", example: "The lines cross at $900 million.", step: s3b}
  unplanned_inventory_change: {term: "Unplanned inventory change", core: "Goods that firms produce but cannot sell, or extra goods they must sell from their stores, beyond what they planned. It tells firms to produce less, or more.", example: "Firms produce $950 million but sell only $930 million: $20 million of goods pile up unsold.", step: s3c}
  private_saving: {term: "Private saving (S)", core: "The part of households' income after taxes that they do not spend: it goes into bank accounts and other savings.", example: "$720 million of disposable income minus $500 million of consumption: $220 million.", step: s3d}
  public_saving: {term: "Public saving", core: "What the government saves: its tax revenue minus its spending. It is negative when the government spends more than it collects and must borrow.", example: "Taxes of $180 million minus government spending of $180 million: zero, a balanced budget.", step: s3d}
  saving_investment_identity: {term: "Saving equals investment", core: "In a closed economy, what households and the government save is exactly what firms invest: money not spent on consumption flows, through banks, into new machines and buildings.", example: "Private saving of $220 million finances investment of $220 million.", step: s3d}
  multiplier: {term: "Multiplier", core: "Why one extra dollar of spending raises total output by more than a dollar: the dollar becomes someone's income, who spends part of it, which becomes another person's income, and so on.", example: "The government pays $10 million for road repairs. The workers spend $6 million in shops, whose staff spend $3.6 million, and so on: output rises by $25 million.", step: s4a}
  multiplier_rounds: {term: "Multiplier rounds", core: "The steps by which extra spending spreads through the economy: each income received is partly spent and becomes the next person's income, and each round is smaller than the one before.", example: "$10 million, then $6 million, then $3.6 million, then $2.16 million: together $25 million.", step: s4b}
  tax_multiplier: {term: "Tax multiplier", core: "How much output falls when taxes rise by one dollar: households lose income and cut their spending by part of it, and that cut spreads through the economy like any other change in spending.", example: "Taxes rise by $10 million; households spend $6 million less, and in the end output falls by $15 million.", step: s4c}
  trend: {term: "Trend", core: "the path along which output grows over time, 2 percent a year", glossary: true, step: s1a}
  demand_shock: {term: "Demand shock", core: "a change in how much households and firms want to spend that does not come from the policy rate", example: "Households become more cautious and cut autonomous consumption by $10 million: output falls by $25 million.", aliases: ["demand shocks"], glossary: true, step: s4c}

topics:

  - id: s1
    title: "The Economy in the Short, Medium and Long Run"
    objectives: [LO1]
    steps:
      - id: s1a
        sources:
          - {key: blanchard_illing_2021, loc: "2.5"}
          - {key: legge_2023, loc: "2.2"}
          - {key: mankiw_2025, loc: "ch. 12"}
        text: |
          ### Three time horizons

          [Output](term:P1:output_GDP) is measured as [GDP](term:P2:GDP_definition), the value of the [final
          goods](term:P2:final_good) and services an economy produces in a year ([introduced in chapter
          2](theory:P2-s1a)). The chapters that follow ask what determines it, and the answer depends on the time
          horizon. Macroeconomists distinguish three horizons, each with its own explanation of output (Blanchard &
          Illing, 2021, ch. 2; Legge, 2023, 2.2).

          In the **[short run](term:P3:short_run)**, a period of a few years, output moves up and down with demand. When
          households, firms and the government spend more, firms sell more and produce more; when spending falls,
          production falls, and the economy may slide into a [recession](term:P2:recession). This chapter is about the
          short run.

          In the **[medium run](term:P3:medium_run)**, roughly a decade, the economy tends to return to a normal level
          of output, the level that the labour market and firms' production capacity allow. What this level is, and how
          wages and prices respond when output is above or below it, is the subject of [chapter 5](theory:P5-s4b); how a
          change in the [central bank](term:P1:central_bank)'s [policy rate](term:P4:policy_rate) moves demand, and with
          it output, is the subject of [chapter 4](theory:P4-s7b).

          In the **[long run](term:P3:long_run)**, several decades or more, the question is no longer whether output is
          above or below its normal level, but why that level grows. The answer lies in the accumulation of capital, the
          growth of the [labour force](term:P5:labour_force) and [technological
          progress](term:P6:technological_progress), the subject of [chapter 6](theory:P6-s4c).

          The three horizons are not three different economies. They are three views of the same economy, each
          emphasising the forces that matter most over that period. The chart below shows an output path that fluctuates
          around a rising [trend](term:P3:trend): the fluctuations are the business of the short run, the return to the
          trend the business of the medium run, and the slope of the trend the business of the long run.
        figure: {kind: horizons, description: "A fictional output path fluctuating around a rising trend, with the short, medium and long run marked."}
      - id: s1b
        sources:
          - {key: mankiw_2025, loc: "ch. 12"}
          - {key: blanchard_illing_2021, loc: "2.5"}
        text: |
          ### Why demand determines output in the short run

          Why should demand determine output? In a market for a single good, a fall in demand lowers the price, and the
          lower price brings demand and supply back into balance. If all prices and wages adjusted this quickly, a fall
          in total spending would lower prices instead of output, and the economy would hardly fluctuate.

          In practice, most prices and wages change only at intervals. Firms review their prices once or a few times a
          year, print catalogues and menus, and fear that frequent changes will annoy their customers; wages are fixed
          in contracts for a year or longer. This **[price stickiness](term:P3:price_stickiness)** means that, for some
          time, prices are close to given. When demand falls, firms first sell less, not more cheaply.

          In the short run, therefore, [macroeconomics](term:P1:macroeconomics) assumes that firms produce whatever is
          demanded at the prevailing prices, as long as they have spare capacity: output is
          **[demand-determined](term:P3:demand_determined_output)**. This is the central assumption of this chapter, and
          the models below hold the [price level](term:P4:price_level) fixed. It is a short-run assumption. Over the
          medium run, prices and wages do adjust: [chapter 5](theory:P5-s7b) shows how they respond when output is away
          from its normal level, and [chapter 4](theory:P4-s1) introduces prices and [inflation](term:P4:inflation_rate)
          in their own right.
        details:
          title: "How sticky are prices? Evidence from firms and from price data"
          sources:
            - {key: blinder_etal_1998}
            - {key: nakamura_steinsson_2008}
          text: |
            [Price stickiness](term:P3:price_stickiness) is an assumption of the short-run model, but it is also an
            empirical claim that economists have tested in two ways.

            The first is to ask the price setters. Alan Blinder and his co-authors interviewed about two hundred heads of
            firms and price managers in the United States and asked them how often they change prices and which of twelve
            prominent theories of price stickiness described their own behaviour (Blinder et al., 1998). The typical firm
            reported changing the price of its main product only about once a year. The explanations that firms recognised
            most often were not the cost of changing price tags but coordination problems: many firms said they would not
            raise or cut a price until their competitors did, and many priced on the basis of costs, which themselves
            change only slowly. Contracts with customers, explicit or implicit, were also important.

            The second is to look at the prices themselves. Using the individual price records collected for the US
            [consumer price index](term:P4:consumer_price_index), Emi Nakamura and Jón Steinsson (2008) showed that many
            price changes are temporary sales, after which the price returns to its old level. Leaving sales aside, the
            regular price of a typical consumer good changes only about once a year, with large differences between
            sectors: the prices of goods such as fuel change very often, those of many services much more rarely. They
            used these facts to assess "menu cost" models, in which each price change has a small fixed cost.

            Both approaches lead to the same conclusion: in the [short run](term:P3:short_run), many prices do not respond
            to changes in demand, which is why demand affects production. How long "short" lasts is one of the central
            questions of [chapter 5](theory:P5-s7c).

  - id: s2
    title: "The Demand Side of the Economy"
    objectives: [LO2]
    steps:
      - id: s2a
        sources:
          - {key: blanchard_illing_2021, loc: "3.2"}
          - {key: legge_2023, loc: "2.3"}
          - {key: mankiw_2025, loc: "ch. 4 and 13"}
        text: |
          ### The components of demand

          [GDP](term:P2:GDP_definition) can be measured by the [expenditure approach](term:P2:expenditure_approach) as
          the sum of [consumption](term:P2:consumption), [investment](term:P2:investment) and [government
          spending](term:P2:government_spending) ([introduced in chapter 2](theory:P2-s1d)). The same three components
          describe who **demands** the economy's goods. Economists write the total **[demand for
          goods](term:P3:demand_for_goods)** as Z:

          > Z = C + I + G

          The equation looks like the GDP identity Y = C + I + G, but it says something different. The identity holds by
          definition for what was actually produced and bought. The demand equation describes what households, firms and
          the government *want* to buy, given their income and plans. Whether the economy produces exactly that amount
          is a separate question, answered in the next topic.

          To explain demand, the model must say what each component depends on. A model cannot explain everything at
          once ([economic models, chapter 1](theory:P1-s1b)), so this chapter takes two components as given, as
          **[exogenous spending](term:P3:exogenous_spending)**. Investment I is fixed: firms' decisions to buy new
          machines and buildings depend on interest rates and expectations, which [chapter 4](theory:P4-s7) adds.
          Government spending G is fixed too, set by parliament in the budget. The government also collects
          **[taxes](term:P3:taxes)** T, which in this chapter mean all taxes paid by households minus the transfers they
          receive, such as pensions. Government spending and taxes together are fiscal policy.

          In the example economy ([its accounts in chapter 2](theory:P2-s1d)), firms invest $220 million a year and the
          government buys goods and services for $180 million. The government also collects $180 million in taxes, so
          its budget is balanced.
      - id: s2b
        sources:
          - {key: blanchard_illing_2021, loc: "3.2"}
          - {key: mankiw_2025, loc: "ch. 4"}
          - {key: keynes_1936, loc: "ch. 8"}
        text: |
          ### The consumption function

          Consumption is the largest component of demand, and the only one this chapter explains. What households spend
          depends above all on the income they have available. That is not their total income Y, but their **[disposable
          income](term:P3:disposable_income)**, income after taxes:

          > YD = Y − T

          The simplest description of how consumption depends on disposable income is a straight line, the
          **[consumption function](term:P3:consumption_function)**:

          > C = c₀ + c₁ × YD = c₀ + c₁ × (Y − T)

          The two parameters have an economic meaning. The **[marginal propensity to
          consume](term:P3:marginal_propensity_to_consume)**, c₁, is the share of an additional dollar of disposable
          income that households spend. It lies between 0 and 1: when their income rises by one dollar, households spend
          part of it and save the rest. **[Autonomous consumption](term:P3:autonomous_consumption)**, c₀, is the part of
          consumption that does not depend on current income. It captures everything else that affects spending, such as
          households' wealth or their confidence about the future. When households become more pessimistic and decide to
          spend less at any level of income, c₀ falls.

          In the example economy, c₁ = 0.6 and c₀ = $68 million. With an income of $900 million and taxes of $180
          million, disposable income is $720 million, and consumption is 68 + 0.6 × 720 = $500 million, the figure the
          national accounts of the example economy record ([chapter 2](theory:P2-s1d)).

          The consumption function is a simplification. Households also look ahead: their spending depends on the income
          they expect in the future, on their wealth and on interest rates. These influences are summarised here in c₀
          and held fixed. The idea that consumption rises with income, but by less than income, goes back to Keynes
          (1936), who called it a "fundamental psychological law".

  - id: s3
    title: "Equilibrium in the Goods Market"
    objectives: [LO3]
    steps:
      - id: s3a
        sources:
          - {key: blanchard_illing_2021, loc: "3.3"}
          - {key: legge_2023, loc: "2.4"}
          - {key: mankiw_2025, loc: "ch. 13"}
        text: |
          ### The equilibrium condition

          Because [output](term:P1:output_GDP) is [demand-determined](term:P3:demand_determined_output) in the [short
          run](term:P3:short_run), the goods market is in equilibrium when production equals demand. This is the
          **[equilibrium condition](term:P3:equilibrium_condition)**:

          > Y = Z

          Replacing Z by its components gives Y = c₀ + c₁(Y − T) + I + G. Output appears on both sides, because output
          creates income and income drives [consumption](term:P2:consumption), which is part of demand. This circle is
          what makes income [endogenous](term:P1:endogenous): in a model of a single household's spending ([economic
          models, chapter 1](theory:P1-s1b)), income is given from outside; here it is determined by the model. Solving
          the equation for Y gives equilibrium output:

          > Y = 1/(1 − c₁) × (c₀ + I + G − c₁T)

          The expression in brackets is **[autonomous spending](term:P3:autonomous_spending)**: the part of demand that
          does not depend on output. The factor in front, 1/(1 − c₁), is the [multiplier](term:P3:multiplier), the
          subject of the last topic.

          In the example economy, autonomous spending is 68 + 220 + 180 − 0.6 × 180 = $360 million, and the factor is
          1/(1 − 0.6) = 2.5. Equilibrium output is 2.5 × 360 = $900 million, the [GDP](term:P2:GDP_definition) of the
          example economy ([chapter 2](theory:P2-s1d)). The model reproduces the data it was calibrated to; its use lies
          in showing what happens when one of the [exogenous variables](term:P1:exogenous) changes.
      - id: s3b
        sources:
          - {key: mankiw_2025, loc: "ch. 13"}
          - {key: blanchard_illing_2021, loc: "3.3"}
        text: |
          ### The Keynesian cross

          The same equilibrium can be shown in a diagram, which Mankiw (2025, ch. 13) calls the **[Keynesian
          cross](term:P3:keynesian_cross)**. Output is on the horizontal axis and demand on the vertical axis. The
          demand line ZZ shows how demand rises with output: it starts at autonomous spending, and its slope is c₁,
          because each extra dollar of output raises consumption by c₁ dollars. The second line has a slope of one, the
          45-degree line, on which output and demand are equal. Equilibrium output is where the two lines cross.

          Because c₁ is smaller than one, the demand line is flatter than the 45-degree line, and the two lines cross
          exactly once. To the left of the crossing, demand exceeds output; to the right, output exceeds demand. In the
          diagram below, the crossing lies at $900 million.
        module: {kind: keynesian_cross, controls: [], show: [Z, "Y"]}
      - id: s3c
        sources:
          - {key: mankiw_2025, loc: "ch. 13"}
        text: |
          ### How output adjusts: inventories

          Why should output actually end up where demand and production are equal? The answer lies in firms'
          inventories. The national accounts count the change in inventories as part of [investment](term:P2:investment)
          ([introduced in chapter 2](theory:P2-s1d)): in the example economy, the $20 million of bread the bakery adds
          to its stocks is investment. That change was planned. If firms produce more than is demanded, they also
          accumulate goods they did not plan to keep: an **[unplanned inventory
          change](term:P3:unplanned_inventory_change)** (Mankiw, 2025, ch. 13).

          Suppose firms in the example economy produce $950 million. Income is then $950 million, [disposable
          income](term:P3:disposable_income) $770 million and consumption 68 + 0.6 × 770 = $530 million, so demand is
          530 + 220 + 180 = $930 million. Firms sell $20 million less than they produce, and unsold goods pile up in
          their warehouses. Firms respond by cutting production. If instead they produce $850 million, demand is $870
          million, inventories fall by $20 million, and firms raise production. Only at $900 million do firms sell
          exactly what they produce and have no reason to change it.

          The GDP identity ([chapter 2](theory:P2-s1d)) still holds in every case, because statistics count unplanned
          inventory changes as investment. Equilibrium is the special case in which this unplanned part is zero, so that
          actual investment equals planned investment.
        details:
          title: "Supply creates its own demand? Say's law and Keynes"
          sources:
            - {key: say_1803}
            - {key: screpanti_zamagni_2005}
            - {key: keynes_1936, loc: "ch. 2–3"}
          text: |
            The idea that demand can fall short of production was not obvious to the classical economists. In his Traité
            d'économie politique (1803), the French economist Jean-Baptiste Say argued that producing a good creates the
            income needed to buy other goods: products are ultimately paid for with products, and [money](term:P4:money)
            is only an intermediary. A particular good can be overproduced, but a general glut of all goods at once is
            impossible. Most classical economists, including David Ricardo, accepted this view, while Thomas Malthus
            disputed it in a long exchange with Ricardo (Screpanti & Zamagni, 2005).

            Keynes (1936, ch. 2–3) summarised the classical position in the phrase "supply creates its own demand", a
            formulation of his, not of Say, and made its rejection the starting point of the General Theory. Income that
            is earned in production is not necessarily spent: part of it is saved, and nothing guarantees that firms want
            to invest exactly the amount households want to save. If they invest less, total demand falls short of
            production, firms cut [output](term:P1:output_GDP) and employment, and the economy can remain in this state
            for a long time. Keynes called the level of spending that actually determines output "effective demand".

            Modern [macroeconomics](term:P1:macroeconomics) reconciles the two views through the time horizons of the
            first topic. In the [short run](term:P3:short_run), with sticky prices, output is determined by demand, as in
            this chapter. In the medium and [long run](term:P3:long_run), when prices have adjusted, output is determined
            by what the economy can produce, which is close to the classical view and the subject of [chapter
            5](theory:P5-s4b) and [chapter 6](theory:P6-s2a).
      - id: s3d
        sources:
          - {key: blanchard_illing_2021, loc: "3.4"}
        text: |
          ### Saving equals investment

          The equilibrium condition can be stated in a second way, which looks at what households do not spend
          (Blanchard & Illing, 2021, 3.4). **[Private saving](term:P3:private_saving)** S is disposable income that
          households do not consume: S = YD − C. **[Public saving](term:P3:public_saving)** is what the government
          collects in taxes and does not spend: T − G. It is negative when the government runs a deficit.

          Starting from Y = C + I + G, subtract taxes and consumption on both sides: Y − T − C = I + G − T. The left
          side is private saving, so S = I + G − T, or

          > I = S + (T − G)

          In equilibrium, investment equals the sum of private and public saving. The two ways of describing equilibrium
          are equivalent: production equals demand exactly when the spending that firms plan on new capital equals the
          income that households and the government do not spend. The second view shows the [circular
          flow](term:P1:circular_flow) of the economy ([introduced in chapter 1](theory:P1-s3b)) from another angle:
          [money](term:P4:money) that households save leaves the flow of spending, and in equilibrium it returns as
          investment.

          In the example economy, private saving is 720 − 500 = $220 million and public saving is 180 − 180 = 0, so
          total [saving equals investment](term:P3:saving_investment_identity) of $220 million. From now on, the diagram
          also shows private saving.
        module: {kind: keynesian_cross, controls: [], show: [Z, "Y", S]}

  - id: s4
    title: "The Multiplier"
    objectives: [LO4]
    steps:
      - id: s4a
        sources:
          - {key: blanchard_illing_2021, loc: "3.3"}
          - {key: legge_2023, loc: "2.5"}
          - {key: mankiw_2025, loc: "ch. 13"}
        text: |
          ### The multiplier

          The model's main lesson concerns changes. Suppose the government raises its spending by $10 million, for
          example to repair roads. [Autonomous spending](term:P3:autonomous_spending) rises by $10 million, and
          equilibrium [output](term:P1:output_GDP) rises by 2.5 times as much, by $25 million, to $925 million. The
          factor

          > multiplier = 1/(1 − c₁)

          is called the **[multiplier](term:P3:multiplier)**: it states by how much equilibrium output changes when
          autonomous spending changes by one dollar. The same factor applies to a change in
          [investment](term:P2:investment) or in [autonomous consumption](term:P3:autonomous_consumption).

          The multiplier depends on the [marginal propensity to consume](term:P3:marginal_propensity_to_consume). The
          more of each extra dollar households spend, the steeper the demand line and the larger the multiplier: with c₁
          = 0.5 it is 2, with c₁ = 0.8 it is 5. In the diagram below, raise G and watch the demand line shift up and the
          crossing move right by 2.5 times the shift; then change c₁ and watch the demand line turn.
        module: {kind: keynesian_cross, controls: [G, c1], show: [Z, "Y", S]}
      - id: s4b
        sources:
          - {key: blanchard_illing_2021, loc: "3.3"}
        text: |
          ### The multiplier rounds

          Why is the effect larger than the initial spending? Follow the $10 million through the economy (Blanchard &
          Illing, 2021, 3.3). The road repairs are produced by construction firms and paid out as wages and profits:
          output and income rise by $10 million in the first round. Households spend 60 percent of the extra income, $6
          million, which becomes extra output and income in the second round. Of this, they spend $3.6 million in the
          third round, then $2.16 million, and so on. Each round is 0.6 times the previous one.

          The **[multiplier rounds](term:P3:multiplier_rounds)** become smaller and smaller, and their sum approaches

          > 10 × (1 + 0.6 + 0.6² + 0.6³ + …) = 10 × 1/(1 − 0.6) = $25 million.

          The rounds also show that the adjustment takes time. Each round requires firms to notice the higher demand and
          raise production, so the full effect builds up over quarters, not overnight. The chart below adds up the
          rounds.
        figure: {kind: multiplier_rounds, description: "Bars for the extra output of each round (10, 6, 3.6, ...) and a line for the cumulative total approaching 25."}
      - id: s4c
        sources:
          - {key: mankiw_2025, loc: "ch. 13"}
          - {key: blanchard_illing_2021, loc: "3.3"}
        text: |
          ### Taxes and autonomous consumption

          A tax change works differently. If the government raises taxes by $10 million, [disposable
          income](term:P3:disposable_income) falls by $10 million, but households cut [consumption](term:P2:consumption)
          only by c₁ times as much, $6 million, because they also save less. Autonomous spending therefore falls by $6
          million, and output by 2.5 × 6 = $15 million, to $885 million. The **[tax
          multiplier](term:P3:tax_multiplier)**,

          > tax multiplier = −c₁/(1 − c₁) = −1.5,

          is smaller in size than the multiplier for [government spending](term:P2:government_spending), because part of
          a tax change is absorbed by saving rather than by spending.

          Changes in households' behaviour are multiplied in the same way as changes in fiscal policy. If households
          become more cautious and cut autonomous consumption by $10 million, output falls by $25 million. A change of
          this kind is a **[demand shock](term:P3:demand_shock)**, a change in how much households and firms want to
          spend that does not come from the [policy rate](term:P4:policy_rate). The diagram now lets you change taxes
          and autonomous consumption as well.
        details:
          title: "The paradox of thrift"
          sources:
            - {key: blanchard_illing_2021, loc: "3.4"}
            - {key: mandeville_1714}
            - {key: keynes_1936, loc: "ch. 23"}
            - {key: mankiw_2025, loc: "ch. 4"}
          text: |
            The paradox of thrift, met as an example of why [macroeconomics](term:P1:macroeconomics) is needed ([chapter
            1](theory:P1-s2a)), can now be derived formally. Suppose households in the example economy decide to save $10
            million more, at every level of income: [autonomous consumption](term:P3:autonomous_consumption) falls from
            $68 million to $58 million. [Output](term:P1:output_GDP) falls by 2.5 × 10 = $25 million to $875 million.
            [Disposable income](term:P3:disposable_income) falls to $695 million and [consumption](term:P2:consumption) to
            58 + 0.6 × 695 = $475 million. [Private saving](term:P3:private_saving) is 695 − 475 = $220 million, exactly
            as much as before. Households tried to save more, but the fall in income reduced their saving by 0.4 × 25 =
            $10 million, which cancels their intention. The reason is the [equilibrium
            condition](term:P3:equilibrium_condition) I = S + (T − G): with [investment](term:P2:investment) and fiscal
            policy fixed, total saving cannot change. The attempt to save more only lowers output (Blanchard & Illing,
            2021, 3.4).

            The idea is old. In The Fable of the Bees (1714), Bernard Mandeville described a prosperous hive that
            collapses after its bees give up luxury and become frugal. Keynes (1936, ch. 23) cited Mandeville as a
            forerunner of his view that thrift, a virtue for the individual, can harm the economy as a whole: a fallacy of
            composition, in which what holds for each part does not hold for the whole.

            The paradox is a short-run result. It depends on investment being fixed. If more saving lowers interest rates
            and lower interest rates raise investment, which [chapter 4](theory:P4-s7b) shows, part of the extra saving
            finances extra investment. In the [long run](term:P3:long_run), higher saving raises the [capital
            stock](term:P6:capital_stock) and with it the economy's capacity to produce, the opposite conclusion, which
            [chapter 6](theory:P6-s3c) develops (Mankiw, 2025, ch. 4).
        module: {kind: keynesian_cross, controls: [G, c1, T, c0], show: [Z, "Y", S]}
      - id: s4d
        sources:
          - {key: blanchard_illing_2021, loc: "3.5"}
        text: |
          ### The limits of the model

          The model suggests that the government can set output wherever it wants by choosing G and T. Blanchard and
          Illing (2021, 3.5) ask whether the government is therefore omnipotent, and the answer is no. Changing spending
          or taxes takes time, both to decide and to take effect; the rounds of the multiplier take time to unfold; and
          households' and firms' reactions are harder to predict than the fixed parameters suggest. Above all, the model
          holds fixed several things that respond in reality: prices, which [chapter 4](theory:P4-s5) and [chapter
          5](theory:P5-s7b) add; the interest rate and with it investment, which [chapter 4](theory:P4-s7) adds; and
          expectations, which [chapter 5](theory:P5-s7c) takes up. A government that spends more may also borrow more,
          which raises questions this chapter leaves aside.

          The model therefore states the direction and the mechanism of demand effects precisely, but it overstates
          their size. It is the core of the IS relation of larger models, in which investment also responds to the
          interest rate.
        details:
          title: "From Kahn's multiplier to the fiscal-multiplier debate"
          sources:
            - {key: kahn_1931}
            - {key: keynes_1936, loc: "ch. 10"}
            - {key: ramey_2019}
          text: |
            The [multiplier](term:P3:multiplier) was first worked out by Richard Kahn, a young colleague of Keynes at
            Cambridge, in an article of 1931. Britain had suffered high unemployment throughout the 1920s, and the
            question was whether public works, such as road building, could reduce it. Kahn showed that the jobs created
            directly by public works were only the first round: the newly employed workers spent their wages and created
            further employment elsewhere. Keynes (1936, ch. 10) built the argument into the General Theory as the
            [investment](term:P2:investment) multiplier, and it became a cornerstone of the Keynesian case for fiscal
            policy in [recessions](term:P2:recession).

            How large is the multiplier in reality? With c₁ = 0.6, the model of this chapter predicts 2.5. Empirical
            estimates are much lower. After the financial crisis of 2008, many governments used fiscal policy to support
            demand, which revived research on its effects. Surveying this research, Valerie Ramey (2019) concludes that
            most estimates of the multiplier for [government spending](term:P2:government_spending) lie between about 0.6
            and 1, while identifying circumstances in which multipliers lie outside this range.

            The difference has identifiable causes, all of which this chapter holds fixed. Taxes rise with income, so each
            round leaks into tax payments as well as saving. In open economies, part of the extra spending goes to
            imports. Prices may rise. Above all, the [central bank](term:P1:central_bank) may raise interest rates in
            response, which lowers investment. The multiplier of this chapter is therefore best read as the effect when
            interest rates do not respond, for example because the central bank holds its [policy
            rate](term:P4:policy_rate) unchanged.
