# Chapter 3 of the theory section, "The goods market in the short run". Its texts are written from three textbooks
# (references.yaml) and name the section they rest on at the end of every paragraph. They use the glossary's terms and
# explanations, "government spending" and "the rate the economy needs", and they do not mention a game.
#   chapter  id, title, the learning objectives
#   cards    the term cards: term, core (the explanation; the glossary's own, lower case, where `glossary: true`), example,
#            aliases, see_also (a preview card's full card), box (false: never shown as a box), step (where the text defines it)
#   topics   id, title, objectives, steps: id, sources ({key, loc} into references.yaml), text (Markdown: [label](term:P4:id)
#            marks a term, [label](theory:P2-s1d) links a chapter, topic or step), module (one of the modules of modules.yaml
#            with this step's controls and view), figure (a static figure drawn from economy.yaml)

chapter:
  id: P3
  title: "The goods market in the short run"
  objectives:
    LO1: "Explain the short, medium and long run and why demand determines output in the short run."
    LO2: "Describe the demand for goods and the consumption function, with autonomous consumption, the marginal propensity to consume and disposable income."
    LO3: "Explain equilibrium output, read the Keynesian cross, explain how inventories drive the adjustment and why saving equals investment in equilibrium."
    LO4: "Explain the multiplier and how changes in government spending, taxes and autonomous consumption change output."

cards:
  short_run: {term: "Short run", core: "A period of a few years in which most prices and wages have not yet adjusted, so output follows demand: when people buy more, firms produce more.", example: "If households suddenly buy less bread, the bakery first bakes less, before it cuts its prices.", step: s1a}
  medium_run: {term: "Medium run", core: "A period of about a decade in which prices and wages have had time to adjust, so output returns to the level that workers and firms' capacity allow.", example: "After a slump, wages and prices adjust over several years, and output returns to its normal level.", step: s1a}
  long_run: {term: "Long run", core: "A period of several decades in which output depends on how much capital, labour and technology the economy has, not on demand.", example: "Over thirty years, better machines and more workers raise output far more than any change in demand.", step: s1a}
  price_stickiness: {term: "Price stickiness", core: "Many prices and wages change only now and then, not every day, so they react slowly when demand changes.", example: "A café reprints its menu once a year; a wage is agreed for a year at a time.", step: s1b}
  demand_determined_output: {term: "Demand-determined output", core: "In the short run, firms produce what customers buy at the current prices, as long as they have spare capacity: demand decides how much is produced.", example: "If households buy $10 million more bread, the bakery bakes $10 million more.", aliases: ["demand-determined"], step: s1b}
  demand_for_goods: {term: "Demand for goods (Z)", core: "Everything spent on an economy's goods and services in a year: households' consumption, firms' investment and government spending together.", example: "500 + 220 + 180 = $900 million.", step: s2a}
  exogenous_spending: {term: "Exogenous spending", core: "Spending that the model of the goods market takes as given instead of explaining it: firms' investment and government spending, together with the taxes the government collects.", example: "Investment of $220 million stays fixed, whatever output is.", step: s2a}
  taxes: {term: "Taxes (T)", core: "Taxes paid by households to the government, net of transfers received.", box: false, step: s2a}
  consumption_function: {term: "Consumption function", core: "The rule that describes how households' spending depends on their income after taxes: a basic amount they spend anyway, plus part of every extra dollar they receive.", example: "Households spend $68 million plus 60 cents of each dollar of disposable income: $500 million in total.", step: s2b}
  autonomous_consumption: {term: "Autonomous consumption (c₀)", core: "The part of household spending that does not depend on this year's income: people buy necessities anyway, out of savings or by borrowing.", example: "$68 million in the example economy.", step: s2b}
  marginal_propensity_to_consume: {term: "Marginal propensity to consume (c₁)", core: "The part of each extra dollar of income after taxes that households spend; the rest they save.", example: "With 0.6, a household that receives $100 more spends $60 more and saves $40.", step: s2b}
  disposable_income: {term: "Disposable income (YD)", core: "What households can actually spend or save: their income minus the taxes they pay, plus transfers such as pensions.", example: "Income of $900 million minus net taxes of $180 million: $720 million.", step: s2b}
  equilibrium_condition: {term: "Equilibrium condition", core: "Firms produce exactly as much as people buy, so that no unsold goods pile up and no shelves are emptied: production equals demand.", example: "At $900 million, everything produced is bought.", step: s3a}
  autonomous_spending: {term: "Autonomous spending", core: "All spending that does not depend on this year's income: the basic part of consumption, investment and government spending, less the consumption that taxes take away.", example: "$360 million in the example economy; through the multiplier it supports output of $900 million.", step: s3a}
  keynesian_cross: {term: "Keynesian cross", core: "A diagram with output along one axis and demand along the other: one line shows how much people want to buy at each level of output, a second line where the two are equal. They cross at equilibrium.", example: "The lines cross at $900 million.", step: s3b}
  unplanned_inventory_change: {term: "Unplanned inventory change", core: "Goods that firms produce but cannot sell, or extra goods they must sell from their stores, beyond what they planned. It tells firms to produce less, or more.", example: "Firms produce $950 million but sell only $930 million: $20 million of goods pile up unsold.", step: s3c}
  private_saving: {term: "Private saving (S)", core: "The part of households' income after taxes that they do not spend: it goes into bank accounts and other savings.", example: "$720 million of disposable income minus $500 million of consumption: $220 million.", step: s3d}
  public_saving: {term: "Public saving", core: "What the government saves: its tax revenue minus its spending. It is negative when the government spends more than it collects and must borrow.", example: "Taxes of $180 million minus government spending of $180 million: zero, a balanced budget.", step: s3d}
  saving_investment_identity: {term: "Saving equals investment", core: "In a closed economy, what households and the government save is exactly what firms invest: money not spent on consumption flows, through banks, into new machines and buildings.", example: "Private saving of $220 million finances investment of $220 million.", step: s3d}
  multiplier: {term: "Multiplier", core: "Why one extra dollar of spending raises total output by more than a dollar: the dollar becomes someone's income, who spends part of it, which becomes another person's income, and so on.", example: "The government pays $10 million for road repairs. The workers spend $6 million in shops, whose staff spend $3.6 million, and so on: output rises by $25 million.", step: s4a}
  multiplier_rounds: {term: "Multiplier rounds", core: "The steps by which extra spending spreads through the economy: each income received is partly spent and becomes the next person's income, and each round is smaller than the one before.", example: "$10 million, then $6 million, then $3.6 million, then $2.16 million: together $25 million.", step: s4b}
  tax_multiplier: {term: "Tax multiplier", core: "How much output falls when taxes rise by one dollar: households lose income and cut their spending by part of it, and that cut spreads through the economy like any other change in spending.", example: "Taxes rise by $10 million; households spend $6 million less, and in the end output falls by $15 million.", step: s4c}
  trend: {term: "Trend", core: "the path along which output grows over time, 2 percent a year", glossary: true, step: s1a}
  demand_shock: {term: "Demand shock", core: "a change in how much households and firms want to spend that does not come from the policy rate", example: "Households become more cautious and cut autonomous consumption by $10 million: output falls by $25 million.", aliases: ["demand shocks"], glossary: true, step: s4c}

topics:

  - id: s1
    title: "The Economy in the Short, Medium and Long Run"
    objectives: [LO1]
    steps:
      - id: s1a
        sources:
          - {key: blanchard_illing_2017, loc: "2.5"}
        text: |
          ### Three time horizons

          What determines [output](term:P1:output_GDP)? It depends on how far ahead one looks (Blanchard &
          Illing, 2017, 2.5).

          The **[short run](term:P3:short_run)** covers a few years. Here demand is in charge: when it weakens,
          as it does when households lose confidence, or strengthens, output follows into a
          [recession](term:P2:recession) or a boom (Blanchard & Illing, 2017, 2.5).

          Give the economy about a decade, the **[medium run](term:P3:medium_run)**, and supply takes over:
          output settles at what its capital, its labour force and its technology can deliver ([chapter
          5](theory:P5-s4b)) (Blanchard & Illing, 2017, 2.5).

          The **[long run](term:P3:long_run)** spans half a century and more. What counts over such a time is
          how fast a country builds up capital and technical knowledge ([chapter 6](theory:P6-s4c)) (Blanchard &
          Illing, 2017, 2.5).

          The chart below shows an output path that moves up and down around a rising [trend](term:P3:trend).
          The ups and downs belong to the short run, the return to the trend to the medium run, and the slope of
          the trend to the long run (Blanchard & Illing, 2017, 2.5).
        figure: {kind: horizons, description: "A fictional output path fluctuating around a rising trend, with the short, medium and long run marked."}
      - id: s1b
        sources:
          - {key: mankiw_2019, loc: "1-2, 10-2, 11-1"}
          - {key: blanchard_illing_2017, loc: "2.5"}
        text: |
          ### Why demand determines output in the short run

          Prices are what separates the horizons. Given enough time they move freely, up or down as supply and
          demand require. Over shorter spans many of them are sticky: for a while they stay at a level set
          earlier (Mankiw, 2019, 10-2).

          This **[price stickiness](term:P3:price_stickiness)** is common. Asked how often they change their
          prices, firms most often answer once or twice a year (Mankiw, 2019, 10-2). Wages can be tied down for
          as long as three years by a labour contract (Mankiw, 2019, 1-2).

          When prices do not adjust, output and employment have to do some of the adjusting (Mankiw, 2019,
          10-2). The models of this chapter therefore hold the [price level](term:P4:price_level) fixed, and
          firms produce what is demanded: output is **[demand-determined](term:P3:demand_determined_output)**,
          as Keynes proposed for the short run (as cited in Mankiw, 2019, 11-1).

          Over the medium run prices and wages do adjust, which [chapter 5](theory:P5-s7b) takes up (Blanchard &
          Illing, 2017, 2.5).

  - id: s2
    title: "The Demand Side of the Economy"
    objectives: [LO2]
    steps:
      - id: s2a
        sources:
          - {key: blanchard_illing_2017, loc: "3.2"}
          - {key: mankiw_2019, loc: "11-1"}
        text: |
          ### The components of demand

          In a [closed economy](term:P1:closed_economy), three kinds of spending make up the **[demand for
          goods](term:P3:demand_for_goods)**, written Z: [consumption](term:P2:consumption),
          [investment](term:P2:investment) and [government spending](term:P2:government_spending) (Blanchard &
          Illing, 2017, 3.2).

          > Z = C + I + G

          Z is what households, firms and the government want to buy. Whether firms produce exactly that amount
          is the question of the next topic (Mankiw, 2019, 11-1).

          A model has to say what each part of demand depends on. This chapter explains consumption and takes
          the rest as **[exogenous spending](term:P3:exogenous_spending)**. Investment is taken as given, which
          keeps the model simple; [chapter 4](theory:P4-s7) lets it depend on the interest rate. Government
          spending and **[taxes](term:P3:taxes)** T, which stand for taxes minus transfers, are set by the
          government and together make up fiscal policy (Blanchard & Illing, 2017, 3.2).

          In the example economy, firms invest $220 million a year. The government buys goods and services for
          $180 million and collects $180 million in taxes, so its budget is balanced.
      - id: s2b
        sources:
          - {key: blanchard_illing_2017, loc: "3.2"}
        text: |
          ### The consumption function

          For households, the main thing that decides how much they consume is their **[disposable
          income](term:P3:disposable_income)**: what is left of income once taxes are paid and transfers
          received (Blanchard & Illing, 2017, 3.2).

          > YD = Y − T

          The **[consumption function](term:P3:consumption_function)** describes this link, here as a straight
          line (Blanchard & Illing, 2017, 3.2).

          > C = c₀ + c₁ × (Y − T)

          The line has two parameters. **[Autonomous consumption](term:P3:autonomous_consumption)**, c₀, is the
          spending that would remain if this year's income were zero, financed from wealth or by borrowing. The
          slope c₁, the **[marginal propensity to consume](term:P3:marginal_propensity_to_consume)**, tells how
          many cents of each further dollar of disposable income are spent. The rest is saved, so c₁ lies
          between 0 and 1 (Blanchard & Illing, 2017, 3.2).

          In the example economy, c₁ = 0.6 and c₀ = $68 million. With income of $900 million and taxes of $180
          million, disposable income is $720 million, and consumption is 68 + 0.6 × 720 = $500 million.

  - id: s3
    title: "Equilibrium in the Goods Market"
    objectives: [LO3]
    steps:
      - id: s3a
        sources:
          - {key: blanchard_illing_2017, loc: "3.3"}
        text: |
          ### The equilibrium condition

          The goods market is in equilibrium when production equals demand. This is the **[equilibrium
          condition](term:P3:equilibrium_condition)** (Blanchard & Illing, 2017, 3.3).

          > Y = Z

          Putting in the parts of demand gives Y = c₀ + c₁(Y − T) + I + G. [Output](term:P1:output_GDP) stands
          on both sides, because production creates income and income drives [consumption](term:P2:consumption).
          Solving for Y gives equilibrium output (Blanchard & Illing, 2017, 3.3).

          > Y = 1/(1 − c₁) × (c₀ + I + G − c₁T)

          The term in brackets is **[autonomous spending](term:P3:autonomous_spending)**, the part of demand
          that does not depend on output. The factor in front is the [multiplier](term:P3:multiplier). It is
          larger than one, because c₁ lies between 0 and 1 (Blanchard & Illing, 2017, 3.3).

          In the example economy, autonomous spending is 68 + 220 + 180 − 0.6 × 180 = $360 million, and the
          factor is 1/(1 − 0.6) = 2.5. Equilibrium output is 2.5 × 360 = $900 million.
      - id: s3b
        sources:
          - {key: mankiw_2019, loc: "11-1"}
          - {key: blanchard_illing_2017, loc: "3.2"}
        text: |
          ### The Keynesian cross

          The same equilibrium can be drawn as the **[Keynesian cross](term:P3:keynesian_cross)**, with output
          on the horizontal axis and demand on the vertical one. The demand line rises with output, and its
          slope is the marginal propensity to consume: each extra dollar of income raises demand by c₁ dollars.
          On the 45-degree line, output and demand are equal. Equilibrium is where the two lines cross (Mankiw,
          2019, 11-1).

          Because c₁ is smaller than one, the demand line is flatter than the 45-degree line (Blanchard &
          Illing, 2017, 3.2).

          In the diagram below, which shows the example economy, the two lines cross at $900 million.
        module: {kind: keynesian_cross, controls: [], show: [Z, "Y"]}
      - id: s3c
        sources:
          - {key: mankiw_2019, loc: "11-1"}
        text: |
          ### How output adjusts: inventories

          What moves output to this point? When firms sell less than they planned, their stocks of unsold goods
          rise; when they sell more, their stocks fall. Such an **[unplanned inventory
          change](term:P3:unplanned_inventory_change)** counts as [investment](term:P2:investment) in the
          accounts, and it tells firms to change production (Mankiw, 2019, 11-1).

          Suppose firms in the example economy produce $950 million. Income is then $950 million, [disposable
          income](term:P3:disposable_income) $770 million and consumption 68 + 0.6 × 770 = $530 million, so
          demand is 530 + 220 + 180 = $930 million. Unsold goods worth $20 million pile up, and firms cut
          production. If they produce $850 million instead, demand is $870 million, stocks fall by $20 million,
          and firms raise production. Only at $900 million do they sell exactly what they produce.

          At that point everyone's plans work out, so nothing pushes production to change (Mankiw, 2019, 11-1).
      - id: s3d
        sources:
          - {key: blanchard_illing_2017, loc: "3.4"}
        text: |
          ### Saving equals investment

          Equilibrium can be stated in a second way. Households save what remains of disposable income after
          consumption, their **[private saving](term:P3:private_saving)** S = Y − T − C. The government saves T
          − G, its **[public saving](term:P3:public_saving)**, which turns negative when the budget is in
          deficit (Blanchard & Illing, 2017, 3.4).

          Subtracting taxes and consumption on both sides of Y = C + I + G gives the condition in a new form
          (Blanchard & Illing, 2017, 3.4).

          > I = S + (T − G)

          Different people take these decisions: firms invest, households and the government save. The goods
          market is in equilibrium exactly when the two sides match, that is when investment equals private plus
          public saving (Blanchard & Illing, 2017, 3.4).

          In the example economy, private saving is 720 − 500 = $220 million and public saving is 180 − 180 = 0,
          so total [saving equals investment](term:P3:saving_investment_identity) of $220 million. From now on,
          the diagram also shows private saving.
        module: {kind: keynesian_cross, controls: [], show: [Z, "Y", S]}

  - id: s4
    title: "The Multiplier"
    objectives: [LO4]
    steps:
      - id: s4a
        sources:
          - {key: blanchard_illing_2017, loc: "3.3"}
        text: |
          ### The multiplier

          Suppose the government of the example economy raises its spending by $10 million. [Autonomous
          spending](term:P3:autonomous_spending) rises by $10 million, and equilibrium
          [output](term:P1:output_GDP) rises by 2.5 times as much, by $25 million, to $925 million.

          The factor 1/(1 − c₁) is the **[multiplier](term:P3:multiplier)**. Any change in autonomous spending,
          be it in [investment](term:P2:investment), in government spending or in [autonomous
          consumption](term:P3:autonomous_consumption), changes output by more than itself (Blanchard & Illing,
          2017, 3.3).

          > multiplier = 1/(1 − c₁)

          The larger the [marginal propensity to consume](term:P3:marginal_propensity_to_consume), the larger
          the multiplier, because each rise in income then feeds more consumption (Blanchard & Illing, 2017,
          3.3).

          Raise G in the diagram below and watch the demand line shift up and the crossing move right by 2.5
          times the shift. Then change c₁ and watch the demand line turn.
        module: {kind: keynesian_cross, controls: [G, c1], show: [Z, "Y", S]}
      - id: s4b
        sources:
          - {key: blanchard_illing_2017, loc: "3.3"}
          - {key: mankiw_2019, loc: "11-1"}
        text: |
          ### The multiplier rounds

          Why is the effect larger than the first push? Because the push starts a loop: the extra spending is
          someone's income, part of that income is spent, and this spending is income once more (Blanchard &
          Illing, 2017, 3.3).

          In the example economy, the $10 million of road repairs become income in the first round. Households
          spend 60 percent of it, $6 million, which becomes income in the second round. Of this they spend $3.6
          million, then $2.16 million, and so on. Each round is 0.6 times the one before.

          The **[multiplier rounds](term:P3:multiplier_rounds)** grow smaller and smaller, and their sum is a
          geometric series (Mankiw, 2019, 11-1).

          > 10 × (1 + 0.6 + 0.6² + 0.6³ + …) = 10 × 1/(1 − 0.6) = $25 million

          None of this happens at once. Firms first meet extra demand from their stocks and raise production
          only later, and households, too, are slow to spend a higher income (Blanchard & Illing, 2017, 3.3).
        figure: {kind: multiplier_rounds, description: "Bars for the extra output of each round (10, 6, 3.6, ...) and a line for the cumulative total approaching 25."}
      - id: s4c
        sources:
          - {key: mankiw_2019, loc: "11-1"}
          - {key: blanchard_illing_2017, loc: "3.3"}
        text: |
          ### Taxes and autonomous consumption

          A change in taxes works through [disposable income](term:P3:disposable_income). A tax cut raises
          disposable income by its full amount, but consumption only by c₁ times that amount, and this first
          change in spending is then multiplied like any other. The **[tax multiplier](term:P3:tax_multiplier)**
          is therefore smaller in size than the multiplier for [government
          spending](term:P2:government_spending), and it is negative, since output moves against taxes (Mankiw,
          2019, 11-1).

          > tax multiplier = −c₁/(1 − c₁)

          In the example economy, the tax multiplier is −1.5: a tax rise of $10 million cuts
          [consumption](term:P2:consumption) by $6 million and output by $15 million, to $885 million. If
          households become more cautious and cut autonomous consumption by $10 million, output falls by $25
          million.

          A change of the second kind is a **[demand shock](term:P3:demand_shock)**, a change in how much
          households and firms want to spend that does not come from the [policy rate](term:P4:policy_rate). It
          is multiplied in the same way as a change in fiscal policy (Blanchard & Illing, 2017, 3.3).

          Change taxes and autonomous consumption in the diagram below as well.
        module: {kind: keynesian_cross, controls: [G, c1, "T", c0], show: [Z, "Y", S]}
      - id: s4d
        sources:
          - {key: blanchard_illing_2017, loc: "3.5"}
        text: |
          ### The limits of the model

          The model suggests that a government could reach any level of output by choosing its spending and
          taxes. Blanchard and Illing warn that it cannot (Blanchard & Illing, 2017, 3.5).

          The obstacles are of three kinds. Budgets are slow to change, because laws have to pass first. The
          response is hard to predict: investment moves too, and households ask whether a tax cut will last
          before they spend it. And success has a price, since higher output may raise
          [inflation](term:P4:inflation_rate), while deficits add to the public debt (Blanchard & Illing, 2017,
          3.5).

          In the short run, fiscal policy does move demand and output. The following chapters add what this
          model holds fixed: the interest rate and investment in [chapter 4](theory:P4-s7), prices and
          expectations in [chapter 5](theory:P5-s7b) (Blanchard & Illing, 2017, 3.5).
